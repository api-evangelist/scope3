sdk_gap:
  note: >-
    Scope3 ships no client library for the Interchange Buyer or Storefront v2 APIs — the 481
    published operations at api.interchange.io have no first-party SDK in any language. The
    documented integration paths are the hosted MCP endpoints (OAuth connectors) and raw REST.
    The `scope3` npm package predates the Interchange move and targets the older
    api.agentic.scope3.com base.
