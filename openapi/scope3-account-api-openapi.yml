    CreateChildAccountResponse:
      description: Full user context scoped to the new child customer
      type: object
      properties:
        user:
          description: User profile data
          type: object
          properties: {}
          additionalProperties: {}
        customer:
          description: Customer context for the newly created child
          type: object
          properties: {}
          additionalProperties: {}
        customers:
          description: All accessible customer accounts
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: {}
        showTosBox:
          description: Whether to show the ToS acceptance dialog
          type: boolean
        canAcceptTos:
          description: Whether the current user may accept Terms of Service for the organization governing this child.
          type: boolean
        tosUpdate:
          description: Successor Terms of Service context inherited from the organization.
          type: object
          properties:
            action:
              type: string
              enum:
              - notice
              - acceptance_due
              - acceptance_required
            changeLevel:
              type: string
              enum:
              - PATCH
              - MINOR
              - MAJOR
            acceptedVersion:
              type:
              - string
              - 'null'
            targetVersion:
              type: string
            deadline:
              type:
              - string
              - 'null'
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            termsUrl:
              type: string
            changesUrl:
              type:
              - string
              - 'null'
          required:
          - action
          - changeLevel
          - acceptedVersion
          - targetVersion
          - deadline
          - termsUrl
          - changesUrl
          additionalProperties: false
        organizationContractMissing:
          description: True when the newly created account cannot operate because the organization it inherits from has no active contract. UI should render a block page until an organization admin accepts ToS.
          type: boolean
        hasContract:
          description: Whether the customer has an active contract
          type: boolean
        latestTosVersion:
          description: Latest embedded sales agent version identifier
          type: string
        convertedFromStandalone:
          description: True if the request triggered a standalone-to-parent conversion
          type: boolean
      required:
      - user
      - customer
      - customers
      - showTosBox
      - canAcceptTos
      - hasContract
      - latestTosVersion
      - convertedFromStandalone
      additionalProperties: false
    CreateBrowserOriginBody:
      type: object
      properties:
        origin:
          description: Exact HTTPS browser origin to allow for browser MCP/OAuth calls. Do not include a path, query, fragment, wildcard, or userinfo.
          example: https://mcp.example.com
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^https:\/\/[^/?#@]+$
        label:
          description: Optional human-readable label
          type: string
          minLength: 1
          maxLength: 120
      required:
      - origin
    CreateChildAccountBody:
      description: Request body for creating a child customer account
      type: object
      properties:
        name:
          description: Name for the new child account
          example: Nike
          type: string
          minLength: 1
          maxLength: 255
        customerRole:
          description: Whether the account is a buyer or seller
          example: BUYER
          type: string
          enum:
          - BUYER
          - SELLER
        parentName:
          description: Name for the parent account created during standalone conversion. Defaults to "{company} (Admin)" if omitted.
          example: Acme HQ
          type: string
          minLength: 1
          maxLength: 255
        customerDomain:
          description: Registered organization domain. For SELLER accounts, also seeds the auto-created storefront's publisher and operator domain.
          example: nike.com
          type: string
          maxLength: 255
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
        defaultCurrency:
          description: For SELLER accounts, seller-confirmed primary settlement currency (ISO-4217) for the auto-created storefront.
          example: USD
          type: string
          pattern: ^[A-Z]{3}$
        paymentCurrencies:
          description: For SELLER accounts, ISO-4217 currencies the auto-created storefront will be paid in. The primary defaultCurrency must be included when both are provided.
          example:
          - USD
          - EUR
          maxItems: 25
          type: array
          items:
            type: string
            pattern: ^[A-Z]{3}$
        accountMode:
          description: Internal account provisioning mode. DEMO is restricted to Scope3 platform administrators and provisions a leased synthetic Storefront.
          example: STANDARD
          default: STANDARD
          type: string
          enum:
          - STANDARD
          - DEMO
        demoRecipeIds:
          description: Versioned synthetic source recipes to attach when accountMode is DEMO.
          example:
          - sample-publisher-display
          - sample-publisher-ctv
          - sample-retail-media
          minItems: 1
          maxItems: 3
          type: array
          items:
            type: string
            enum:
            - sample-publisher-display
            - sample-publisher-ctv
            - sample-retail-media
      required:
      - name
      - customerRole
    BuyerReadinessCheck:
      type: object
      properties:
        id:
          type: string
          enum:
          - operator_identity
          - terms
          - account_standing
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - complete
          - missing
          - blocked
        isBlocker:
          type: boolean
        action:
          allOf:
          - $ref: '#/components/schemas/BuyerReadinessAction'
      required:
      - id
      - name
      - description
      - status
      - isBlocker
      - action
      additionalProperties: false
    BuyerReadinessAction:
      description: Server-owned continuation for one buyer setup step. Operations are executed through buyer api_call; pages are opened through their typed owner.
      type: object
      properties:
        label:
          type: string
        operation:
          type:
          - string
          - 'null'
        pathParams:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        page:
          type:
          - string
          - 'null'
      required:
      - label
      - operation
      - pathParams
      - page
      additionalProperties: false
    BrowserOrigin:
      type: object
      properties:
        id:
          description: Browser origin registration ID
          type: string
        customerId:
          description: Customer account that owns this origin
          type: integer
          maximum: 9007199254740991
          minimum: 1
        origin:
          description: Exact browser origin, e.g. https://mcp.example.com
          type: string
          format: uri
        label:
          description: Optional human-readable label for this origin
          type:
          - string
          - 'null'
        createdByUserId:
          description: User who registered the origin, when known
          type:
          - integer
          - 'null'
          maximum: 9007199254740991
          minimum: 1
        createdAt:
          description: When this origin was registered
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          description: When this origin was last updated
