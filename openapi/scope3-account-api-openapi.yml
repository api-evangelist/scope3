    servers:
    - url: https://api.interchange.io/api/v2/buyer
      description: Production server
  /accounts/liveness:
    servers:
    - url: https://api.interchange.io/api/v2
      description: Production server
    get:
      operationId: getAccountsLiveness
      summary: Get storefront liveness for accounts
      description: Batched storefront liveness for the requested seller customer ids — one derived verdict per storefront (setup, live, live_attention, or live_critical) computed from persisted signals, powering the per-storefront status dot in the account switcher. Ids the caller cannot access are silently omitted.
      tags:
      - Account
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: customerIds
        schema:
          description: Comma-separated seller customer ids to resolve liveness for (e.g. "123,456"). Ids the caller cannot access are silently omitted from the response; when absent or empty the response map is empty.
          type: string
        description: Comma-separated seller customer ids to resolve liveness for (e.g. "123,456"). Ids the caller cannot access are silently omitted from the response; when absent or empty the response map is empty.
      responses:
        '200':
          description: Get storefront liveness for accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontLivenessBatchResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
