  /esa/{esaId}/inventory/selectors:
    get:
      operationId: searchEsaAdServerSelectors
      summary: Search inventory selectors for an ad server source
      description: Search one ad-server selector dimension (ad units, placements, etc.) for inventory that can back a product. `selectorType` is required; optional `mediaType` and `environmentType` filters are forwarded to ad-server sources that support media/environment-scoped inventory browsing. The response body is the upstream adapter's paginated payload and varies by ad server.
      tags:
      - Storefront Ad Server Catalog
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: selectorType
        schema:
          description: Which ad-server selector dimension to search (adapter-defined, e.g. ad_unit, placement). Required.
          type: string
        required: true
        description: Which ad-server selector dimension to search (adapter-defined, e.g. ad_unit, placement). Required.
      - in: query
        name: q
        schema:
          description: Selector name search.
          type: string
        description: Selector name search.
      - in: query
        name: parentId
        schema:
          description: Restrict to children of this selector.
          type: string
        description: Restrict to children of this selector.
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: mediaType
        schema:
          description: Restrict selectors to inventory matching the requested media type.
          type: string
          enum:
          - display
          - video
        description: Restrict selectors to inventory matching the requested media type.
      - in: query
        name: environmentType
        schema:
          description: Restrict selectors to inventory matching the requested ad-server environment.
          type: string
          enum:
          - BROWSER
          - VIDEO_PLAYER
        description: Restrict selectors to inventory matching the requested ad-server environment.
      - in: path
        name: esaId
        schema:
          description: Ad server source connection id. The wire field remains `esaId` for API compatibility.
          example: 123
          type: integer
          maximum: 9007199254740991
          minimum: 1
        required: true
        description: Ad server source connection id. The wire field remains `esaId` for API compatibility.
      responses:
        '200':
          description: Search inventory selectors for an ad server source
        '400':
          description: '`selectorType` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No ad server source with this id, or the source is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /esa/{esaId}/creative-formats:
    get:
      operationId: listEsaCreativeFormats
      summary: List creative formats for an ad server source
      description: List the creative formats available on the ad server source's upstream tenant, optionally filtered by name or asset type. The response body is the upstream adapter's payload and varies by ad server.
      tags:
      - Storefront Ad Server Catalog
      security:
      - bearerAuth: []
      parameters:
