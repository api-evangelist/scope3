          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    EsaSignalResponse:
      type: object
      additionalProperties: {}
    EsaProductUpdateBody:
      description: Full salesagent WholesaleProductRequest update body for an ad-server source product. The upstream endpoint requires a complete replacement body; unknown/extra fields are forwarded as-is.
      type: object
      properties:
        wholesale_product_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        delivery_type:
          type: string
        format_options:
          type: array
          items:
            $ref: '#/components/schemas/EsaCanonicalProductFormatOption'
        inventory:
          type: object
          additionalProperties: {}
      additionalProperties: {}
    VendorPricingOption:
      description: AdCP vendor pricing option. A signal carries zero or more; absence means the signal is free. Forwarded verbatim to the managed ad-server source.
      allOf:
      - type: object
        properties:
          pricing_option_id:
            type: string
          applies_to_output_format_ids:
            type: array
            items: {}
        required:
        - pricing_option_id
        additionalProperties: {}
      - oneOf:
        - type: object
          properties:
            model:
              type: string
              enum:
              - cpm
            cpm:
              type: number
            currency:
              type: string
          required:
          - model
          - cpm
          - currency
          additionalProperties: {}
        - type: object
          properties:
            model:
              type: string
              enum:
              - percent_of_media
            percent:
              type: number
            max_cpm:
              type: number
            currency:
              type: string
          required:
          - model
          - percent
          - currency
          additionalProperties: {}
        - type: object
          properties:
            model:
              type: string
              enum:
              - flat_fee
            amount:
              type: number
            period:
              type: string
              enum:
              - monthly
              - quarterly
              - annual
              - campaign
            currency:
              type: string
          required:
          - model
          - amount
          - period
          - currency
          additionalProperties: {}
        - type: object
          properties:
            model:
              type: string
              enum:
              - per_unit
            unit:
              type: string
            unit_price:
              type: number
            currency:
              type: string
          required:
          - model
          - unit
          - unit_price
          - currency
          additionalProperties: {}
        - type: object
          properties:
            model:
              type: string
              enum:
              - custom
            description:
              type: string
            currency:
              type: string
          required:
          - model
          - description
          additionalProperties: {}
        type: object
    EsaSignalListEnvelope:
      type: object
      properties:
        signals:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - signals
      additionalProperties: false
    EsaCanonicalProductFormatOption:
      description: URL-free AdCP 3.1 product format declaration. Canonical formats use format_kind plus params and never agent_url; publisher-backed options pair format_option_id with publisher_domain.
      type: object
      properties:
        format_option_id:
          type: string
        publisher_domain:
          description: Publisher catalog namespace for format_option_id. Omit for product-local format options.
          type: string
          maxLength: 253
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
        format_kind:
          anyOf:
          - type: string
            enum:
            - image
          - type: string
            enum:
            - html5
          - type: string
            enum:
            - display_tag
          - type: string
            enum:
            - image_carousel
          - type: string
            enum:
            - video_hosted
          - type: string
            enum:
            - video_vast
          - type: string
            enum:
            - audio_hosted
          - type: string
            enum:
            - audio_daast
          - type: string
            enum:
            - sponsored_placement
          - type: string
            enum:
            - native_in_feed
          - type: string
            enum:
            - responsive_creative
          - type: string
            enum:
            - agent_placement
          - type: string
            enum:
            - custom
        params:
          type: object
          additionalProperties: {}
      required:
      - format_kind
      - params
      additionalProperties: false
    ErrorResponse:
      description: Standard error response
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          enum:
          - null
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - data
      - error
      additionalProperties: false
    EsaAllowedPublisherSelector:
      type: object
      properties:
        publisherDomain:
          description: The parent publisher domain from the source's publisher record. For a network whose properties represent individual sites, this is the network domain, not a represented site.
          type: string
        selectionType:
          description: Whether the option covers every property on the domain, specific property ids, or specific property tags.
          type: string
          enum:
          - all
          - by_id
          - by_tag
        propertyIds:
          type: array
          items:
            type: string
        propertyTags:
          type: array
          items:
            type: string
        label:
          description: Human-readable option label.
          type: string
      required:
      - publisherDomain
      - selectionType
      - label
      additionalProperties: false
    EsaProductListEnvelope:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - products
      additionalProperties: false
    ApiError:
      description: Structured error object
      type: object
      properties:
        code:
          description: Machine-readable error code
          type: string
        message:
          description: Human-readable error message
          type: string
        field:
          description: Field path associated with the error
          type: string
        details:
          description: Additional error context
          type: object
          additionalProperties: {}
      required:
      - code
      - message
      additionalProperties: false
    EsaProductPatchBody:
      description: Partial change body for an ad-server-source product. Only the fields present are applied; an omitted field — or one sent as null — keeps its stored value, and `inventory` merges one level deep. Unknown/extra fields are forwarded as-is.
      type: object
      properties:
        wholesale_product_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        delivery_type:
          type:
          - string
          - 'null'
        format_options:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: {}
        inventory:
          type:
          - object
          - 'null'
          additionalProperties: {}
      additionalProperties: {}
    EsaPublisherPropertyListEnvelope:
      type: object
      properties:
        properties:
          type: array
          items:
            type: object
            additionalProperties: {}
        allowedSelectors:
          description: 'The coverage selectors this source has recorded and will accept on a product. Declare `inventory.publisher_properties` from these rather than deriving a domain from `properties`: `publisher_domain` must match the parent domain in an advertised selector, while a property''s own identifiers may name a represented site instead. Selector availability depends on the source record, not publisher verification.'
          type: array
          items:
            $ref: '#/components/schemas/EsaAllowedPublisherSelector'
      required:
      - properties
      - allowedSelectors
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key or access token
