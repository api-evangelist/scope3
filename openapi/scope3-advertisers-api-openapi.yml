  /advertisers/{advertiserId}/catalogs/sync:
    post:
      operationId: syncCatalogs
      summary: Sync catalogs
      description: Inbound ADCP sync_catalogs endpoint. Buyers call this to sync their catalogs and items to the advertiser.
      tags:
      - Advertisers
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: advertiserId
        schema:
          description: Unique identifier for the advertiser
          example: '12345'
          type: string
          minLength: 1
        required: true
        description: Unique identifier for the advertiser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  description: Advertiser account to sync catalogs onto
                  type: object
                  properties:
                    account_id:
                      description: Advertiser ID to attach catalogs to
                      example: '12345'
                      type: string
                      minLength: 1
                  required:
                  - account_id
                catalogs:
                  description: Catalog feeds to sync (up to 50 per call)
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      catalog_id:
                        description: Buyer-assigned catalog identifier
                        example: my-summer-products
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                        - offering
                        - product
                        - inventory
                        - store
                        - promotion
                        - hotel
                        - flight
                        - job
                        - vehicle
                        - real_estate
                        - education
                        - destination
                        - app
                      name:
                        description: Display name for the catalog
                        example: Summer Sale 2026
                        type: string
                        minLength: 1
                        maxLength: 255
                      url:
                        description: Remote feed URL (provide this or items, not both)
                        example: https://feeds.example.com/products.xml
                        type: string
                        format: uri
                      feed_format:
                        type: string
                        enum:
                        - google_merchant_center
                        - facebook_catalog
                        - shopify
                        - linkedin_jobs
                        - tiktok_shop
                        - pinterest_catalog
                        - openai_product_feed
                        - custom
                      update_frequency:
                        type: string
                        enum:
                        - realtime
                        - hourly
                        - daily
                        - weekly
                      items:
                        description: Inline catalog items (provide this or url, not both)
                        maxItems: 10000
                        type: array
                        items:
                          description: An individual catalog item (product, offering, job, etc.)
                          type: object
                          additionalProperties: {}
                      conversion_events:
                        description: Conversion event IDs linked to this catalog
                        example:
                        - purchase
                        - add_to_cart
                        type: array
                        items:
                          type: string
                    required:
                    - catalog_id
                    - type
                catalog_ids:
                  description: 'Optional: only process these catalog_ids from the catalogs array'
                  type: array
                  items:
                    type: string
                delete_missing:
                  description: Archive buyer-managed catalogs not included in this request
                  default: false
                  type: boolean
                dry_run:
                  description: Preview changes without persisting to the database
                  default: false
                  type: boolean
                validation_mode:
                  description: Item validation strictness
                  default: strict
                  type: string
                  enum:
                  - strict
                  - lenient
              required:
              - account
              - catalogs
      responses:
        '200':
          description: Sync catalogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalogs:
                    type: array
                    items:
                      type: object
                      properties:
                        catalog_id:
                          type: string
                        action:
                          type: string
                          enum:
                          - created
                          - updated
                          - unchanged
                          - failed
                          - deleted
                        platform_id:
                          type: string
                        catalog_version_id:
                          type: string
                        catalog_version_number:
                          type: integer
                          maximum: 9007199254740991
                          minimum: 1
                        content_hash:
                          type: string
                        item_count:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        items_approved:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        items_pending:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        items_rejected:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        item_changes:
                          type: object
                          properties:
                            added:
                              default: 0
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            updated:
                              default: 0
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            unchanged:
                              default: 0
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            removed:
                              default: 0
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                          required:
                          - added
                          - updated
                          - unchanged
                          - removed
                          additionalProperties: false
                        health_status:
                          type: string
                          enum:
                          - not_synced
                          - healthy
                          - stale
                          - warning
                          - failed
                        activation_plan_id:
                          type: string
                        item_issues:
                          type: array
                          items:
                            type: object
                            properties:
                              item_id:
                                type: string
                              field:
                                type: string
                              issue:
                                type: string
                              severity:
                                type: string
                                enum:
                                - error
                                - warning
                            required:
                            - issue
                            additionalProperties: false
                        last_synced_at:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        next_fetch_at:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        error:
                          type: string
                      required:
                      - catalog_id
                      - action
                      additionalProperties: false
                  dry_run:
                    type: boolean
                required:
                - catalogs
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /advertisers/{advertiserId}/catalogs/{catalogId}/transform:
    put:
      operationId: saveCatalogTransform
      summary: Save catalog transform
      description: Save the active deterministic transform that maps catalog feed items into campaign groups, creative prompt cache keys, and budget hints.
      tags:
      - Advertisers
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: advertiserId
        schema:
          description: Advertiser ID
          type: string
          minLength: 1
        required: true
        description: Advertiser ID
      - in: path
        name: catalogId
        schema:
          description: Buyer-assigned catalog_id or platform catalog id returned by list catalogs
          type: string
          minLength: 1
        required: true
        description: Buyer-assigned catalog_id or platform catalog id returned by list catalogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                transform:
                  type: object
                  properties:
                    fields:
                      default: []
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            description: Derived field key made available to grouping and template rules
                            example: city
                            type: string
                            minLength: 1
                            pattern: ^[A-Za-z][A-Za-z0-9_]*$
                          source:
                            description: Dot-path into the raw catalog item, for example location.city
                            example: location.city
                            type: string
                            minLength: 1
                          template:
                            description: Template using {{field}} placeholders from raw or derived fields
                            example: '{{title}} in {{city}}'
                            type: string
                            minLength: 1
                          default:
                            description: Fallback value when source or template resolves empty
                          transform:
                            description: Optional deterministic value normalization
                            type: string
                            enum:
                            - string
                            - lowercase
                            - uppercase
                            - title_case
                            - slug
                        required:
                        - key
                    campaign:
                      type: object
                      properties:
                        groupBy:
                          description: Field references used to create campaign groups, usually derived fields such as city
                          example:
                          - city
                          minItems: 1
                          type: array
                          items:
                            type: string
                            minLength: 1
                        keyTemplate:
                          description: Optional campaign group key template
                          example: loetje-jobs-{{citySlug}}
                          type: string
                          minLength: 1
                        nameTemplate:
                          description: Human-readable campaign name template
