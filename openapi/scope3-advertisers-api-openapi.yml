          - AZURE_BLOB
        pathPrefix:
          description: Blob name prefix within the credential's Azure container. Leading slashes are not stripped. The tokens {YYYY}, {MM}, {DD}, {HH} (from the delivery period start, UTC) and {DATA_DELIVERY_TYPE} are substituted at delivery time — e.g. "lld/{YYYY}/{MM}/{DD}/{HH}/{DATA_DELIVERY_TYPE}/" → "lld/2026/06/03/14/IMPRESSIONS/". Any other text is used verbatim.
          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
      - pathPrefix
      - format
      additionalProperties: false
    FrequencyCapTargetLevel:
      description: Level of the entity the frequency cap applies to
      type: string
      enum:
      - ADVERTISER
      - CAMPAIGN
      - CREATIVE
    AzureBlobDeliveryConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - AZURE_BLOB
        pathPrefix:
          description: Blob name prefix within the credential's Azure container. Leading slashes are not stripped. The tokens {YYYY}, {MM}, {DD}, {HH} (from the delivery period start, UTC) and {DATA_DELIVERY_TYPE} are substituted at delivery time — e.g. "lld/{YYYY}/{MM}/{DD}/{HH}/{DATA_DELIVERY_TYPE}/" → "lld/2026/06/03/14/IMPRESSIONS/". Any other text is used verbatim.
          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
    AzureBlobSasAuthInput:
      type: object
      properties:
        mode:
          type: string
          enum:
          - SAS_TOKEN
        sasToken:
          description: Shared Access Signature (SAS) query string. Provide the part after the `?` from the SAS URL — leading `?` is tolerated. Accepts either a Service SAS scoped to the container (`sr=c`) or an Account SAS with `srt` including `o` (Object); blob-scoped Service SAS (`sr=b`) is not supported because the Probe writes to a randomized path. The SAS must grant Create + Write + Delete (`sp=cwd`). Persisted to Google Secret Manager; the credential row stores only a resource reference. Not returned on subsequent GETs — to rotate, submit a new credential.
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - mode
      - sasToken
    CreateAdvertiserBody:
      description: Request body for creating a new advertiser
      type: object
      properties:
        name:
          description: Name of the advertiser
          example: Acme Corp
          type: string
          minLength: 1
          maxLength: 255
        description:
          description: Optional description of the advertiser
          example: Global advertising account for Acme Corporation
          type: string
          maxLength: 1000
        brand:
          description: Brand domain (e.g., "nike.com") or brand website URL. Brand identity is resolved from /.well-known/brand.json, the AdCP registry, or Brandfetch enrichment.
          example: nike.com
          type: string
          minLength: 1
        saveBrand:
          description: When true, auto-saves the resolved brand identity to the AdCP registry if the brand is not yet registered. Normally not required for advertiser creation when enrichment succeeds; set this only after reviewing enrichment or when the user confirms registry persistence is desired.
          default: false
          type: boolean
        linkedAccounts:
          description: Accounts to link to this advertiser at creation time. Each entry references a discovered account from a partner.
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccountInput'
        optimizationApplyMode:
          description: Default mode for applying Scope3 AI model optimizations to media buys for campaigns under this advertiser. When set to "AUTO", optimizations are applied automatically; when "MANUAL", they require approval. Defaults to "MANUAL".
          allOf:
          - $ref: '#/components/schemas/OptimizationApplyMode'
        primaryCurrency:
          description: Primary ISO 4217 currency for this advertiser. Required. Every campaign under this advertiser is created in this currency, and media-buy product pricing must match it. The currency can be changed (via update_advertiser) only until the advertiser has its first campaign, after which it is locked.
          example: USD
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Za-z]{3}$
        sandbox:
          description: When true, this advertiser operates in sandbox mode. All ADCP operations will use sandbox-flagged accounts — no real platform calls, no real spend. Cannot be changed after creation.
          default: false
          type: boolean
        utmConfig:
          description: Default UTM (Urchin Tracking Module) parameters for this advertiser. These are appended to landing page URLs during clickthrough redirection. Campaign-level UTM config can override these per param key.
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              paramKey:
                description: Output query parameter key appended to landing URL (e.g., "utm_source", "bg_campaign")
                example: utm_campaign
                type: string
                pattern: ^[a-zA-Z0-9_-]{1,100}$
              paramValue:
                description: Macro name (e.g., "{CAMPAIGN_ID}") or static string (e.g., "scope3") to resolve as the value
                example: '{CAMPAIGN_ID}'
                type: string
                minLength: 1
                maxLength: 200
            required:
            - paramKey
            - paramValue
        dataDelivery:
          $ref: '#/components/schemas/AdvertiserDataDeliveryInput'
        frequencyCaps:
          description: Buyer-side frequency cap configs to apply to this advertiser. Enforced by Scope3 across all publishers; distinct from publisher-side caps in package target_overlay.
          type: array
          items:
            $ref: '#/components/schemas/FrequencyCapConfigInput'
      required:
      - name
      - brand
      - primaryCurrency
    S3CredentialConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - S3
        bucket:
          description: Target S3 bucket the Probe writes to and Data Delivery Outputs ship objects into. The bucket policy must grant the Scope3 AWS IAM principal s3:PutObject (and s3:DeleteObject for the Probe sweep) on objects under the Output path prefix.
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
        region:
          description: AWS region of the target bucket. Supports commercial, GovCloud, and ISO partitions (e.g., us-east-1, us-gov-east-1).
          type: string
          pattern: ^[a-z]{2}(-[a-z]+)+-\d+$
      required:
      - type
      - bucket
      - region
    UpdateAdvertiserBody:
      description: Request body for updating an advertiser
      type: object
      properties:
        name:
          description: Updated name of the advertiser
          example: Acme Corporation
          type: string
          minLength: 1
          maxLength: 255
        description:
          description: Updated description of the advertiser
          example: Updated description for Acme Corporation
          type: string
          maxLength: 1000
        brand:
          description: Updated brand domain (e.g., "nike.com"). Re-resolves brand identity from /.well-known/brand.json, the AdCP registry, or Brandfetch enrichment.
          example: nike.com
          type: string
          minLength: 1
        saveBrand:
          description: When true, auto-saves the resolved brand identity to the AdCP registry if the brand is not yet registered. Normally not required for advertiser updates; requires brand when sent on update. Set this only after reviewing enrichment or when the user confirms registry persistence is desired.
          default: false
          type: boolean
        linkedAccounts:
          description: Accounts to add to this advertiser. Existing linked accounts are not removed.
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccountInput'
        optimizationApplyMode:
          description: Default mode for applying Scope3 AI model optimizations to media buys for campaigns under this advertiser. When set to "AUTO", optimizations are applied automatically; when "MANUAL", they require approval.
          allOf:
          - $ref: '#/components/schemas/OptimizationApplyMode'
        primaryCurrency:
          description: Primary ISO 4217 currency for this advertiser. Can only be changed while the advertiser has no campaigns; once the first campaign is created the currency is locked, because every campaign under an advertiser shares the advertiser's single currency.
          example: USD
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Za-z]{3}$
        utmConfig:
          description: Default UTM (Urchin Tracking Module) parameters for this advertiser. Replaces all existing advertiser-level UTM params. Pass an empty array to clear.
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              paramKey:
                description: Output query parameter key appended to landing URL (e.g., "utm_source", "bg_campaign")
                example: utm_campaign
                type: string
                pattern: ^[a-zA-Z0-9_-]{1,100}$
              paramValue:
                description: Macro name (e.g., "{CAMPAIGN_ID}") or static string (e.g., "scope3") to resolve as the value
                example: '{CAMPAIGN_ID}'
                type: string
                minLength: 1
                maxLength: 200
            required:
            - paramKey
            - paramValue
        dataDelivery:
          description: Data-delivery configuration for this advertiser. Groups standing Data Delivery Outputs and the credentials they reference. Omit to leave existing config untouched.
          type: object
          properties:
            credentials:
              description: Data Delivery Credentials owned by this advertiser. When provided, replaces all existing live credentials (pass an empty array to archive — rejected if any live Output references a credential). Omit to leave existing credentials untouched. Applied before `outputs` so newly created credentials can be referenced by name.
              allOf:
              - $ref: '#/components/schemas/DataDeliveryCredentialArrayInput'
            outputs:
              description: Standing log-level data subscriptions to ship from Scope3 to a buyer-owned destination. Replaces all existing advertiser-scoped Data Delivery Outputs when provided. Pass an empty array to clear. Omit to leave existing Outputs untouched.
              allOf:
              - $ref: '#/components/schemas/DataDeliveryOutputArrayInput'
        frequencyCaps:
          description: Buyer-side frequency cap configs to apply to this advertiser. When provided, replaces all existing non-archived caps for this advertiser (pass an empty array to clear). Omit to leave existing caps untouched.
          type: array
          items:
            $ref: '#/components/schemas/FrequencyCapConfigInput'
    DataDeliveryOutputArrayInput:
      description: Array of Data Delivery Outputs for one scope (advertiser or campaign). At most one Output per (dataDeliveryType, credentialName) pair — the same data type can ship to multiple credentials by listing one Output per destination.
      maxItems: 20
      type: array
      items:
        $ref: '#/components/schemas/DataDeliveryOutputInput'
    AzureBlobCredentialConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - AZURE_BLOB
        storageAccountName:
          description: Azure Storage account hosting the target container, e.g. `datareports`. The container is accessed at `https://<storageAccountName>.blob.core.windows.net/`.
          type: string
          minLength: 3
          maxLength: 24
          pattern: ^[a-z0-9]+$
        containerName:
          description: Azure Blob container that the Probe writes to and Data Delivery Outputs ship objects into.
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^(?!.*--)[a-z0-9][a-z0-9-]*[a-z0-9]$
        auth:
          $ref: '#/components/schemas/AzureBlobAuthStored'
      required:
      - type
      - storageAccountName
      - containerName
      - auth
      additionalProperties: false
    CredentialConfig:
      description: Destination-specific auth target as stored on the credential row. AZURE_BLOB omits the SAS token — the token lives in Google Secret Manager and is fetched at probe / delivery time.
      oneOf:
      - $ref: '#/components/schemas/GcsCredentialConfigOutput'
      - $ref: '#/components/schemas/S3CredentialConfigOutput'
      - $ref: '#/components/schemas/AzureBlobCredentialConfig'
      type: object
      discriminator:
        propertyName: type
        mapping:
          GCS: '#/components/schemas/GcsCredentialConfigOutput'
          S3: '#/components/schemas/S3CredentialConfigOutput'
          AZURE_BLOB: '#/components/schemas/AzureBlobCredentialConfig'
    SyncAudiencesBody:
      description: Sync audience data into Scope3
      type: object
      properties:
        audiences:
          description: Audiences to sync
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/AudienceItem'
        deleteMissing:
          description: When true, audiences not in this request are marked as deleted.
          type: boolean
        pushNotificationConfig:
          type: object
          properties:
            url:
              type: string
            operation_id:
              type: string
              minLength: 1
              maxLength: 255
              pattern: ^[A-Za-z0-9_.:-]{1,255}$
            token:
              type: string
              minLength: 16
              maxLength: 4096
            authentication:
              type: object
              properties:
                schemes:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      enum:
                      - Bearer
                    - type: string
                      enum:
                      - HMAC-SHA256
                credentials:
                  type: string
                  minLength: 32
              required:
              - schemes
              - credentials
              additionalProperties: {}
          required:
          - url
          additionalProperties: {}
      required:
      - audiences
    AdvertiserDataDelivery:
      description: Data-delivery configuration for this advertiser. Groups standing Data Delivery Outputs and the credentials they reference. Distinct from media-buy reporting fields elsewhere in the API.
      type: object
      properties:
        credentials:
          description: Live Data Delivery Credentials owned by this advertiser. Only present when at least one credential exists.
          type: array
          items:
            $ref: '#/components/schemas/DataDeliveryCredential'
        outputs:
          description: Advertiser-scoped Data Delivery Outputs (standing LLD subscriptions). Only present when at least one Output is configured.
          type: array
          items:
            $ref: '#/components/schemas/DataDeliveryOutput'
      additionalProperties: false
    ApiError:
      description: Structured error object
      type: object
      properties:
        code:
          description: Machine-readable error code
          type: string
        message:
          description: Human-readable error message
          type: string
        field:
          description: Field path associated with the error
          type: string
        details:
          description: Additional error context
          type: object
          additionalProperties: {}
      required:
      - code
      - message
      additionalProperties: false
    AdvertiserDataDeliveryInput:
      description: Data-delivery configuration for this advertiser. Groups standing Data Delivery Outputs and the credentials they reference. Distinct from media-buy reporting fields elsewhere in the API.
      type: object
      properties:
        credentials:
          description: Data Delivery Credentials owned by this advertiser. Replaces all existing live credentials when provided. Pass an empty array to archive every live credential (only allowed when no live Output references one). Applied before `outputs` so newly created credentials can be referenced by name.
          allOf:
          - $ref: '#/components/schemas/DataDeliveryCredentialArrayInput'
        outputs:
          description: Standing log-level data subscriptions to ship from Scope3 to a buyer-owned destination. Replaces all existing advertiser-scoped Data Delivery Outputs when provided. Pass an empty array to clear.
          allOf:
          - $ref: '#/components/schemas/DataDeliveryOutputArrayInput'
    CredentialConfigInput:
      description: Destination-specific auth target as submitted by the buyer. AZURE_BLOB carries the SAS token; the API persists it to Google Secret Manager and stores only a reference. Additional destination types are added as new variants.
      oneOf:
      - $ref: '#/components/schemas/GcsCredentialConfig'
      - $ref: '#/components/schemas/S3CredentialConfig'
      - $ref: '#/components/schemas/AzureBlobCredentialConfigInput'
      type: object
      discriminator:
        propertyName: type
        mapping:
          GCS: '#/components/schemas/GcsCredentialConfig'
          S3: '#/components/schemas/S3CredentialConfig'
          AZURE_BLOB: '#/components/schemas/AzureBlobCredentialConfigInput'
    AzureBlobSasAuthStored:
      type: object
      properties:
        mode:
          type: string
          enum:
          - SAS_TOKEN
      required:
      - mode
      additionalProperties: false
    S3DeliveryConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - S3
        pathPrefix:
          description: Object key prefix within the credential's S3 bucket. Leading slashes are not stripped. The tokens {YYYY}, {MM}, {DD}, {HH} (from the delivery period start, UTC) and {DATA_DELIVERY_TYPE} are substituted at delivery time — e.g. "lld/{YYYY}/{MM}/{DD}/{HH}/{DATA_DELIVERY_TYPE}/" → "lld/2026/06/03/14/IMPRESSIONS/". Any other text is used verbatim.
          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
    AdvertiserAccount:
      type: object
      properties:
        linkId:
          type: string
        accountId:
          type: string
        credentialId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        advertiser:
          type:
          - string
          - 'null'
        billingProxy:
          type:
          - string
          - 'null'
        house:
          type:
          - string
          - 'null'
        billing:
          type:
          - string
          - 'null'
        sources:
          type: array
          items:
            type: object
            additionalProperties: {}
        advertiserId:
          type: string
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - linkId
      - accountId
      - name
      - advertiser
      - billingProxy
      - house
      - billing
      - sources
      - advertiserId
      - status
      - createdAt
      - updatedAt
      additionalProperties: {}
    DataDeliveryCredentialInput:
      description: A single Data Delivery Credential entry. Used inline on advertiser create+update; full-replace by name within one request.
      type: object
      properties:
        name:
          description: Buyer-meaningful identifier for this credential, unique per advertiser among live credentials. Data Delivery Outputs reference this by name.
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        config:
          $ref: '#/components/schemas/CredentialConfigInput'
      required:
      - name
      - config
    S3DeliveryConfigOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - S3
        pathPrefix:
          description: Object key prefix within the credential's S3 bucket. Leading slashes are not stripped. The tokens {YYYY}, {MM}, {DD}, {HH} (from the delivery period start, UTC) and {DATA_DELIVERY_TYPE} are substituted at delivery time — e.g. "lld/{YYYY}/{MM}/{DD}/{HH}/{DATA_DELIVERY_TYPE}/" → "lld/2026/06/03/14/IMPRESSIONS/". Any other text is used verbatim.
          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
      - pathPrefix
      - format
      additionalProperties: false
    AccountSummary:
      description: Compact linked-account view returned by list endpoints. Use `get_advertiser_account` for the full resource.
      type: object
      properties:
        linkId:
          description: Unique identifier for the advertiser-account link
          example: '42'
          type: string
        accountId:
          description: Partner account identifier
          example: acc_acme_pinnacle
          type: string
        name:
          description: Human-readable account name from the partner
          example: Acme c/o Pinnacle
          type:
          - string
          - 'null'
        sources:
          description: Storefront sources that surface this account to the buyer. A single linked account may be reachable through multiple sources when the underlying agent is shared across storefronts. Empty when the underlying agent is no longer linked to any active storefront source.
          type: array
          items:
            $ref: '#/components/schemas/BuyerCredentialSourceRef'
        advertiserId:
          description: Advertiser that owns this account link
          example: '12345'
          type: string
        status:
          description: Current account status
          type: string
          enum:
          - active
          - pending_approval
          - payment_required
          - suspended
          - closed
          - unreachable
        createdAt:
          description: When the account was created (ISO 8601)
          example: '2025-01-15T10:30:00Z'
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          description: When the account was last updated (ISO 8601)
          example: '2025-01-20T14:45:00Z'
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
      - linkId
      - accountId
      - sources
      - advertiserId
      - status
      - createdAt
      - updatedAt
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key or access token
