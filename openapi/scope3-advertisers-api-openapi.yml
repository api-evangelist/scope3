  /advertisers/{accountId}/audiences/sync:
    post:
      operationId: syncAudiences
      summary: Sync audiences
      description: Sync first-party CRM audiences for an account. Processing is asynchronous — returns 202 with an operation ID.
      tags:
      - Advertisers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncAudiencesBody'
      responses:
        '202':
          description: Sync audiences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAudiencesResponse'
        '400':
          description: Bad request
