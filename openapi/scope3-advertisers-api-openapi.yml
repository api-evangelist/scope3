            email:
              description: Contact email address
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            phone:
              description: Contact phone number
              type: string
            website:
              description: Contact website URL
              type: string
              format: uri
          additionalProperties: {}
        metadata:
          description: Manifest metadata
          type: object
          properties:
            createdDate:
              description: When the manifest was created (ISO 8601)
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            updatedDate:
              description: When the manifest was last updated (ISO 8601)
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            version:
              description: Version of the manifest
              example: 1.0.0
              type: string
          additionalProperties: {}
      required:
      - name
      additionalProperties: {}
    AzureBlobAuthStored:
      oneOf:
      - $ref: '#/components/schemas/AzureBlobSasAuthStored'
      type: object
      discriminator:
        propertyName: mode
        mapping:
          SAS_TOKEN: '#/components/schemas/AzureBlobSasAuthStored'
    GcsDeliveryConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - GCS
        pathPrefix:
          description: Object key prefix within the credential's bucket. Leading slashes are not stripped. The tokens {YYYY}, {MM}, {DD}, {HH} (from the delivery period start, UTC) and {DATA_DELIVERY_TYPE} are substituted at delivery time — e.g. "lld/{YYYY}/{MM}/{DD}/{HH}/{DATA_DELIVERY_TYPE}/" → "lld/2026/06/03/14/IMPRESSIONS/". Any other text is used verbatim.
          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
    DataDeliveryOutputInput:
      description: A single Data Delivery Output entry. Used inline on advertiser/campaign create+update.
      type: object
      properties:
        dataDeliveryType:
          description: The kind of LLD shipped by this Output.
          type: string
          enum:
          - MB_DELIVERY
          - IMPRESSIONS
          - CLICKS
          - VAST_EVENTS
          - CAPI_ATTRIBUTION
          - MMP_POSTBACKS
        cadence:
          description: Firing rate. HOURLY fires at minute 0 every hour, DAILY at 00:00 UTC, WEEKLY at 00:00 UTC on syncWeeklyDay.
          type: string
          enum:
          - HOURLY
          - DAILY
          - WEEKLY
        syncWeeklyDay:
          description: Day of week for WEEKLY cadence (0=Sunday..6=Saturday). Required when cadence=WEEKLY, ignored otherwise.
          type: integer
          minimum: 0
          maximum: 6
        enabled:
          description: When false, the Temporal schedule is paused — no new runs fire, in-flight runs continue. Defaults to true.
          default: true
          type: boolean
        credentialName:
          description: Name of the Data Delivery Credential (within the same advertiser) that authenticates this Output. The credential carries the auth target (e.g., GCS bucket) and is Probe-validated. Must reference a credential whose destinationType matches deliveryConfig.type.
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        deliveryConfig:
          $ref: '#/components/schemas/DeliveryConfig'
      required:
      - dataDeliveryType
      - cadence
      - credentialName
      - deliveryConfig
    AdvertiserSummary:
      description: Compact advertiser view returned by list endpoints. Use `get_advertiser` for the full resource.
      type: object
      properties:
        id:
          description: Unique identifier for the advertiser
          example: '12345'
          type: string
        name:
          description: Name of the advertiser
          example: Acme Corp
          type: string
        status:
          description: Current status of the advertiser
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        sandbox:
          description: When true, this advertiser is in sandbox mode. All ADCP operations use sandbox-flagged accounts. Cannot be changed after creation.
          type: boolean
        brand:
          description: The brand domain associated with this advertiser
          example: nike.com
          type: string
        linkedBrand:
          description: The brand linked to this advertiser. Only present when includeBrand=true is passed to the list endpoint.
          type: object
          properties:
            id:
              description: Brand ID
              example: brand_123
              type: string
            name:
              description: Brand name
              example: Acme Brand
              type: string
            domain:
              description: Brand domain
              example: acme.com
              type: string
            manifest:
              description: Full resolved brand identity data — includes logos, colors, fonts, tone, tagline, assets, product catalog, disclaimers, and more
              allOf:
              - $ref: '#/components/schemas/BrandManifestJson'
            logoUrl:
              description: Primary brand logo URL
              example: https://acme.com/logo.png
              type: string
            industry:
              description: Brand industry
              example: Technology
              type: string
            colors:
              description: Brand color palette
              example:
                primary: '#FF5733'
              type: object
              additionalProperties:
                type: string
            tagline:
              description: Brand tagline
              example: Innovation for Everyone
              type: string
            tone:
              description: Brand voice and tone
              example: Professional, friendly, and innovative
              type: string
          required:
          - id
          - name
          - domain
          - manifest
          additionalProperties: false
        primaryCurrency:
          description: Primary ISO 4217 currency for this advertiser. Every campaign under this advertiser is created in this currency, and selected product pricing must match it.
          example: USD
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        currencyLocked:
          description: True once the advertiser has at least one campaign. While false, `primaryCurrency` can still be changed; once true it is locked.
          type: boolean
        createdAt:
          description: When the advertiser was created (ISO 8601)
          example: '2025-01-15T10:30:00Z'
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          description: When the advertiser was last updated (ISO 8601)
          example: '2025-01-20T14:45:00Z'
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        linkedAccountCount:
          description: Number of partner accounts linked to this advertiser. Replaces the embedded `linkedAccounts[]` array on summary rows; call `get_advertiser` for the full account list.
          example: 3
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - id
      - name
      - status
      - sandbox
      - primaryCurrency
      - currencyLocked
      - createdAt
      - updatedAt
      - linkedAccountCount
      additionalProperties: false
    AudienceSummary:
      description: Compact audience view returned by list endpoints. Use `get_audience` for the full resource.
      type: object
      properties:
        audienceId:
          type: string
        name:
          type:
          - string
          - 'null'
        accountId:
          description: Advertiser ID (numeric string, e.g. "25")
          example: '25'
          type: string
        status:
          description: Processing status of this audience
          type: string
          enum:
          - PROCESSING
          - ERROR
          - READY
          - TOO_SMALL
        deleted:
          type: boolean
        uploadedCount:
          type:
          - number
          - 'null'
        matchedCount:
          type:
          - number
          - 'null'
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - audienceId
      - name
      - accountId
      - status
      - deleted
      - uploadedCount
      - matchedCount
      - createdAt
      - updatedAt
      additionalProperties: false
    FrequencyCapConfig:
      description: Buyer-side frequency cap configuration
      type: object
      properties:
        max_impressions:
          description: Maximum number of impressions allowed within the window
          example: 3
          type: integer
          maximum: 9007199254740991
          minimum: 1
        window:
          $ref: '#/components/schemas/FrequencyCapWindow'
        id:
          description: Unique identifier for the frequency cap config
          example: '12345'
          type: string
        targetLevel:
          description: Level of the entity the cap applies to
          allOf:
          - $ref: '#/components/schemas/FrequencyCapTargetLevel'
        targetId:
          description: 'Identifier of the entity at the chosen target level: advertiser_id when targetLevel is ADVERTISER, campaign_id when CAMPAIGN, creative_id when CREATIVE.'
          example: camp_abc123
          type: string
        createdAt:
          description: ISO 8601 creation timestamp
          type: string
        updatedAt:
          description: ISO 8601 last-updated timestamp
          type: string
        archivedAt:
          description: ISO 8601 archive timestamp; null for active configs
          type:
          - string
