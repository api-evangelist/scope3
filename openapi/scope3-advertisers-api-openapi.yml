components:
  schemas:
    AzureBlobAuthInput:
      description: How Scope3 authenticates to the buyer-owned Azure Blob container. SAS_TOKEN uses a container-scoped Shared Access Signature.
      oneOf:
      - $ref: '#/components/schemas/AzureBlobSasAuthInput'
      type: object
      discriminator:
        propertyName: mode
        mapping:
          SAS_TOKEN: '#/components/schemas/AzureBlobSasAuthInput'
    DeliveryConfigOutput:
      description: Per-Output destination shape (non-secret). Additional destination types are added as new variants in this discriminated union.
      oneOf:
      - $ref: '#/components/schemas/GcsDeliveryConfigOutput'
      - $ref: '#/components/schemas/S3DeliveryConfigOutput'
      - $ref: '#/components/schemas/AzureBlobDeliveryConfigOutput'
      type: object
      discriminator:
        propertyName: type
        mapping:
          GCS: '#/components/schemas/GcsDeliveryConfigOutput'
          S3: '#/components/schemas/S3DeliveryConfigOutput'
          AZURE_BLOB: '#/components/schemas/AzureBlobDeliveryConfigOutput'
    AvailableAccountListResponse:
      description: Response containing a list of available accounts from a partner
      type: object
      properties:
        accounts:
          description: List of available (discovered) accounts
          type: array
          items:
            $ref: '#/components/schemas/AvailableAccountOutput'
        total:
          description: Total count of available accounts
          example: 8
          type: integer
          minimum: 0
          maximum: 9007199254740991
        synced:
          description: True when no accounts matched and a sync_accounts call was automatically triggered to provision this account at the partner. The list reflects the post-sync state.
          type: boolean
        billingOptions:
          description: Billing options supported by this partner agent, as reported in its ADCP capabilities.
          type: object
          properties:
            default:
              type:
              - string
              - 'null'
            supported:
              type: array
              items:
                type: string
          required:
          - default
          - supported
          additionalProperties: false
      required:
      - accounts
      - total
      additionalProperties: false
    FrequencyCapWindow:
      description: Rolling time window over which max_impressions applies (AdCP Duration shape).
      type: object
      properties:
        interval:
          type: number
          minimum: 1
        unit:
          anyOf:
          - type: string
            enum:
            - seconds
          - type: string
            enum:
            - minutes
          - type: string
            enum:
            - hours
          - type: string
            enum:
            - days
          - type: string
            enum:
            - campaign
      required:
      - interval
      - unit
      additionalProperties: {}
    RevalidateDataDeliveryCredentialResponse:
      description: Updated credential after re-running the destination Probe.
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/DataDeliveryCredential'
      required:
      - credential
      additionalProperties: false
    UpdateReportingBucketBody:
      description: Request body for updating the offline reporting bucket on a linked partner account
      type: object
      properties:
        reporting_bucket:
          description: Reporting bucket configuration to set on the linked account, or null to clear it.
          allOf:
          - $ref: '#/components/schemas/ReportingBucket'
      required:
      - reporting_bucket
    LinkedAccountInput:
      description: An account to link to the advertiser
      type: object
      properties:
        storefrontId:
          description: Storefront the source lives on. Pair with `sourceId` to identify the source whose account is being linked.
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        sourceId:
          description: Inventory source within `storefrontId` whose account is being linked.
          example: src_main
          type: string
          minLength: 1
        accountId:
          description: Account ID at the source to link to this advertiser. Must come from `list_available_accounts`.
          example: acc_123
          type: string
          minLength: 1
        credentialId:
          description: Credential ID returned by `list_available_accounts`. Include it when multiple mapped connections expose the same account ID.
          example: '42'
          type: string
        billingType:
          description: Billing arrangement type (e.g. "advertiser", "operator", "agent")
          example: advertiser
          type: string
      required:
      - storefrontId
      - sourceId
      - accountId
    GcsCredentialConfig:
      type: object
      properties:
        type:
          type: string
          enum:
          - GCS
        bucket:
          description: Target GCS bucket the Probe writes to and Data Delivery Outputs ship objects into. The Scope3 service account must have objectCreator on this bucket.
          type: string
          minLength: 1
          maxLength: 222
          pattern: ^[a-z0-9][a-z0-9._-]*[a-z0-9]$
      required:
      - type
      - bucket
    AudienceListResponse:
      description: Paginated list of audience summaries
      type: object
      properties:
        audiences:
          type: array
          items:
            $ref: '#/components/schemas/AudienceSummary'
        total:
          type: number
        take:
          type: number
        skip:
          type: number
      required:
      - audiences
      - total
      - take
      - skip
      additionalProperties: false
    Advertiser:
      description: Advertiser resource representation
      type: object
      properties:
        id:
          description: Unique identifier for the advertiser
          example: '12345'
          type: string
        name:
          description: Name of the advertiser
          example: Acme Corp
          type: string
        description:
          description: Description of the advertiser
          example: Global advertising account for Acme Corporation
          type: string
        status:
          description: Current status of the advertiser
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        createdAt:
          description: When the advertiser was created (ISO 8601)
          example: '2025-01-15T10:30:00Z'
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          description: When the advertiser was last updated (ISO 8601)
          example: '2025-01-20T14:45:00Z'
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        linkedBrand:
          description: The brand linked to this advertiser. Only present when includeBrand=true is passed to the list endpoint.
          type: object
          properties:
            id:
              description: Brand ID
              example: brand_123
              type: string
            name:
              description: Brand name
              example: Acme Brand
              type: string
            domain:
              description: Brand domain
              example: acme.com
              type: string
            manifest:
              description: Full resolved brand identity data — includes logos, colors, fonts, tone, tagline, assets, product catalog, disclaimers, and more
              allOf:
              - $ref: '#/components/schemas/BrandManifestJson'
            logoUrl:
              description: Primary brand logo URL
              example: https://acme.com/logo.png
              type: string
            industry:
              description: Brand industry
              example: Technology
              type: string
            colors:
              description: Brand color palette
              example:
                primary: '#FF5733'
              type: object
              additionalProperties:
                type: string
            tagline:
              description: Brand tagline
              example: Innovation for Everyone
              type: string
            tone:
              description: Brand voice and tone
              example: Professional, friendly, and innovative
              type: string
          required:
          - id
          - name
          - domain
          - manifest
          additionalProperties: false
        brand:
          description: The brand domain associated with this advertiser
          example: nike.com
          type: string
        brandWarning:
          description: Warning about brand resolution (e.g., manifest not found)
          type: string
        sandbox:
          description: When true, this advertiser is in sandbox mode. All ADCP operations use sandbox-flagged accounts. Cannot be changed after creation.
          type: boolean
        optimizationApplyMode:
          description: Default mode for applying Scope3 AI model optimizations to media buys for campaigns under this advertiser. When set to "AUTO", optimizations are applied automatically; when "MANUAL", they require approval.
          allOf:
          - $ref: '#/components/schemas/OptimizationApplyMode'
        primaryCurrency:
          description: Primary ISO 4217 currency for this advertiser. Every campaign under this advertiser is created in this currency, and selected product pricing must match it.
          example: USD
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        currencyLocked:
          description: True once the advertiser has at least one campaign. While false, `primaryCurrency` can still be changed; once true it is locked.
          type: boolean
        linkedAccounts:
          description: Linked partner accounts for this advertiser. Only present when includeAccounts=true is passed to the list endpoint.
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccount'
        utmConfig:
          description: Advertiser-level UTM parameter configuration. Only present when UTM params are configured for this advertiser.
          type: array
          items:
            type: object
            properties:
              paramKey:
                description: Output query parameter key
                example: utm_campaign
                type: string
              paramValue:
                description: Macro or static value
                example: '{CAMPAIGN_ID}'
                type: string
              source:
                description: Where this param was configured — "advertiser" for advertiser default, "campaign" for campaign override
                type: string
                enum:
                - advertiser
                - campaign
            required:
            - paramKey
            - paramValue
            - source
            additionalProperties: false
        dataDelivery:
          $ref: '#/components/schemas/AdvertiserDataDelivery'
        frequencyCaps:
          description: Buyer-side frequency cap configs for this advertiser. Always present on single-GET; on LIST only when includeFrequencyCaps=true.
          type: array
          items:
            $ref: '#/components/schemas/FrequencyCapConfig'
      required:
      - id
      - name
      - status
      - createdAt
      - updatedAt
      - sandbox
      - optimizationApplyMode
      - primaryCurrency
      - currencyLocked
      additionalProperties: false
    RemoveMember:
      description: Member to remove from the audience
      type: object
      properties:
        externalId:
          description: Unique identifier for this member within the audience
          type: string
          minLength: 1
        hashedEmail:
          description: SHA-256 hash of lowercase, trimmed email (64-char hex)
          example: a1b2c3d4e5f6...
          type: string
          pattern: ^[0-9a-f]{64}$
        hashedPhone:
          description: SHA-256 hash of E.164-formatted phone number (64-char hex)
          example: f6e5d4c3b2a1...
          type: string
          pattern: ^[0-9a-f]{64}$
        uids:
          description: Universal IDs for user matching
          minItems: 1
          type: array
          items:
            type: object
            properties:
              type:
                description: Universal ID type (rampid, uid2, maid, etc.)
                type: string
                minLength: 1
              value:
                description: Universal ID value
                type: string
                minLength: 1
            required:
            - type
            - value
      required:
      - externalId
    ReportingBucket:
      description: Customer-owned object storage bucket where sales agents can write offline delivery reports
      type: object
      properties:
        protocol:
          description: Object storage protocol
          example: s3
          type: string
          enum:
          - s3
          - gcs
          - azure_blob
        bucket:
          description: Bucket name. Lowercase alphanumerics, dots and hyphens; must start and end with an alphanumeric; 3-63 chars.
          example: my-org.adcp.reports
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
        prefix:
          description: Object key prefix within the bucket
          example: reports/
          type: string
          maxLength: 512
          pattern: ^[a-zA-Z0-9/_.-]+$
        region:
          description: Storage region identifier (lowercase alphanumerics and hyphens)
          example: us-east-1
          type: string
          maxLength: 64
          pattern: ^[a-z0-9-]+$
        format:
          description: Report file format
          default: jsonl
          type: string
          enum:
          - jsonl
          - csv
          - parquet
          - avro
          - orc
        compression:
          description: Compression applied to report files
          default: gzip
          type: string
          enum:
          - gzip
          - none
        file_retention_days:
          description: Number of days the customer retains report files in the bucket
          example: 30
          type: integer
          minimum: 1
          maximum: 9007199254740991
        setup_instructions:
          description: Optional URL pointing to setup instructions for granting the agent access to the bucket
          example: https://example.com/adcp/bucket-setup
          type: string
          format: uri
      required:
      - protocol
      - bucket
      - file_retention_days
    AudienceItem:
      description: Audience to sync with member changes
      type: object
      properties:
        audienceId:
          description: Buyer's identifier for this audience. Used in targeting overlays.
          type: string
          minLength: 1
          maxLength: 255
        name:
          description: Human-readable name
          type: string
          maxLength: 255
        add:
          description: Members to add to this audience
          maxItems: 100000
          type: array
          items:
            type: object
            properties:
              externalId:
                description: Unique identifier for this member within the audience
                type: string
                minLength: 1
              hashedEmail:
                description: SHA-256 hash of lowercase, trimmed email (64-char hex)
                example: a1b2c3d4e5f6...
                type: string
                pattern: ^[0-9a-f]{64}$
              hashedPhone:
                description: SHA-256 hash of E.164-formatted phone number (64-char hex)
                example: f6e5d4c3b2a1...
                type: string
                pattern: ^[0-9a-f]{64}$
              uids:
                description: Universal IDs for user matching
                minItems: 1
                type: array
                items:
                  type: object
                  properties:
                    type:
                      description: Universal ID type (rampid, uid2, maid, etc.)
                      type: string
                      minLength: 1
                    value:
                      description: Universal ID value
                      type: string
                      minLength: 1
                  required:
                  - type
                  - value
            required:
            - externalId
        remove:
          description: Members to remove by external ID
          maxItems: 100000
          type: array
          items:
            $ref: '#/components/schemas/RemoveMember'
        delete:
          description: When true, delete this audience entirely
          type: boolean
        consentBasis:
          description: GDPR lawful basis for processing this audience
          type: string
          enum:
          - consent
          - legitimate_interest
          - contract
          - legal_obligation
      required:
      - audienceId
    S3CredentialConfigOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - S3
        bucket:
          description: Target S3 bucket the Probe writes to and Data Delivery Outputs ship objects into. The bucket policy must grant the Scope3 AWS IAM principal s3:PutObject (and s3:DeleteObject for the Probe sweep) on objects under the Output path prefix.
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
        region:
          description: AWS region of the target bucket. Supports commercial, GovCloud, and ISO partitions (e.g., us-east-1, us-gov-east-1).
          type: string
          pattern: ^[a-z]{2}(-[a-z]+)+-\d+$
      required:
      - type
      - bucket
      - region
      additionalProperties: false
    GcsDeliveryConfigOutput:
      type: object
      properties:
        type:
          type: string
          enum:
          - GCS
        pathPrefix:
          description: Object key prefix within the credential's bucket. Leading slashes are not stripped. The tokens {YYYY}, {MM}, {DD}, {HH} (from the delivery period start, UTC) and {DATA_DELIVERY_TYPE} are substituted at delivery time — e.g. "lld/{YYYY}/{MM}/{DD}/{HH}/{DATA_DELIVERY_TYPE}/" → "lld/2026/06/03/14/IMPRESSIONS/". Any other text is used verbatim.
          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
      - pathPrefix
      - format
      additionalProperties: false
    FrequencyCapConfigInput:
      description: Frequency cap entry supplied inside a parent advertiser/campaign/creative request body. On PUT, the full array replaces all existing caps for that target.
      type: object
      properties:
        max_impressions:
          description: Maximum number of impressions allowed within the window
          example: 3
          type: integer
          maximum: 9007199254740991
          minimum: 1
        window:
          $ref: '#/components/schemas/FrequencyCapWindow'
      required:
      - max_impressions
      - window
      additionalProperties: {}
    SyncAudiencesResponse:
      description: Audience sync accepted for async processing
      type: object
      properties:
        success:
          type: boolean
        accountId:
          description: Advertiser ID (numeric string, e.g. "25") — same as the path parameter
          example: '25'
          type: string
        operationId:
          description: Batch operation UUID for tracking async processing
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        taskId:
          description: Task ID for polling progress via GET /tasks/{taskId}. Same value as operationId.
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
      - success
      - accountId
      - operationId
      - taskId
      additionalProperties: false
    AssignAccountBody:
      description: Request body for assigning a source account to an advertiser
      type: object
      properties:
        storefrontId:
          description: Storefront the source lives on. Pair with `sourceId`.
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        sourceId:
          description: Inventory source within `storefrontId` to register this account against.
          example: src_main
          type: string
          minLength: 1
        accountId:
          description: Account ID at the source to assign to this advertiser. Must come from `list_available_accounts`.
          example: acc_67890
          type: string
          minLength: 1
        credentialId:
          description: Credential ID returned by `list_available_accounts`. Required when the same account ID is exposed by more than one mapped connection.
          example: '42'
          type: string
        billingType:
          description: Billing arrangement type for this account (e.g. "advertiser", "operator", "agent"). Defaults to the source's default billing type.
          example: advertiser
          type: string
      required:
      - storefrontId
      - sourceId
      - accountId
    ErrorResponse:
      description: Standard error response
      type: object
      properties:
        data:
          type:
          - string
          - 'null'
          enum:
          - null
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - data
      - error
      additionalProperties: false
    OptimizationApplyMode:
      description: Whether optimization suggestions are automatically applied or require human approval.
      type: string
      enum:
      - AUTO
      - MANUAL
    DataDeliveryCredential:
      description: Resolved Data Delivery Credential as returned by the API.
      type: object
      properties:
        credentialId:
          description: Database identifier for the credential row.
          type: string
        name:
          type: string
        destinationType:
          type: string
          enum:
          - GCS
          - S3
          - AZURE_BLOB
          - SNOWFLAKE
          - DATABRICKS
        config:
          $ref: '#/components/schemas/CredentialConfig'
        status:
          description: Outcome of the most recent Probe. PENDING until the first Probe completes, VALIDATED when the credential is reachable, FAILED when not. Data Delivery Outputs may reference any status; ReportDeliveryWorkflow checks at run time.
          type: string
          enum:
          - PENDING
          - VALIDATED
          - FAILED
        statusError:
          description: Human-readable Probe failure reason when status=FAILED.
          type: string
        validatedAt:
          description: ISO timestamp of the most recent successful Probe.
          type: string
        expiresAt:
          description: ISO timestamp at which the credential is known to expire. Populated for credential shapes that carry an expiry claim (e.g., the `se=` field of an Azure SAS token). Absent when the destination does not encode an expiry.
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - credentialId
      - name
      - destinationType
      - config
      - status
      - createdAt
      - updatedAt
      additionalProperties: false
    BrandManifestJson:
      description: Full brand.json profile conforming to the ADCP v2 schema
      type: object
      properties:
        name:
          description: Brand name (required)
          example: Acme Corporation
          type: string
          minLength: 1
          maxLength: 500
        url:
          description: Brand website URL
          example: https://www.acme.com
          type: string
          format: uri
        logos:
          description: Brand logos
          type: array
          items:
            type: object
            properties:
              url:
                description: URL to the logo image
                type: string
                format: uri
              tags:
                description: Tags categorizing the logo (e.g., "primary", "dark", "square")
                type: array
                items:
                  type: string
              background:
                description: Backdrop the logo is designed for (dark-bg for a light or knockout logo, light-bg for a dark logo, transparent-bg for a logo with no baked-in background).
                type: string
                enum:
                - dark-bg
                - light-bg
                - transparent-bg
              width:
                description: Width of the logo in pixels
                type: integer
                maximum: 9007199254740991
                minimum: 1
              height:
                description: Height of the logo in pixels
                type: integer
                maximum: 9007199254740991
                minimum: 1
            required:
            - url
            additionalProperties: {}
        colors:
          description: Brand color palette
          type: object
          properties:
            primary:
              description: Primary brand color in hex format
              example: '#FF5733'
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            secondary:
              description: Secondary brand color in hex format
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            accent:
              description: Accent brand color in hex format
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            background:
              description: Background color in hex format
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            text:
              description: Text color in hex format
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
          additionalProperties: {}
        fonts:
          description: Brand typography
          anyOf:
          - type: object
            properties:
              primary:
                description: Primary font family name
                example: Roboto
                type: string
              secondary:
                description: Secondary font family name
                type: string
              fontUrls:
                description: URLs to font files
                type: array
                items:
                  type: string
                  format: uri
            additionalProperties: {}
          - description: Font list from enrichment sources (Brandfetch format)
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
              required:
              - name
              additionalProperties: {}
        tone:
          description: Brand voice and tone description
          example: Professional, friendly, and innovative
          type: string
          maxLength: 2000
        tagline:
          description: Brand tagline or slogan
          example: Innovation for Everyone
          type: string
          maxLength: 500
        assets:
          description: Brand assets (images, videos, etc.)
          type: array
          items:
            type: object
            properties:
              assetId:
                description: Unique identifier for the asset
                type: string
              assetType:
                description: Type of asset (e.g., "image", "video", "audio")
                type: string
              url:
                description: URL to the asset
                type: string
                format: uri
              name:
                description: Human-readable name for the asset
                type: string
              description:
                description: Description of the asset
                type: string
              tags:
                description: Tags categorizing the asset
                type: array
                items:
                  type: string
              width:
                description: Width in pixels (for images/videos)
                type: integer
                maximum: 9007199254740991
                minimum: 1
              height:
                description: Height in pixels (for images/videos)
                type: integer
                maximum: 9007199254740991
                minimum: 1
              durationSeconds:
                description: Duration in seconds (for audio/video)
                type: number
                exclusiveMinimum: 0
              fileSizeBytes:
                description: File size in bytes
                type: integer
                maximum: 9007199254740991
                minimum: 1
              format:
                description: File format (e.g., "png", "mp4")
                type: string
              metadata:
                description: Additional metadata
                type: object
                additionalProperties: {}
            required:
            - assetId
            - assetType
            - url
            additionalProperties: {}
        productCatalog:
          description: Product catalog configuration
          type: object
          properties:
            feedUrl:
              description: URL to the product feed
              type: string
              format: uri
            feedFormat:
              description: Format of the product feed
              type: string
              enum:
              - google_merchant_center
              - facebook_catalog
              - custom
            categories:
              description: Product categories
              type: array
              items:
                type: string
            lastUpdated:
              description: When the catalog was last updated (ISO 8601)
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            updateFrequency:
              description: How often the catalog is updated
              type: string
              enum:
              - realtime
              - hourly
              - daily
              - weekly
          required:
          - feedUrl
          additionalProperties: {}
        disclaimers:
          description: Legal disclaimers and required text
          type: array
          items:
            type: object
            properties:
              text:
                description: Disclaimer text
                type: string
              context:
                description: Context in which the disclaimer applies
                type: string
              required:
                description: Whether the disclaimer is required
                default: true
