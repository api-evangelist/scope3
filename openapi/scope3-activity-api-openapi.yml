        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        durationMs:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        completionState:
          type: string
          enum:
          - started
          - complete
          - incomplete
        outcome:
          type:
          - string
          - 'null'
          enum:
          - succeeded
          - accepted
          - denied
          - failed
          - cancelled
          - unknown
        decisionDisposition:
          type: string
          enum:
          - not_evaluated
        surface:
