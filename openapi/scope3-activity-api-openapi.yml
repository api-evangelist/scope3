openapi: 3.2.0
info:
  title: Scope3 Activity API
  version: 2.0.0
  description: 'Operations tagged Activity across 2 of this provider''s published API definitions: scope3-buyer-openapi-original.yml, scope3-storefront-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.interchange.io/api/v2/buyer
  description: Production server
- url: https://api.interchange.io/api/v2/storefront
  description: Production server
tags:
- name: Activity
paths:
  /activity/calls:
    servers:
    - url: /api/v2
      description: Shared customer API base URL
    get:
      operationId: listActivityCalls
      summary: List API calls
      description: List normalized customer API calls with stable workload, run, outcome, latency, and correlation metadata.
      tags:
      - Activity
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: startTime
        schema:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      - in: query
        name: endTime
        schema:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      - in: query
        name: workloadUid
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      - in: query
        name: runUid
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      - in: query
        name: clientRunId
        schema:
          description: Caller-supplied correlation identifier. Cross-check workloadUid, runUid, apiVersion, and time bounds for provenance.
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
      - in: query
        name: advertiserId
        schema:
          type: string
          pattern: ^\d+$
      - in: query
        name: environment
        schema:
          type: string
          enum:
          - production
          - sandbox
          - unknown
          - not_applicable
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - succeeded
          - accepted
          - denied
          - failed
          - cancelled
          - unknown
      - in: query
        name: operation
        schema:
          type: string
          minLength: 1
          maxLength: 240
      - in: query
        name: surface
        schema:
          type: string
          enum:
          - rest
          - mcp
          - a2a
      - in: query
        name: includeDiagnostics
        schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
      - in: query
        name: includeProtocol
        schema:
          default: 'false'
          type: string
          enum:
          - 'true'
          - 'false'
      - in: query
        name: limit
        schema:
          default: 50
          type: integer
          maximum: 200
          minimum: 1
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 2000
      responses:
        '200':
          description: List API calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActivityCallsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /activity/calls/{activityUid}:
    servers:
    - url: /api/v2
      description: Shared customer API base URL
    get:
      operationId: getActivityCall
      summary: Get API call detail
      description: Get one authorized customer API call and its safe timing and diagnostic detail.
      tags:
      - Activity
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: activityUid
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        required: true
      responses:
        '200':
          description: Get API call detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCallDetailResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
