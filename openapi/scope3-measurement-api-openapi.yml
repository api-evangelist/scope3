              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateTestCohort
      summary: Update test cohort
      description: Update an existing test cohort.
      tags:
      - Measurement
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: cohortId
        schema:
          description: Unique identifier for the test cohort
          example: cohort_abc123
          type: string
          minLength: 1
        required: true
        description: Unique identifier for the test cohort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTestCohortInput'
      responses:
        '200':
          description: Update test cohort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCohortResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTestCohort
      summary: Delete test cohort
      description: Delete a test cohort.
      tags:
      - Measurement
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: cohortId
        schema:
          description: Unique identifier for the test cohort
          example: cohort_abc123
          type: string
          minLength: 1
        required: true
        description: Unique identifier for the test cohort
      responses:
        '204':
          description: No content
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
