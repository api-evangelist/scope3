  /advertisers/{advertiserId}/measurement-sources:
    get:
      operationId: listMeasurementSources
      summary: List measurement sources
      description: List measurement sources for an advertiser.
      tags:
      - Measurement
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: take
        schema:
          description: Number of results to return (max 250)
          example: 50
          default: 50
          type: integer
          maximum: 250
          minimum: 1
        description: Number of results to return (max 250)
      - in: query
        name: skip
        schema:
          description: Number of results to skip for pagination
          example: 0
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description: Number of results to skip for pagination
      - in: query
        name: outcomeType
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - active
          - paused
      - in: path
        name: advertiserId
        schema:
          description: Unique identifier for the advertiser
          example: '12345'
          type: string
          minLength: 1
        required: true
        description: Unique identifier for the advertiser
      responses:
        '200':
          description: List measurement sources
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMeasurementSource
      summary: Create measurement source
      description: Register a measurement data source (e.g. MMM, brand lift study) for an advertiser.
      tags:
      - Measurement
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: advertiserId
        schema:
          description: Unique identifier for the advertiser
          example: '12345'
          type: string
          minLength: 1
        required: true
        description: Unique identifier for the advertiser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceKey:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                outcomeType:
                  type: string
                  minLength: 1
                outcomeTypes:
                  type: array
                  items:
                    type: string
                granularity:
                  type: string
                  minLength: 1
                lagWeeks:
                  default: 1
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                cadence:
                  type: string
                  enum:
                  - continuous
                  - daily
                  - weekly
                  - biweekly
                  - monthly
                  - quarterly
                provider:
                  type: string
                  minLength: 1
                ingestionMethod:
                  type: string
                attributionConfig:
                  type: object
                  additionalProperties: {}
                signalWeight:
                  default: 1
                  type: number
                  minimum: 0
                  maximum: 1
                status:
                  default: pending
                  type: string
                  enum:
                  - pending
                  - active
                  - paused
                notes:
                  type: string
              required:
              - sourceKey
              - name
              - outcomeType
              - granularity
              - cadence
              - provider
      responses:
        '201':
          description: Create measurement source
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /advertisers/{advertiserId}/measurement-sources/{sourceId}:
    get:
      operationId: getMeasurementSource
