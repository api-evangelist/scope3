          description: How exact creative formats are discovered for this adapter.
          type: string
          enum:
          - canonical
          - static_catalog
          - aao_registry
      required:
      - kind
      - modalities
      - transformerIds
      - supportedFormatIds
      - supportedFormatCount
      - supportsBuildCreative
      - supportsPreviewCreative
      - formatDiscovery
      additionalProperties: false
