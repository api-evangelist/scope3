            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storefronts/{storefrontId}/sources/{sourceId}/credentials:
    post:
      operationId: registerSourceCredentials
      summary: Register source credentials
      description: Register credentials for an inventory source within a storefront.
      tags:
      - Storefronts
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: storefrontId
        schema:
          description: Storefront ID
          type: integer
          maximum: 9007199254740991
          minimum: 1
        required: true
        description: Storefront ID
      - in: path
        name: sourceId
        schema:
          description: Inventory source ID
          type: string
          minLength: 1
        required: true
        description: Inventory source ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountIdentifier:
                  description: Unique account identifier for this agent
                  type: string
                  minLength: 1
                  maxLength: 255
                auth:
                  description: Authentication credentials. Required for API_KEY/JWT/BASIC_AUTH agents, not needed for OAUTH agents.
                  anyOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - jwt
                      privateKey:
                        type: string
                        minLength: 1
                      issuer:
                        type: string
                        minLength: 1
                      subject:
                        type: string
                        minLength: 1
                      keyId:
                        type: string
                        minLength: 1
                      scope:
                        type: string
                        minLength: 1
                      tokenEndpointUrl:
                        type: string
                        format: uri
                      audienceUrl:
                        type: string
                        format: uri
                      algorithm:
                        type: string
                        enum:
                        - ES256
                        - RS256
                      environment:
                        type: string
                    required:
                    - type
                    - privateKey
                    - issuer
                    - subject
                    - keyId
                    - scope
                    - tokenEndpointUrl
                    - audienceUrl
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - bearer
                        - apikey
                        - api_key
                      token:
                        type: string
                        minLength: 1
                    required:
                    - type
                    - token
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - basic
                      username:
                        type: string
                        minLength: 1
                      password:
                        type: string
                    required:
                    - type
                    - username
                    - password
                  - type: object
                    properties: {}
                    additionalProperties: false
                marketplaceAccount:
                  description: Admin-only flag. When true, creates a marketplace account instead of a client account.
                  type: boolean
              required:
              - accountIdentifier
      responses:
        '201':
          description: Register source credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerCredentialRegistrationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storefronts/{storefrontId}/sources/{sourceId}/adcp-connection:
    post:
      operationId: connectAdcpStorefront
      summary: Connect a registered AdCP source (alpha)
      description: Project an existing registered, discovered, and advertiser-mapped AdCP source account into the connected-account campaign connection plane. This operation does not accept endpoint URLs or raw secrets.
      tags:
      - Storefronts
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: storefrontId
        schema:
          description: Storefront ID
          type: integer
          maximum: 9007199254740991
          minimum: 1
        required: true
        description: Storefront ID
      - in: path
        name: sourceId
        schema:
          description: Inventory source ID
          type: string
          minLength: 1
        required: true
        description: Inventory source ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAdcpStorefrontBody'
      responses:
        '201':
          description: Connect a registered AdCP source (alpha)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAdcpStorefront'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Customer alpha exposure is disabled or the advertiser is outside the caller customer scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The account-wide agent credential is already associated with another source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The registered seller source has not passed source-specific conformance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storefronts/{storefrontId}/publishers:
    get:
      operationId: listBuyerStorefrontPublishers
      summary: List publisher domains for a storefront
      description: Paginated list of publisher domains a storefront covers, with verification status. Use `?verification=verified` to filter to only adagents.json-authorized domains.
      tags:
      - Storefronts
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: offset
        schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
      - in: query
        name: verification
        schema:
          type: string
          enum:
          - verified
          - declared
      - in: path
        name: storefrontId
        schema:
          description: Storefront ID
          type: integer
          maximum: 9007199254740991
          minimum: 1
        required: true
        description: Storefront ID
      responses:
        '200':
          description: List publisher domains for a storefront
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishers:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        verification:
                          type: string
                          enum:
                          - verified
                          - declared
                        propertyCount:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                      - domain
                      - verification
                      - propertyCount
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  verifiedCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - publishers
                - total
                - verifiedCount
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DirectedCampaignSyncOutcome:
      description: Counts and bounded safe diagnostics from one account-wide mirror reconciliation.
      type: object
      properties:
        subscriptionId:
          type: string
        mirrored:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        retired:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        skipped:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        errors:
          description: Empty on success; otherwise contains only the fixed safe reconciliation summary.
          maxItems: 1
          type: array
          items:
            type: string
            enum:
            - Connected provider account could not be synchronized.
        errorCode:
          description: Stable Scope3 service error code for a failed reconciliation. Provider messages and request identifiers are never returned.
          type: string
          enum:
          - NOT_FOUND
          - ACCESS_DENIED
          - VALIDATION_ERROR
          - INVALID_REQUEST
          - CONFLICT
          - INTERNAL_ERROR
          - RATE_LIMITED
          - SERVICE_UNAVAILABLE
          - FEATURE_NOT_ENABLED
          - PRICING_NOT_CONFIGURED
          - CURRENCY_MISMATCH
          - INSUFFICIENT_MEDIA_BUDGET
          - ROUTED_AGENT_REQUIRES_OPERATOR_AUTH
          - ADAPTER_STOREFRONT_REQUIRES_ROUTED_CAMPAIGN
          - CAPABILITY_NOT_SUPPORTED
          - SELLER_APPROVAL_REQUIRED
          - SALES_AGENT_NOT_ACTIVE
          - CREDIT_LIMIT_EXCEEDED
          - FX_QUOTE_EXPIRED
          - FX_RATE_UNAVAILABLE
        errorField:
          description: Allowlisted request field associated with the failure, when one is safe to expose.
          type: string
          enum:
          - account.account_id
          - accountId
          - advertiserId
          - assets
          - assets.post.identity_id
          - brief
          - buying_mode
          - clicks
          - format_id
          - impressions
          - instagram_actor_id
          - liveConformance.account
          - liveConformance.inventory
          - liveConformance.pagination
          - liveConformance.providerInventory
          - mediaBuy.canceled
          - mediaBuys.account
          - mediaBuys.currency
          - mediaBuys.envelope
          - mediaBuys.identity
          - mediaBuys.lifecycle
          - mediaBuys.numeric
          - mediaBuys.packages
          - mediaBuys.revision
          - mediaBuys.retirement
          - mediaBuys.schedule
          - page_id
          - pixel_id
          - sourceId
          - spend
          - spotify.ads.identity
          - spotify.ads.rejectReasons
          - spotify.ads.status
        errorReason:
          description: Allowlisted machine-readable reconciliation reason, when available.
          type: string
          enum:
          - account_scope_mismatch
          - catalog_shape_invalid
          - cleanup_readback_mismatch
          - create_account_mismatch
          - delegated_auth_unready
          - delivery_reconciliation_mismatch
          - lifecycle_readback_mismatch
          - missing_identity
          - nested_subdivision_hierarchy_unproven
          - pagination_incomplete
          - pagination_page_bound_exceeded
          - pagination_deadline_exceeded
          - pagination_response_malformed
          - pagination_list_malformed
          - pagination_page_info_missing
          - pagination_counters_invalid
          - pagination_page_mismatch
          - pagination_page_size_mismatch
          - pagination_bounds_exceeded
          - pagination_totals_inconsistent
          - pagination_totals_changed
          - pagination_page_count_mismatch
          - pagination_page_oversized
          - pagination_identity_invalid
          - pagination_duplicate_identity
          - pagination_terminal_confirmation_mismatch
          - pagination_collected_count_mismatch
          - provider_response_malformed
          - readback_mismatch
          - scope_insufficient
          - selected_account_mismatch
          - spark_provenance_inconsistent
          - spark_tuple_inconsistent
          - spark_provider_tuple_conflict
          - carousel_provider_identity_mismatch
          - carousel_child_owner_conflict
          - carousel_child_standalone_conflict
          - carousel_assignment_identity_mismatch
          - active_identity_omitted
          - video_format_provenance_inconsistent
          - video_provider_digest_mismatch
          - video_format_selector_missing
          - image_format_provenance_inconsistent
          - image_provider_digest_mismatch
          - carousel_provider_inventory_missing
          - image_format_selector_missing
          - spark_provider_digest_mismatch
        upstreamCode:
          description: Allowlisted provider error category. Raw provider messages, request IDs, and resource IDs are excluded.
          type: string
          enum:
          - ACCOUNT_NOT_AUTHORIZED
          - ACCOUNT_NOT_FOUND
          - ACCOUNT_SCOPE_MISMATCH
          - ADVERTISER_INFO_DENIED
          - ADVERTISER_INFO_MALFORMED
          - AMBIGUOUS_AUDIENCE_DETAIL
          - AUDIENCE_DETAIL_ID_MISMATCH
          - AUDIENCE_UPLOAD_NOT_VERIFIED
          - AUTH_REQUIRED
          - BUDGET_TOO_LOW
          - CATALOG_SCOPE_MISMATCH
          - CONFIGURATION_ERROR
          - INCOMPLETE_PAGINATION
          - INVALID_AUDIENCE_DETAIL
          - INVALID_AUDIENCE_INVENTORY
          - INVALID_AUDIENCE_RESPONSE
          - INVALID_ADVERTISER_SCOPE
          - INVALID_PROVIDER_RESPONSE
          - INVALID_REQUEST
          - INVALID_SELECTED_ACCOUNT
          - INVALID_SUCCESS_ENVELOPE
          - NETWORK_ERROR
          - NOT_FOUND
          - OWNERSHIP_MISMATCH
          - PERMISSION_DENIED
          - PLATFORM_ERROR
          - POLICY_VIOLATION
          - RATE_LIMIT
          - RATE_LIMITED
          - SCOPE_INSUFFICIENT
          - SERVICE_UNAVAILABLE
          - SNAP_ME_MALFORMED
          - TIMEOUT
          - UPSTREAM_BAD_GATEWAY
          - UPSTREAM_HTTP_ERROR
          - UPSTREAM_NON_JSON
          - UPSTREAM_UNAVAILABLE
          - VALIDATION_ERROR
        liveConformanceFaultStage:
          description: Protected staging-only fault stage, reconstructed from an exact static allowlist. Never contains provider text or identifiers.
          type: string
          enum:
          - campaign
          - package
          - creative
          - reporting
          - targeting.excluded_geo_locations
          - targeting.locales
          - targeting.interests
          - targeting.behaviors
      required:
      - subscriptionId
      - mirrored
      - retired
      - skipped
      - errors
      additionalProperties: false
    StorefrontPresence:
      description: Read-only wire projection of a storefront-connection-account presence edge -- identity, status, and counts only, never member lists or event payloads.
      type: object
      properties:
        id:
          description: The presence edge id.
          type: string
          minLength: 1
        objectType:
          type: string
          enum:
          - audience
          - event_source
        direction:
          type: string
          enum:
          - pushed
          - tracked
        upstreamObjectId:
          description: The seller's own identifier for the object.
          type: string
          minLength: 1
        audienceId:
          description: The buyer-level audience this edge belongs to. Present only when direction is "pushed" and objectType is "audience".
          type: string
          minLength: 1
        eventSourceId:
          description: The buyer-level event source this edge belongs to. Present only when direction is "pushed" and objectType is "event_source".
          type: string
          minLength: 1
        syncState:
          type: string
          enum:
          - live
          - stale
          - error
        lastSyncedAt:
          type:
          - string
          - 'null'
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        rowCount:
          description: Row/member or event count reported by the last sync, when the provider returns one. Never the rows or events themselves.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        retiredAt:
          description: Null unless the edge has been retired.
          type:
          - string
          - 'null'
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
      - id
      - objectType
      - direction
      - upstreamObjectId
      - syncState
      - lastSyncedAt
      - rowCount
      - retiredAt
      - createdAt
      - updatedAt
      additionalProperties: false
    BuyerStorefrontCapabilitySource:
      description: Source-level storefront capability diagnostic row
      type: object
      properties:
        sourceId:
          description: Inventory source identifier within the storefront
          type: string
        sourceName:
          description: Inventory source display name
          type:
          - string
          - 'null'
        executionType:
          description: Source execution type
          type: string
        agentName:
          description: External sales-agent name when one exists
          type:
          - string
          - 'null'
        requiresCredentials:
          description: Whether buyer-provided credentials are required for this external AdCP source. Null when not applicable or unavailable.
          type:
          - boolean
          - 'null'
        probeable:
          description: Whether this row is an external AdCP sales agent that the capability diagnostic can check
          type: boolean
        probeStatus:
          description: Capability availability status. `reachable` means capabilities are available (including in-process synthesized capabilities for adapter and ESA storefronts), possibly from cache.
          type: string
          enum:
          - reachable
          - unreachable
          - not_applicable
          - unavailable
        message:
          description: Explanation when the row is not probeable
          type:
          - string
          - 'null'
        capabilities:
          description: Capability summary for external AdCP sources; null for managed sources or failed capability lookups
          allOf:
          - $ref: '#/components/schemas/BuyerStorefrontCapabilityDetails'
      required:
      - sourceId
      - sourceName
      - executionType
      - agentName
      - requiresCredentials
      - probeable
      - probeStatus
      - message
      - capabilities
      additionalProperties: false
    ConnectedAdcpStorefront:
      description: Connection/account identifiers for a registered AdCP storefront source ready for an explicit tracked-campaign subscription.
      type: object
      properties:
        connectionId:
          type: string
        connectionAccountId:
          type: string
        storefrontId:
          type: string
        sourceId:
          type: string
        agentId:
          type: string
        advertiserId:
          type: string
        externalAccountId:
          type: string
        providerType:
          type: string
          enum:
          - adcp
        connectionKind:
          type: string
          enum:
          - THIRD_PARTY_AGENT
      required:
      - connectionId
      - connectionAccountId
      - storefrontId
      - sourceId
      - agentId
      - advertiserId
      - externalAccountId
      - providerType
      - connectionKind
      additionalProperties: false
    StorefrontConnectionAccountCampaignRollup:
      description: 'Directed-campaign rollup for one connected account: tracked = mirrored read-only from the connected seller account; managed = authored through the platform. Spend is seller-reported net in the account currency; sums cover delivery denominated in (or reported without) that currency.'
      type: object
      properties:
        campaignsTracked:
          description: Non-retired tracked campaigns on this account. A tracked campaign is a campaign the platform did not set up, mirrored read-only from the connected seller account.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        campaignsActive:
          description: Subset of campaignsTracked whose campaign status is currently ACTIVE.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        trackedSpend:
          description: Delivered spend across tracked campaigns over the trailing window, in the account currency. Seller-reported net — directed buys dispatch the full media budget zero-fee, so net equals the buyer's budget.
          type: number
          minimum: 0
        managedSpend:
          description: Delivered spend across managed campaigns (authored through the platform) over the trailing window, in the account currency. Seller-reported net, same denomination as trackedSpend.
          type: number
          minimum: 0
        managedShare:
          description: 'The adoption metric for this relationship: managedSpend / (trackedSpend + managedSpend). Null when no spend was accounted in the window.'
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        currency:
          description: ISO 4217 currency all spend values in this rollup are denominated in — always the account currency. Rollups are never summed across currencies.
          type: string
          pattern: ^[A-Z]{3}$
        windowDays:
          description: Trailing window, in days, the spend aggregates cover (currently 365).
          type: integer
          maximum: 9007199254740991
          minimum: 1
      required:
      - campaignsTracked
      - campaignsActive
      - trackedSpend
      - managedSpend
      - managedShare
      - currency
      - windowDays
      additionalProperties: false
    BuyerAdapterConnectionStatus:
      description: Buyer-specific delegated-auth status for an official adapter storefront.
      type: object
      properties:
        status:
          description: Whether this buyer already has delegated credentials for the adapter storefront.
          type: string
          enum:
          - not_connected
          - connected
          - needs_account_selection
          - error
        authModes:
          description: Credential flows supported by this adapter storefront for the buyer.
          type: array
          items:
            type: string
            enum:
            - oauth
            - bearer
        accountCount:
          description: Number of active provider accounts discovered for this buyer connection.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mappedAdvertiserCount:
          description: 'Distinct advertisers with an active mapping to one of this connection''s currently active accounts. 0 on a connected storefront means connected-but-not-yet-buyable: a media buy for an unmapped advertiser fails with account_mapping_required until it is mapped under Settings → Connections.'
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        selectedAccountName:
          description: Selected provider account display name, if one has been selected.
          type:
          - string
          - 'null'
      required:
      - status
      - authModes
      - accountCount
      - mappedAdvertiserCount
      - selectedAccountName
      additionalProperties: false
    SubscribeDirectedCampaignsResponse:
      description: The durable subscription plus the initial one-year mirror reconciliation.
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/DirectedCampaignSubscription'
        sync:
          $ref: '#/components/schemas/DirectedCampaignSyncOutcome'
      required:
      - subscription
      - sync
      additionalProperties: false
    BuyerStorefrontDiscoveryPerformance:
      description: Observed buyer product-discovery response timing for this storefront.
      type: object
      properties:
        sampleCount:
          description: Number of buyer discovery responses included in the timing rollup.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        successCount:
          description: Number of successful buyer discovery responses in the timing rollup.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        timeoutCount:
          description: Number of buyer discovery calls that hit the caller wait deadline.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        avgResponseTimeMs:
          description: Average storefront response time in milliseconds, or null when no samples exist.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        maxResponseTimeMs:
          description: Slowest recorded storefront response time in milliseconds.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        lastResponseTimeMs:
          description: Most recent recorded storefront response time in milliseconds.
