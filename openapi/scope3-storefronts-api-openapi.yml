      - logoUrl
      - logoBackground
      - description
      - website
      - brandColors
      - discoveryCard
      - displayStatus
      - readiness
      - channels
      - adapterProviderType
      - adapterSourceKind
      - creativeCapabilities
      - adapterConnection
      - supportedRoutingTypes
      - supportedBilling
      - regions
      - connected
      - requiresCredentials
      - customerAccounts
      - adcpCapabilities
      - discoveryPerformance
      additionalProperties: false
