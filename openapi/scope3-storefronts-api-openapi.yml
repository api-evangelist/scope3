    BuyerStorefrontReadiness:
      description: Canonical transaction eligibility for this storefront. This is independent of buyer credential connection state.
      type: object
      properties:
        canTransact:
          description: Whether ordinary buyer traffic may currently transact with this storefront.
          type: boolean
        effectiveStatus:
          description: Canonical buyer-facing availability after combining seller controls with readiness evidence.
          type: string
          enum:
          - archived
          - paused
          - blocked
          - live
        blockerIds:
          description: Machine-readable readiness blockers. Empty when effectiveStatus is `live`.
          type: array
          items:
            type: string
      required:
      - canTransact
      - effectiveStatus
      - blockerIds
      additionalProperties: false
    BuyerCredentialSourceRef:
      description: A storefront/source pair that a single credential row gives the buyer access to
      type: object
      properties:
        storefrontId:
          description: Storefront ID this credential covers
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        storefrontName:
          description: Storefront display name
          type: string
        sourceId:
          description: Inventory source ID within the storefront
          type: string
        sourceName:
          description: Inventory source display name
          type: string
      required:
      - storefrontId
      - storefrontName
      - sourceId
      - sourceName
      additionalProperties: false
    BuyerCredential:
      description: A buyer's registered credential, scoped to the storefront sources it gives access to
      type: object
      properties:
        id:
          description: Credential record ID
          type: string
        accountIdentifier:
          description: The buyer's account identifier at the source
          type: string
        accountType:
          description: Account type (e.g. CLIENT, MARKETPLACE)
          type: string
        status:
          description: Credential status
          type: string
        registeredBy:
          description: Who registered this credential. Null on legacy rows that predate registration tracking.
          type:
          - string
          - 'null'
        createdAt:
          description: When the credential was created (ISO 8601)
          type: string
        updatedAt:
          description: When the credential was last updated (ISO 8601)
          type: string
        sources:
          description: Storefront sources this credential gives the buyer access to. A single credential may cover multiple sources when the same agent backs the same source across storefronts. Can be empty when the credential's underlying agent is no longer linked to any active storefront source — the credential row is preserved so buyers can see (and clean up) orphaned registrations.
          type: array
          items:
            $ref: '#/components/schemas/BuyerCredentialSourceRef'
      required:
      - id
      - accountIdentifier
      - accountType
      - status
      - registeredBy
      - createdAt
      - updatedAt
      - sources
      additionalProperties: false
    BuyerStorefront:
      description: A storefront as seen by a buyer
      type: object
      properties:
        id:
          description: Storefront ID
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        platformId:
          description: Public-facing slug
          type: string
        name:
          description: Storefront display name
          type: string
        publisherDomain:
          description: Publisher domain
          type:
          - string
          - 'null'
        brandName:
          description: Operator-owned or resolved brand name shown on storefront discovery cards.
          type:
          - string
          - 'null'
        logoUrl:
          description: Operator-owned or resolved logo URL shown on storefront discovery cards.
          type:
          - string
          - 'null'
        logoBackground:
          description: Backdrop the logo is designed for, from brand.json. Null when unknown.
          type:
          - string
          - 'null'
        description:
          description: Operator-curated description shown on storefront discovery cards.
          type:
          - string
          - 'null'
        website:
          description: Operator-curated website URL shown on storefront discovery cards.
          type:
          - string
          - 'null'
        brandColors:
          $ref: '#/components/schemas/BuyerStorefrontBrandColors'
        discoveryCard:
          description: Canonical storefront identity and coverage used by every marketplace card renderer.
          allOf:
          - $ref: '#/components/schemas/DiscoveryCard'
        displayStatus:
          description: Deprecated stored-control label. Legacy projections retain `configuring` and `transacting`; projections backed by `isPaused` return `neutral` or `paused`. `archived` overrides both. Use readiness.effectiveStatus and readiness.canTransact for actual availability.
          type: string
          enum:
          - configuring
          - transacting
          - archived
          - neutral
          - paused
        readiness:
          $ref: '#/components/schemas/BuyerStorefrontReadiness'
        channels:
          description: Ad channels this storefront supports (e.g. "display", "CTV", "audio"). Empty array if not specified.
          example:
          - CTV
          - display
          type: array
          items:
            type: string
        adapterProviderType:
          description: Adapter platform type (e.g. "meta", "tiktok"). Null for non-adapter storefronts.
          type:
          - string
          - 'null'
        publishers:
          type:
          - object
          - 'null'
          properties:
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            verified:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            sample:
              type: array
              items:
                type: string
          required:
          - total
          - verified
          - sample
          additionalProperties: false
        adapterSourceKind:
          description: Adapter family for official adapter storefronts, such as sales or creative. Null for non-adapter storefronts.
          type:
          - string
          - 'null'
          enum:
          - sales
          - creative
          - signals
          - measurement
          - optimization
          - composite
        creativeCapabilities:
          description: Creative-generation capabilities when this is a creative adapter storefront; null otherwise.
          allOf:
          - $ref: '#/components/schemas/BuyerCreativeStorefrontCapability'
        adapterConnection:
          description: Buyer-specific connection state for official adapter storefronts; null for non-adapter storefronts or when connection state was not requested.
          allOf:
          - $ref: '#/components/schemas/BuyerAdapterConnectionStatus'
        supportedRoutingTypes:
          deprecated: true
          description: Deprecated v2 compatibility placeholder. Every storefront returns both legacy values. Do not use this field for storefront type, targeting, eligibility, execution, connectivity, or settlement; use explicit capabilities, authentication state, and BillingParty instead.
          type: array
          items:
            type: string
            enum:
            - DECISIONED
            - ROUTED
        supportedBilling:
          description: 'Supported billing parties for media bought from this storefront, using AdCP BillingParty vocabulary (who is invoiced): `agent` means Interchange clears the transaction and bills the buyer; `operator`/`advertiser` mean the seller or connected platform bills the account operator or advertiser directly — Interchange never touches the media money. Adapter storefronts are always `operator`/`advertiser`.'
          minItems: 1
          type: array
          items:
            type: string
            enum:
            - operator
            - agent
            - advertiser
        regions:
          description: Operator-curated regions this storefront covers (ISO 3166-1 alpha-2 country codes or group codes like WORLDWIDE, EMEA, NORAM). Empty array if not specified.
          example:
          - UK
          - EMEA
          type: array
          items:
            type: string
        connected:
          description: Whether every inventory source the buyer needs is connected. This is buyer credential wiring, not storefront transaction readiness; use `readiness.canTransact` for availability.
          type: boolean
        requiresCredentials:
          description: Whether the buyer must register credentials before they can transact with this storefront.
          type: boolean
        customerAccounts:
          description: The buyer's registered accounts for this storefront, aggregated across its inventory sources and deduped by accountIdentifier.
          type: array
          items:
            $ref: '#/components/schemas/BuyerStorefrontAccount'
        adcpCapabilities:
          description: AdCP capability manifest for the storefront's underlying agent(s). Non-null for agent-based storefronts with cached capability data; null for adapter storefronts or when no capability data has been fetched yet.
          allOf:
          - $ref: '#/components/schemas/BuyerStorefrontAdcpCapabilities'
        discoveryPerformance:
          description: Observed response-time stats from buyer product discovery. Use this to decide whether to ask the user before running a long discovery wait.
          allOf:
          - $ref: '#/components/schemas/BuyerStorefrontDiscoveryPerformance'
