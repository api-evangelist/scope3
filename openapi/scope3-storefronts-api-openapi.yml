    BuyerStorefrontAdcpCapabilities:
      description: AdCP capability manifest for a storefront's underlying agent(s), derived from the cached `get_adcp_capabilities` response. Check `capabilitiesCachedAt` for data freshness.
      type: object
      properties:
        supportsUpdateMediaBuy:
          description: Whether the agent declares support for `update_media_buy`. When false, buyers should not attempt to modify a campaign after booking.
          type: boolean
        supportsCreateMediaBuy:
          description: Whether the agent declares support for `create_media_buy`.
          type: boolean
        supportsGetReporting:
          description: Whether the agent supports delivery reporting via `get_media_buy_delivery`.
          type: boolean
        supportsSandbox:
          description: Whether the agent declares sandbox mode — useful for integration testing without live spend.
          type: boolean
        extensions:
          description: AdCP extension identifiers the agent declares support for (e.g. `"sandbox"`, `"custom_targeting"`).
          type: array
          items:
            type: string
        protocols:
          description: AdCP protocol versions the agent speaks (e.g. `["adcp-v3"]`).
          type: array
          items:
            type: string
        publisherDomains:
          description: Publisher domains declared across the storefront’s source-agent portfolios.
          type: array
          items:
            type: string
        channels:
          description: Standard primary channels declared across source-agent portfolios. Authoritative for a pure pass-through storefront; inventory evidence for managed ingredient sources.
          type: array
          items:
            type: string
        countries:
          description: Standard primary countries declared across source-agent portfolios. Authoritative for a pure pass-through storefront; inventory evidence for managed ingredient sources.
          type: array
          items:
            type: string
        countriesComplete:
          description: Whether every routed source declared at least one primary country. False means the country union is partial evidence.
          type: boolean
        channelsComplete:
          description: Whether every routed source declared at least one primary channel. False means the channel union is partial evidence.
          type: boolean
        version:
          description: AdCP version string reported by the agent.
          type:
          - string
          - 'null'
        reportingDeliveryMethods:
          description: Push-based delivery methods the agent supports for reporting. Polling via `get_media_buy_delivery` is always available as a baseline. Null when the agent has not declared delivery methods.
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - webhook
            - offline
        offlineDeliveryProtocols:
          description: Cloud storage protocols supported for offline reporting delivery. Relevant only when `reportingDeliveryMethods` includes `"offline"`. Null when not declared.
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - s3
            - gcs
            - azure_blob
        capabilitiesCachedAt:
          description: When the capability manifest was last fetched from the agent. Capabilities are cached up to 24 hours.
          type:
          - string
          - 'null'
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
      - supportsUpdateMediaBuy
      - supportsCreateMediaBuy
      - supportsGetReporting
      - supportsSandbox
      - extensions
      - protocols
      - countriesComplete
      - channelsComplete
      - version
      - reportingDeliveryMethods
      - offlineDeliveryProtocols
      - capabilitiesCachedAt
      additionalProperties: false
    StorefrontConnectionAgentSource:
      description: Agent-backed inventory source eligible for external account mappings.
      type: object
      properties:
        sourceId:
          description: Canonical provider ID for an official adapter (for example, meta), or the inventory source ID for an external AdCP connection.
          type: string
        name:
          description: Display name for the inventory source.
          type: string
      required:
      - sourceId
      - name
      additionalProperties: false
    ApiError:
      description: Structured error object
      type: object
      properties:
        code:
          description: Machine-readable error code
          type: string
        message:
          description: Human-readable error message
          type: string
        field:
          description: Field path associated with the error
          type: string
        details:
          description: Additional error context
          type: object
          additionalProperties: {}
      required:
      - code
      - message
      additionalProperties: false
    BuyerCreativeStorefrontCapability:
      description: Machine-readable creative generation capability summary for an adapter storefront.
      type: object
      properties:
        kind:
          description: Capability kind for creative-generation storefronts.
          type: string
          enum:
          - creative_generation
        modalities:
