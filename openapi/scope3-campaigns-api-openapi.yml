components:
  schemas:
    StorefrontEndpointDirectedCampaignInfo:
      description: Provenance and dual-key identity for a direct buy through one storefront AdCP endpoint.
      type: object
      properties:
        provenance:
          description: This directed campaign was created by an external AdCP buyer addressing one storefront endpoint.
          type: string
          enum:
          - storefront_endpoint
        storefrontId:
          description: Storefront DB id that owns execution for this campaign.
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        buyerMediaBuyId:
          description: AdCP media-buy id used by the external buyer at the storefront boundary.
          example: buyer_mb_44521
          type: string
          minLength: 1
        mediaBuyId:
          description: Interchange media-buy id used by the campaign, contract, reporting, and ledger layers. Omitted only for legacy endpoint shells created before this projection was recorded.
          example: mb_ETBn4gJ9Wu
          type: string
          minLength: 1
      required:
      - provenance
      - storefrontId
      - buyerMediaBuyId
      additionalProperties: false
    ExecuteCampaignBody:
      description: Optional request body for executing a campaign. Unknown fields are rejected.
      type: object
      properties:
        debug:
          description: When true, includes detailed debug information in error responses from media buy execution
          type: boolean
      additionalProperties: false
    CreateDiscoveryCampaignBody:
      description: Request body for creating a discovery-mode campaign
      type: object
      properties:
        advertiserId:
          description: Advertiser ID that will own this campaign
          example: 12345
          type: integer
          maximum: 9007199254740991
          minimum: 1
        name:
          description: Name of the campaign
          example: Q1 2025 Campaign
          type: string
          minLength: 1
          maxLength: 255
        flightDates:
          description: Campaign flight dates
          type: object
          properties:
            startDate:
              description: Campaign start date (ISO 8601)
              example: '2025-01-15T00:00:00Z'
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            endDate:
              description: Campaign end date (ISO 8601)
              example: '2025-03-31T23:59:59Z'
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          required:
          - startDate
          - endDate
        budget:
          description: Campaign budget configuration
          type: object
          properties:
            total:
              type: number
              exclusiveMinimum: 0
            currency:
              description: Optional ISO 4217 currency. If provided it must match the advertiser's primary currency; otherwise the advertiser's currency is used. Campaigns cannot be created in a currency other than the advertiser's.
              type: string
              minLength: 3
              maxLength: 3
            dailyCap:
              type: number
              exclusiveMinimum: 0
            pacing:
              type: string
              enum:
              - EVEN
              - ASAP
              - FRONTLOADED
          required:
          - total
        brief:
          description: Natural language brief for product search context
          example: Looking for premium video inventory targeting tech enthusiasts
          type: string
          maxLength: 5000
        constraints:
          description: Campaign targeting constraints
          type: object
          properties:
            geo_countries:
              type: array
              items:
                type: string
            geo_countries_exclude:
              type: array
              items:
                type: string
            geo_regions:
              type: array
              items:
                type: string
            geo_regions_exclude:
              type: array
              items:
                type: string
            geo_metros:
              type: array
              items:
                type: object
                properties:
                  system:
                    anyOf:
                    - type: string
                      enum:
                      - nielsen_dma
                    - type: string
                      enum:
                      - uk_itl1
                    - type: string
                      enum:
                      - uk_itl2
                    - type: string
                      enum:
                      - eurostat_nuts2
                    - type: string
                      enum:
                      - custom
                  values:
                    type: array
                    items:
                      type: string
                required:
                - system
                - values
                additionalProperties: {}
            geo_metros_exclude:
              type: array
              items:
                type: object
                properties:
                  system:
                    anyOf:
                    - type: string
