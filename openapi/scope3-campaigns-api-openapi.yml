                description: ISO 8601 date-time. End of this media buy. Must fall within the campaign's flight dates. Media buy dates MAY correspond to a pacingPeriods[].end when the media buy represents a specific period, but pacing periods do not govern media buy dates — a media buy can have any end within the campaign flight, with or without pacing periods.
