                description: 'Optimization goals applied to every package at execution time. Each goal is either `{ kind: "event", event_sources: [{ event_source_id, event_type }], target? }` or `{ kind: "metric", metric, target? }`. Event target kinds: `cost_per` (CPA), `per_ad_spend` (ROAS), `maximize_value`. Metric target kinds: `cost_per`, `threshold_rate`. ALWAYS ask the buyer what they want to optimize for before updating — do not change goals silently. Pass an empty array to clear all goals.'
