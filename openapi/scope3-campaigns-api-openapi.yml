          items:
            type: object
            properties:
              action:
                description: Action to perform. "update" (default) modifies the media buy, "cancel" cancels it, "delete" archives it.
                type: string
                enum:
                - update
                - cancel
                - delete
              mediaBuyId:
                description: ID of the media buy to act on
                type: string
                minLength: 1
              reason:
                description: 'Cancellation reason (only for action: "cancel")'
                type: string
                maxLength: 1000
              packageIds:
                description: 'Cancel specific packages instead of the whole media buy (only for action: "cancel")'
                type: array
                items:
                  type: string
                  minLength: 1
              name:
                description: Updated media buy name
                type: string
                minLength: 1
                maxLength: 255
              packages:
                description: Per-package updates (for media buys with deployed packages)
                type: array
                items:
                  type: object
                  properties:
