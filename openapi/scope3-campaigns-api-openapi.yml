          default: ''
          type: string
          maxLength: 1024
        format:
          default: JSONL
          type: string
          enum:
          - JSONL
          - PARQUET
          - CSV
      required:
      - type
      - pathPrefix
      - format
      additionalProperties: false
    EventGoalOutput:
      description: Optimize for advertiser-tracked conversion events via event sources.
      type: object
      properties:
        kind:
          type: string
          enum:
          - event
        eventSources:
          description: Event source and type pairs feeding this goal. Seller deduplicates by event_id across entries.
          minItems: 1
          type: array
          items:
            type: object
            properties:
              eventSourceId:
                description: Event source to include (must be configured via sync_event_sources)
                example: website_pixel
                type: string
                minLength: 1
              eventType:
                description: IAB ECAPI event type to optimize for
                type: string
                enum:
                - page_view
                - view_content
                - select_content
                - select_item
                - search
                - share
                - add_to_cart
                - remove_from_cart
                - viewed_cart
                - add_to_wishlist
                - initiate_checkout
                - add_payment_info
                - purchase
                - refund
                - lead
                - qualify_lead
                - close_convert_lead
                - disqualify_lead
                - complete_registration
                - subscribe
                - follow
                - content_view
                - watch_milestone
                - start_trial
                - app_install
                - app_launch
                - contact
                - schedule
                - donate
                - submit_application
                - custom
              customEventName:
                description: Required when eventType is 'custom'. Platform-specific custom event name.
                type: string
              valueField:
                description: Field on custom_data carrying the monetary value. Required when target is 'per_ad_spend'.
                example: value
                type: string
              valueFactor:
                description: Multiplier for valueField (default 1). Use -1 for refunds, 0.01 for cents.
                example: 1
                type: number
            required:
            - eventSourceId
            - eventType
            additionalProperties: false
        target:
          description: Target cost or return. When omitted, the seller maximizes conversions within budget.
          oneOf:
          - type: object
            properties:
              kind:
                type: string
                enum:
                - cost_per
              value:
                description: Target cost per unit in buy currency
                example: 25
                type: number
                exclusiveMinimum: 0
            required:
            - kind
            - value
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                enum:
                - per_ad_spend
              value:
                description: Target return ratio (e.g. 4.0 = $4 of value per $1 spent)
                example: 4
                type: number
                exclusiveMinimum: 0
            required:
            - kind
            - value
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                enum:
                - maximize_value
            required:
            - kind
            additionalProperties: false
          type: object
        attributionWindow:
          description: Attribution window for this goal. When omitted, the seller uses their default.
          allOf:
          - $ref: '#/components/schemas/OptimizationAttributionWindowOutput'
        priority:
          description: Priority among goals on this package. 1 = highest. When omitted, sellers use array position.
          example: 1
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - kind
      - eventSources
      additionalProperties: false
    MetricGoalOutput:
      description: Optimize for a seller-tracked delivery metric. No event source required.
      type: object
      properties:
        kind:
          type: string
          enum:
          - metric
        metric:
          description: 'Seller-native metric to optimize for. Delivery metrics: clicks, views (viewable impressions, per AdCP), completed_views (video/audio completions, qualified by viewDurationSeconds). Duration/score: viewed_seconds, attention_seconds, attention_score. Audience action: engagements, follows, saves, profile_visits. To target a viewability rate, use metric: ''views'' with a threshold_rate target (proportion of impressions).'
          type: string
          enum:
          - clicks
          - views
          - completed_views
          - viewed_seconds
          - attention_seconds
          - attention_score
          - engagements
          - follows
          - saves
          - profile_visits
          - reach
        viewDurationSeconds:
          description: Minimum video view duration in seconds for completed_view. Only applicable when metric is 'completed_views'.
          type: number
          exclusiveMinimum: 0
        target:
          description: Target for this metric. When omitted, the seller maximizes metric volume within budget.
          oneOf:
          - type: object
            properties:
              kind:
                type: string
                enum:
                - cost_per
              value:
                description: Target cost per unit in buy currency
                example: 25
                type: number
                exclusiveMinimum: 0
            required:
            - kind
            - value
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                enum:
                - threshold_rate
              value:
                description: 'Minimum per-impression value. Units depend on metric: proportion (clicks, views), seconds (viewed_seconds, attention_seconds), or score (attention_score).'
                example: 0.001
                type: number
                exclusiveMinimum: 0
            required:
            - kind
            - value
            additionalProperties: false
          type: object
        priority:
          description: Priority among goals on this package. 1 = highest. When omitted, sellers use array position.
          example: 2
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - kind
      - metric
      additionalProperties: false
    GeoMetrosResponse:
      description: Geo metro codes and English display labels for buyer-side display and input resolution.
      type: object
      properties:
        system:
          description: Targeting system these entries belong to
          example: nielsen_dma
          allOf:
          - $ref: '#/components/schemas/TargetingDimensionSystem'
        locale:
          description: Locale for the display labels. Currently only English labels are supported.
          example: en-US
          type: string
          enum:
          - en-US
        entries:
          description: Known code-name pairs for this system
          type: array
          items:
            $ref: '#/components/schemas/TargetingDimensionEntry'
      required:
      - system
      - locale
      - entries
      additionalProperties: false
    CampaignProductsResponse:
      description: Every product attached to a campaign, sourced from the campaign's media buys (authoritative) plus any discovery-staged products that have not yet been executed onto a media buy. Use this to get the full ad-product list for a campaign without paging through the nested `mediaBuys[]` tree on `get_campaign`. Pass `mediaBuyId` to narrow to a specific buy.
      type: object
      properties:
        campaignId:
          description: Campaign ID
          type: string
        discoveryId:
          description: Discovery session attached to the campaign, or null if none attached
          type:
          - string
          - 'null'
        products:
          description: Products staged on this campaign
          type: array
          items:
            $ref: '#/components/schemas/CampaignProductEntry'
        searchContexts:
          description: Discovery runs that have contributed products
          type: array
          items:
            $ref: '#/components/schemas/CampaignSearchContextSummary'
        summary:
          description: Aggregate counts for products on the campaign
          type: object
          properties:
            totalProducts:
              description: Total number of products staged on the campaign
              type: integer
              minimum: 0
              maximum: 9007199254740991
            productsOnMediaBuys:
              description: Products already attached to a media buy
              type: integer
              minimum: 0
              maximum: 9007199254740991
            productsPending:
              description: Products staged but not yet on a media buy
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
          - totalProducts
          - productsOnMediaBuys
          - productsPending
          additionalProperties: false
      required:
      - campaignId
      - discoveryId
      - products
      - searchContexts
      - summary
      additionalProperties: false
    TargetingDimensionSystem:
      description: Supported targeting dimension system
      example: nielsen_dma
      type: string
      enum:
      - nielsen_dma
    MediaBuyRef:
      description: Lightweight media buy reference (id + live status). Used in Campaign.mediaBuyRefs so callers can enumerate media buys without loading the full nested tree.
      type: object
      properties:
        mediaBuyId:
          description: Unique identifier for the media buy
          example: mb_ETBn4gJ9Wu
          type: string
        status:
          description: 'Status of the LIVE media buy: what is delivering now (DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, COMPLETED, CANCELED). A buy that is ACTIVE with a change awaiting approval reports ACTIVE here and carries `pendingChange`; a queued change never replaces this value.'
          example: ACTIVE
          type: string
        pendingAt:
          description: Which layer the media buy itself is parked at; only present while its own status is PENDING_APPROVAL (a buy awaiting its first approval). For a change queued behind an already-live buy, read `pendingChange.pendingAt`. 'storefront' = waiting for the storefront operator's manual approval, 'salesagent' = the inventory source is still processing the buy, 'unknown' = indeterminate.
          type: string
          enum:
          - storefront
          - salesagent
          - unknown
        pendingChange:
          $ref: '#/components/schemas/MediaBuyRefPendingChange'
      required:
      - mediaBuyId
      - status
      additionalProperties: false
    OptimizationGoalOutput:
      description: A single optimization target. Either kind "event" (conversion events) or kind "metric" (seller-native delivery metric).
      oneOf:
      - $ref: '#/components/schemas/EventGoalOutput'
      - $ref: '#/components/schemas/MetricGoalOutput'
      type: object
      discriminator:
        propertyName: kind
        mapping:
          event: '#/components/schemas/EventGoalOutput'
          metric: '#/components/schemas/MetricGoalOutput'
    MediaBuyErrorOwner:
      description: 'Which party owns fixing the error: buyer_input (the request needs a correction from the buyer), platform (Scope3 owns the fault), seller (the storefront or its source made the decision or is unavailable).'
      type: string
      enum:
      - buyer_input
      - platform
      - seller
    ExecuteMediaBuyDebugInfo:
      description: Full debug info including ADCP request, response, and A2A debug logs. Only present when debug=true. Same structure as v1 execute_media_buy debug output.
      type: object
      properties:
        request:
          description: The full ADCP create_media_buy request payload sent to the sales agent
          type: object
          additionalProperties: {}
        response:
          description: The full ADCP response from the sales agent
          type: object
          additionalProperties: {}
        debugLogs:
          description: Full A2A request/response debug logs from the ADCP client
          type: array
          items:
            type: object
            additionalProperties: {}
        error:
          description: Error message if the execution failed
          type: string
      additionalProperties: false
    CampaignStatusChangeResponse:
      description: Response from executing or pausing a campaign
      type: object
      properties:
        campaignId:
          description: Campaign ID
          example: cmp_987654321
          type: string
        previousStatus:
          description: Previous campaign status
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - COMPLETED
          - CANCELED
          - ARCHIVED
        newStatus:
          description: New campaign status
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - COMPLETED
          - CANCELED
          - ARCHIVED
        success:
          description: Whether the status change was fully successful. False when any media buy execution failed.
          type: boolean
        mediaBuysExecuted:
          description: Number of media buys that execution was attempted for. Always present on execute responses; absent on pause responses. 0 indicates a no-op execute (nothing to execute, campaign status preserved).
          example: 2
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reason:
          description: Machine-readable reason for a no-op execute. Present only when the campaign had no media buys to execute, in which case the campaign status is preserved rather than set to ACTIVE.
          type: string
          enum:
          - no_media_buys_to_execute
        errors:
          description: Structured error details per failed media buy. Only present when there are failures.
          type: array
          items:
            $ref: '#/components/schemas/ExecutionError'
        warnings:
          description: 'Non-fatal outcomes from execution. creatives_dropped: a buy forwarded with a compatible creative subset (which may be empty). stale_draft: the existing DRAFT cart was retried as-is because discovery products were updated via add_discovery_products after the last staging run — call create_media_buys with replace: true to apply the new selection.'
          type: array
          items:
            $ref: '#/components/schemas/ExecuteWarning'
      required:
      - campaignId
      - previousStatus
      - newStatus
      - success
      additionalProperties: false
    BuyerPackage:
      description: One package on a media buy, carrying the attributes that identify it. Targeting, creatives, and format detail are deliberately omitted; use get_campaign for those.
      type: object
      properties:
        packageId:
          description: 'The package identifier to quote when updating or pausing this package. Treat it as an opaque string: the trailing number is a dispatch-order position, not a period number. Use pacingPeriod to identify the period.'
          example: sf_pkg_sf_mb_1783618937177_43ycbp7b_3
          type: string
        productId:
          description: The seller product this package buys. Together with pacingPeriod this uniquely identifies a package within its media buy. Note the nested package inside GET /campaigns/:id spells this `productIds` as a single-element array; this endpoint uses the singular form, which matches the AdCP Package field.
          type:
          - string
          - 'null'
        productName:
          description: The product's name as published by the seller, when it is known locally.
          type: string
        status:
          description: 'Whether this package is currently buying. Independent of the media buy status: a live buy can carry a paused package.'
          type: string
          enum:
          - active
          - paused
          - canceled
        pacingPeriod:
          allOf:
          - $ref: '#/components/schemas/PackagePacingPeriod'
        startTime:
          description: When this package starts buying (ISO 8601). Absent on packages created before the platform retained its own requested window, in which case fall back to the media buy's window.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        endTime:
          description: When this package stops buying (ISO 8601). This is the field to match when a buyer names a package by the date it ends.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        budget:
          description: This package's budget, gross of buyer fees, in budgetCurrency.
          type:
          - number
          - 'null'
        budgetCurrency:
          description: ISO-4217 currency of budget.
          example: USD
          type: string
        pacing:
          description: How the package spends its budget (even, asap, front_loaded).
          type: string
        delivery:
          allOf:
          - $ref: '#/components/schemas/BuyerPackageDelivery'
      required:
      - packageId
      - productId
      - status
      - budget
      additionalProperties: false
    OptimizationGoal:
