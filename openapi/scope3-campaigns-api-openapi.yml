        storefronts:
          description: Storefronts the campaign is pinned to. When set, every product discovery run for this campaign auto-applies the corresponding storefront filter. Each entry includes both the storefront DB `id` and the public `platformId` + `name` so the response is renderable without a follow-up lookup. Absent or empty means the campaign is not pinned to any specific storefronts.
          type: array
          items:
            $ref: '#/components/schemas/CampaignStorefrontRef'
        performanceConfig:
          description: Performance configuration (present for performance campaigns)
          allOf:
          - $ref: '#/components/schemas/PerformanceConfigOutput'
        optimizationApplyMode:
          description: Controls whether Scope3 AI model optimizations to media buys are applied automatically or require manual approval. Defaults to the advertiser-level setting if not explicitly set on the campaign.
          allOf:
          - $ref: '#/components/schemas/OptimizationApplyMode'
        catalogId:
          description: Attached catalog ID
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        discoveryId:
          description: ID of the discovery session used to select products for this campaign. Only present for DRAFT campaigns; after execution, product data is represented through media buys.
          example: session_abc123
          type: string
        productCount:
          description: Number of products selected for this campaign. Only present for DRAFT campaigns; after execution, product data is represented through media buys.
          example: 15
          type: integer
          minimum: 0
          maximum: 9007199254740991
        products:
          description: Products selected for this campaign. Only present for DRAFT campaigns; after execution, product data is represented through media buys.
          type: array
          items:
            type: object
            properties:
              productId:
                description: Unique identifier for the product
                example: prod_123
                type: string
            required:
            - productId
            additionalProperties: false
        audiences:
          description: Audiences associated with this campaign (both targeted and suppressed)
          type: array
          items:
            type: object
            properties:
              audienceId:
                description: Unique identifier for the audience
                example: aud_123
                type: string
              name:
                description: Display name of the audience
                example: Tech Enthusiasts 25-34
                type:
                - string
                - 'null'
              status:
                description: Processing status of the audience (e.g. READY, PROCESSING, TOO_SMALL)
                example: READY
                type: string
                enum:
                - PROCESSING
                - ERROR
                - READY
                - TOO_SMALL
              type:
                description: Whether this audience is targeted or suppressed (excluded)
                example: TARGET
                type: string
                enum:
                - TARGET
                - SUPPRESS
              enabledAt:
                description: When the audience was enabled for this campaign (ISO 8601)
                example: '2025-03-01T12:00:00Z'
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            required:
            - audienceId
            - name
            - status
            - type
            - enabledAt
            additionalProperties: false
        creativeFormats:
          description: Canonical creative format coverage for this campaign — URL-free format kinds required by selected products, covered by uploaded creatives, and still missing. Surface `missing` to prompt the user to upload the remaining creatives.
          type: object
          properties:
            required:
              type: array
              items:
                type: object
                properties:
                  format_kind:
                    type: string
                required:
                - format_kind
                additionalProperties: false
            covered:
              type: array
              items:
                type: object
                properties:
                  format_kind:
                    type: string
                required:
                - format_kind
                additionalProperties: false
            missing:
              type: array
              items:
                type: object
                properties:
                  format_kind:
                    type: string
                required:
                - format_kind
                additionalProperties: false
          required:
          - required
          - covered
          - missing
          additionalProperties: false
        propertyLists:
          description: Include/exclude property lists actually applied to this campaign via its media-buy packages. Only present when `includePropertyLists=true` is passed. An empty `propertyLists` array is the authoritative answer that no lists are applied; do not infer presence from the campaign brief or constraints.
          type: object
          properties:
            propertyLists:
              type: array
              items:
                type: object
                properties:
                  listId:
                    type: string
                  name:
                    type: string
                  purpose:
                    type: string
                    enum:
                    - include
                    - exclude
                  propertyCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  viaMediaBuys:
                    type: array
                    items:
                      type: object
                      properties:
                        mediaBuyId:
                          type: string
                        packageIds:
                          type: array
                          items:
                            type: string
                      required:
                      - mediaBuyId
                      - packageIds
                      additionalProperties: false
                required:
                - listId
                - name
                - purpose
                - propertyCount
                - createdAt
                - updatedAt
                - viaMediaBuys
                additionalProperties: false
            summary:
              type: object
              properties:
                totalLists:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                includeCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                excludeCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
              - totalLists
              - includeCount
              - excludeCount
              additionalProperties: false
          required:
          - propertyLists
          - summary
          additionalProperties: false
        mediaBuys:
          description: Media buys associated with this campaign. Present after execution; contains the product allocations, packages, and delivery data for each sales agent.
          type: array
          items:
            type: object
            properties:
              mediaBuyId:
                description: Unique identifier for the media buy
                type: string
              name:
                description: Media buy name
                type: string
              status:
                description: Current media buy status (e.g. DRAFT, ACTIVE, PAUSED, COMPLETED)
                type: string
              revision:
                description: Last authoritative provider revision observed for this media buy.
                type: integer
                minimum: 0
                maximum: 9007199254740991
              validActions:
                description: Provider-reported AdCP actions that are currently valid for this media buy.
                type: array
                items:
                  type: string
              pendingAt:
                description: Which layer the media buy is parked at; only present while status is PENDING_APPROVAL. 'storefront' = waiting for the storefront operator's manual approval, 'salesagent' = the inventory source is still processing the buy, 'unknown' = the pending layer is indeterminate.
                type: string
                enum:
                - storefront
                - salesagent
                - unknown
              pendingReason:
                description: Why the buy is not delivering yet, rolled up to the most-blocking wait across its legs. An annotation derived from persisted forwarding state — never a status. Absent when the buy is delivering, terminal, or not storefront-routed.
                allOf:
                - $ref: '#/components/schemas/MediaBuyPendingReason'
              pendingSince:
                description: When the current wait began (ISO 8601). Present when pendingReason is set and the start of the wait is known.
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              errorCode:
                description: Buyer-safe structured error code when forwarding failed or the buy was rejected. Internal platform codes are mapped to this set and never emitted raw.
                allOf:
                - $ref: '#/components/schemas/BuyerMediaBuyErrorCode'
              errorOwner:
                description: Which party owns fixing the error. Present whenever errorCode is present.
                allOf:
                - $ref: '#/components/schemas/MediaBuyErrorOwner'
              sourceMessage:
                description: The source's rejection or moderation message, when one was provided — whitespace-collapsed, truncated, and known upstream identifiers removed.
                type: string
              forwardedAt:
                description: When the buy was forwarded to its inventory source(s) (ISO 8601). Absent when it has not been forwarded.
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              buyerReference:
                description: Support reference for this buy (`sf:<storefrontId>:<mediaBuyId>`). Quote it with the request timestamp when contacting the seller or Scope3 support.
                example: sf:42:sf_mb_1783031864469_8pbc8mmr
                type: string
              startTime:
                description: When this media buy starts. Either "asap" (start immediately on activation) or an ISO 8601 date-time. Falls within the parent campaign's flightDates.
                example: '2025-04-14T00:00:00Z'
                type: string
              endTime:
                description: When this media buy ends, as an ISO 8601 date-time. Falls within the parent campaign's flightDates.
                example: '2025-04-30T23:59:59Z'
                type: string
              budget_denomination:
                description: 'Denomination marker: every budget on this media buy is GROSS (fee-inclusive) in the buyer currency. Present only for buys with locked fee terms (it travels with budget_breakdown); absent for legacy buys created before fee terms were locked, whose budgets pass through as stored.'
                type: string
                enum:
                - gross
              budget_breakdown:
                description: Read-only gross/media/fee split of the buy's total budget at the fee terms locked when the media buy was created. Omitted for legacy buys created before fee terms were locked. Buyer surfaces only.
                type: object
                properties:
                  media_budget:
                    description: Media portion of the gross budget (gross minus the buyer fee) at the fee terms locked when the media buy was created, in major units.
                    type: number
                  fee_amount:
                    description: Buyer fee carved from the gross budget at the locked fee rate, in major units.
                    type: number
                  fee_rate_percent:
                    description: The Scope3 fee as a percentage of the media budget (fee ÷ media × 100). For example, a 5% fee on media produces a value of 5 here regardless of how the fee was stored internally.
                    type: number
                  effective_gross_cpm:
                    description: Gross budget ÷ impression goal × 1000 — the CPM that makes "budget ÷ CPM = impressions" hold for the gross numbers the buyer operates on. Null when the buy has no positive impression goal.
                    type:
                    - number
                    - 'null'
                required:
                - media_budget
                - fee_amount
                - fee_rate_percent
                - effective_gross_cpm
                additionalProperties: false
              products:
                description: Products configured for this media buy
                type: array
                items:
                  type: object
                  properties:
                    productId:
                      description: Product identifier
                      type: string
                    productName:
                      description: Human-readable product name. May be absent for products whose `products` cache row has not yet been populated.
                      type: string
                    publisherName:
                      description: Publisher name for this product. May be absent for products whose `products` cache row has not yet been populated.
                      type: string
                    salesAgentName:
                      description: Name of the sales agent for this product
                      type: string
                    budget:
                      description: Budget allocated to this product
                      type: number
                    budgetCurrency:
                      description: Currency for the budget
                      type: string
                    formatOptions:
                      description: Publisher-declared format requirements for this product. Each entry has a stable format_option_id selector when supplied by the seller, a format_kind (e.g. "video_vast", "video_hosted", "image", "html5"), and a params object. For video products, check entries with format_kind "video_vast" or "video_hosted" for params.duration_ms_exact (required duration in ms), params.width and params.height (required pixel dimensions).
                      type: array
                      items:
                        type: object
                        properties:
                          format_kind:
                            type: string
                            enum:
                            - image
                            - html5
                            - display_tag
                            - image_carousel
                            - video_hosted
                            - video_vast
                            - audio_hosted
                            - audio_daast
