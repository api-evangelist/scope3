    RefinementItem:
      description: A single refinement directive (request-scoped or product-scoped)
      oneOf:
      - description: 'Request-scoped refinement: direction for the overall selection'
        type: object
        properties:
          scope:
            description: Applies direction to the overall selection
            type: string
            enum:
            - request
          ask:
            description: Free-text direction for the overall selection, e.g. "more video options and less display"
            type: string
            minLength: 1
        required:
        - scope
        - ask
      - description: 'Product-scoped refinement: target a specific product'
        type: object
        properties:
          scope:
            description: Targets a specific product from a prior auto-select response
            type: string
            enum:
            - product
          id:
            description: Product ID from a prior auto-select response
            type: string
            minLength: 1
          action:
            description: 'include: keep this product; omit: exclude it; moreLikeThis: find similar products'
            type: string
            enum:
            - include
            - omit
            - moreLikeThis
          ask:
            description: Optional direction when action is include or more_like_this
            type: string
            minLength: 1
        required:
        - scope
        - id
        - action
      type: object
    BuyerPackageDelivery:
      description: Delivery recorded against this package. Absent when the package has not delivered or the source has not reported yet.
      type: object
      properties:
        impressions:
          description: Impressions delivered against this package so far.
          type: number
        spend:
          description: Spend against this package so far, in the buy's currency, in GROSS (fee-inclusive) denomination grossed up at the buy's pinned pricing terms, so it compares directly against this package's budget. Net-as-reported for legacy buys with no pinned terms.
          type: number
        clicks:
          description: Clicks recorded against this package, when reported.
          type:
          - number
          - 'null'
      required:
      - impressions
      - spend
      - clicks
      additionalProperties: false
    MediaBuyPendingChange:
      description: A buyer-submitted change that has been accepted by Interchange but has NOT yet taken effect on the delivering buy. Its presence is the signal that this buy has an unapplied change; absence means everything reported is live. Never treat these values as delivering.
      type: object
      properties:
        status:
          description: 'Lifecycle status of the pending change itself, typically PENDING_APPROVAL. This is NOT the status of the buy: the buy keeps its own top-level status, which reflects what is delivering now.'
          example: PENDING_APPROVAL
          type: string
        pendingAt:
          description: Which layer the pending change is parked at. 'storefront' = waiting on the storefront operator's manual approval, 'salesagent' = the inventory source is still processing it, 'unknown' = indeterminate.
          type: string
          enum:
          - storefront
          - salesagent
          - unknown
        reason:
          description: Reason recorded when the change was submitted, when one was supplied.
          example: Extended to 8/11 with W5+W6 gross budget
          type: string
        differences:
          description: Only the fields whose pending value differs from live appear here. An empty object means a pending change exists whose comparable fields already match live.
          type: object
          properties:
            endTime:
              description: Flight end date change (ISO 8601).
              type: object
              properties:
                live:
                  description: The value currently in effect on the delivering buy.
                  type: string
                proposed:
                  description: The value the pending change would set.
                  type: string
              additionalProperties: false
            budget:
              description: Total budget change in the buy's currency, summed across its packages.
              type: object
              properties:
                live:
                  description: The value currently in effect on the delivering buy.
                  type: number
                proposed:
                  description: The value the pending change would set.
                  type: number
              additionalProperties: false
            creatives:
              description: Creative IDs currently attached compared with the proposed attachment set.
              type: object
              properties:
                live:
                  description: The value currently in effect on the delivering buy.
                  type: array
                  items:
                    type: string
                proposed:
                  description: The value the pending change would set.
                  type: array
                  items:
                    type: string
              additionalProperties: false
          additionalProperties: false
      required:
      - status
      - differences
      additionalProperties: false
    TargetingDimensionEntry:
      type: object
      properties:
        code:
          description: String code for this targeting value
          example: '532'
