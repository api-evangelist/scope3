          description: 'Audience targeting and suppression configuration. Use deleteMissing: true to replace the full audience set.'
          type: object
          properties:
            targetAudienceIds:
              description: Audience IDs to target. Can be empty when deleteMissing is true to remove all targeted audiences.
              example:
              - aud_123
              - aud_456
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
            suppressAudienceIds:
              description: Audience IDs to suppress. Can be empty when deleteMissing is true to remove all suppressed audiences.
              example:
              - aud_789
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
            deleteMissing:
              description: When true, audiences NOT in the respective lists are removed. When false or omitted, lists are additive.
              type: boolean
        performanceConfig:
          description: Updated performance configuration. Pass null to clear an existing configuration; this is only valid for a campaign currently in performance mode.
          allOf:
          - $ref: '#/components/schemas/PerformanceConfig'
        optimizationApplyMode:
          description: Controls whether Scope3 AI model optimizations to media buys are applied automatically or require manual approval. If omitted, inherits the advertiser-level setting.
          allOf:
          - $ref: '#/components/schemas/OptimizationApplyMode'
        catalogId:
          description: Catalog ID to attach (or null to detach the current catalog)
          type:
          - integer
          - 'null'
          maximum: 9007199254740991
          minimum: 1
        mediaBuys:
          description: 'Media buy actions. Each entry targets a specific media buy by ID. Use action: "update" (default) to modify, "cancel" to cancel, or "delete" to archive.'
