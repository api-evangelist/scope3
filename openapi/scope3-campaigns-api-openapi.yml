    DataDeliveryOutputArrayInput:
      description: Array of Data Delivery Outputs for one scope (advertiser or campaign). At most one Output per (dataDeliveryType, credentialName) pair — the same data type can ship to multiple credentials by listing one Output per destination.
      maxItems: 20
      type: array
      items:
        $ref: '#/components/schemas/DataDeliveryOutputInput'
    PacingPeriodsOutput:
      description: Defines a pacing schedule for a campaign. Periods represent time windows with varying spend intensity. Gaps between periods are treated as pauses (no spend). Use weight mode for relative intensity (e.g., 2x during holidays) or budget mode for explicit dollar amounts per period.
      type: object
      properties:
        mode:
          description: How period budgets are determined. "weight" uses relative weights to distribute the campaign budget proportionally. "budget" uses explicit dollar amounts per period.
          type: string
          enum:
          - weight
          - budget
        periods:
          description: Ordered list of pacing periods with date ranges and spend intensity
          minItems: 1
          maxItems: 52
          type: array
          items:
            type: object
            properties:
              label:
                description: Human-readable label for this period (e.g. "Memorial Day Heavy-Up")
                type: string
                minLength: 1
                maxLength: 100
              start:
                description: Period start date (YYYY-MM-DD, inclusive)
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
              end:
                description: Period end date (YYYY-MM-DD, inclusive)
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
              weight:
                description: Relative spend weight (1.0 = normal, 2.5 = 150% more, 0 = skip this period). Required when mode is "weight".
                type: number
                minimum: 0
                maximum: 10
              budget:
                description: Absolute budget for this period (0 = skip this period). Required when mode is "budget".
                type: number
                minimum: 0
            required:
            - label
            - start
            - end
            additionalProperties: false
      required:
      - mode
      - periods
      additionalProperties: false
    ApiError:
      description: Structured error object
      type: object
      properties:
        code:
          description: Machine-readable error code
          type: string
        message:
          description: Human-readable error message
          type: string
        field:
          description: Field path associated with the error
          type: string
        details:
          description: Additional error context
          type: object
          additionalProperties: {}
      required:
      - code
      - message
      additionalProperties: false
