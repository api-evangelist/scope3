              description: Channels to target (e.g., ["ctv", "display"])
              type: array
              items:
                type: string
            countries:
              description: 'Deprecated: use geo_countries. Countries to target (ISO 3166-1 alpha-2 codes). Values are normalized into geo_countries on write.'
              deprecated: true
              maxItems: 250
              type: array
              items:
                type: string
                pattern: ^[A-Z]{2}$
          additionalProperties: {}
        storefrontIds:
          description: Storefront IDs the campaign is limited to. When set, every `discover_products` run for this campaign auto-applies this filter — buyers do not need to resend it. Pass the IDs returned by `list_storefronts`. Highly encouraged so the campaign only sources inventory from sellers the buyer has chosen.
          example:
          - 42
          - 57
          maxItems: 50
          type: array
          items:
            type: integer
            maximum: 9007199254740991
            minimum: 1
        discoveryId:
          description: Attach an existing discovery session to the campaign
          example: abc123-def456-ghi789
          type: string
          minLength: 1
        productIds:
          description: Product IDs to pre-select from the discovery session (requires discoveryId)
          example:
          - prod_123
          - prod_456
          type: array
          items:
            type: string
        audienceConfig:
          description: Audience targeting and suppression configuration. On create, listed audiences are attached to the campaign.
          type: object
          properties:
            targetAudienceIds:
              description: Audience IDs to target with this campaign
              example:
              - aud_123
              - aud_456
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
            suppressAudienceIds:
              description: Audience IDs to suppress (exclude) from this campaign
              example:
              - aud_789
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
        performanceConfig:
          description: Performance optimization configuration
          allOf:
          - $ref: '#/components/schemas/PerformanceConfig'
        optimizationApplyMode:
          description: Controls whether Scope3 AI model optimizations to media buys are applied automatically or require manual approval. If omitted, inherits the advertiser-level setting.
          allOf:
          - $ref: '#/components/schemas/OptimizationApplyMode'
        catalogId:
          description: ID of a catalog (from the advertiser catalogs list) to attach to this campaign. Only one catalog may be attached per campaign.
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        pacingPeriods:
          description: Pacing schedule for the campaign. Defines time-based spend periods with varying intensity. In weight mode, budget is distributed proportionally by weighted days. In budget mode, explicit dollar amounts are set per period. Gaps between periods are treated as pauses (no spend). On execution, each product is split into one package per period with proportional budget.
          allOf:
          - $ref: '#/components/schemas/PacingPeriods'
        utmConfig:
          description: UTM (Urchin Tracking Module) parameter configuration for this campaign. Overrides advertiser-level defaults for matching param keys.
          allOf:
          - $ref: '#/components/schemas/CampaignUtmConfig'
        dataDelivery:
          $ref: '#/components/schemas/CampaignDataDeliveryInput'
        frequencyCaps:
          description: Buyer-side frequency cap configs to apply to this campaign. Enforced by Scope3 across all publishers.
          type: array
          items:
            $ref: '#/components/schemas/FrequencyCapConfigInput'
        mode:
          description: '"I have a brief; find it for me" — platform-managed.'
          type: string
          enum:
          - discovery
      required:
      - advertiserId
      - name
      - flightDates
      - budget
      - mode
    DeliveryConfigOutput:
      description: Per-Output destination shape (non-secret). Additional destination types are added as new variants in this discriminated union.
