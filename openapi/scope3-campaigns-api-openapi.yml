                description: Per-media-buy pacing schedule. When set, replaces the campaign-level pacingPeriods for this specific buy. Use to heavy-up or shape spend on one media buy without affecting others. Pass null to clear an existing per-buy schedule. Bootstrapping a schedule onto an unpaced media buy is only allowed in DRAFT or PENDING_APPROVAL status. See the Pacing Periods guide for the full state matrix and sales-agent capability requirements.
