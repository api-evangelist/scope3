    PerformanceConfig:
      description: Configuration for performance campaign optimization
      type: object
      properties:
        optimizationGoals:
          description: Optimization goals for the campaign. Each goal targets either conversion events or seller-native metrics.
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/OptimizationGoal'
      required:
      - optimizationGoals
    MediaBuyPendingReason:
      description: Why a not-yet-delivering media buy is waiting, and implicitly whose side owns the wait. A platform-derived annotation — never a status value. awaiting_storefront_approval / awaiting_source_moderation / creative_processing_at_source / awaiting_creative_approval = the seller side owns the wait; no_creatives_attached / source_rejected_creatives = the buyer owns it (attach or fix creatives); forward_failed_retrying / forward_failed_needs_correction = the platform owns it; accepted_awaiting_trafficking / scheduled_not_started = nothing is wrong, the buy is queued or scheduled.
      type: string
      enum:
      - forward_failed_needs_correction
      - forward_failed_retrying
      - awaiting_storefront_approval
      - awaiting_source_moderation
      - no_creatives_attached
      - source_rejected_creatives
      - creative_processing_at_source
      - awaiting_creative_approval
      - accepted_awaiting_trafficking
      - scheduled_not_started
    ConnectedAccountDirectedCampaignInfo:
      description: Subscription-backed directed campaign mirror state — connection, upstream account, dual-keyed identifiers, and sync health.
      type: object
      properties:
        provenance:
          description: This directed campaign is mirrored from or authored through a connected seller account.
          type: string
          enum:
          - connected_account
        connectionId:
          description: The subscribed provider connection this directed campaign is mirrored from.
          example: conn_abc123
          type: string
          minLength: 1
        accountId:
          description: The connection's upstream account id.
          example: act_998877
          type: string
          minLength: 1
        provider:
          description: Adapter/provider key the connection resolves to, e.g. "tiktok", "pinterest", "talpa".
          example: tiktok
          type: string
          minLength: 1
        storefrontId:
          description: Storefront DB id backing this connection, when the provider is modeled as an AdCP storefront.
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        upstreamMediaBuyId:
          description: The seller's own identifier for the mirrored media buy/campaign — dual-keyed alongside our internal mediaBuyId, per the parity rule (a directed campaign IS a media buy).
          example: tt_campaign_44521
          type: string
          minLength: 1
        mediaBuyId:
          description: Our internal media buy id correlating to the upstream object, once the mirror row exists.
          type: string
        subscribed:
          description: Whether the connected account is actively subscribed for periodic metadata mirroring. Alpha usage is dark-metered and not billed.
          type: boolean
        mirrorState:
          description: live = mirror is current; stale = last sync failed or is overdue; error = the provider reported an error.
          type: string
          enum:
          - live
          - stale
          - error
        lastSyncedAt:
          description: When the mirror was last refreshed from the upstream platform (ISO 8601).
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
      - provenance
      - connectionId
      - accountId
      - provider
      - upstreamMediaBuyId
      - subscribed
      - mirrorState
      additionalProperties: false
    DataDeliveryOutput:
      description: Resolved Data Delivery Output as returned by the API.
      type: object
      properties:
        outputConfigId:
          description: Database identifier for the underlying output config row.
          type: string
        dataDeliveryType:
          type: string
          enum:
          - MB_DELIVERY
          - IMPRESSIONS
          - CLICKS
          - VAST_EVENTS
          - CAPI_ATTRIBUTION
          - MMP_POSTBACKS
        cadence:
          type: string
          enum:
          - HOURLY
          - DAILY
          - WEEKLY
        syncWeeklyDay:
          type: integer
          minimum: 0
          maximum: 6
        enabled:
          type: boolean
        credentialId:
          description: Database identifier of the Data Delivery Credential authenticating this Output.
          type: string
        credentialName:
          description: Name of the Data Delivery Credential authenticating this Output (advertiser-scoped, unique among live credentials).
          type: string
        deliveryConfig:
          $ref: '#/components/schemas/DeliveryConfigOutput'
        source:
          description: Where this Output was configured — "advertiser" for default, "campaign" for an override.
          type: string
          enum:
          - advertiser
          - campaign
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - outputConfigId
      - dataDeliveryType
      - cadence
      - enabled
      - credentialId
      - credentialName
      - deliveryConfig
      - source
      - createdAt
      - updatedAt
      additionalProperties: false
    CreativeReviewStatus:
      description: Lifecycle state of a buyer-submitted creative awaiting storefront review. `pending` until an operator decides; `approved` or `rejected` after a decision; `revoked` if an operator pulls a previously-approved creative.
      type: string
      enum:
      - pending
      - approved
      - rejected
      - revoked
    Duration:
      description: A duration expressed as an interval and unit
      type: object
      properties:
        interval:
          type: integer
          maximum: 9007199254740991
          minimum: 1
        unit:
          type: string
          enum:
          - minutes
          - hours
          - days
          - campaign
      required:
      - interval
      - unit
    UpdateMediaBuyProductInput:
      description: 'Product update — additive (existing products not listed are preserved). Use remove: true to delete a product. Does not add brand-new product selections; use create_media_buys for that.'
      type: object
      properties:
        productId:
          description: Product ID (must already be on this media buy)
          type: string
          minLength: 1
        pricingOptionId:
          description: The replacement pricing option must resolve to this media buy's existing settlement currency — update_media_buy does not re-split a buy across sales agents or currencies.
          type: string
        budget:
          type: number
          exclusiveMinimum: 0
        pacing:
          type: string
          enum:
          - even
          - asap
          - front_loaded
        bidPrice:
          description: Updated bid price (CPM). Pass null to clear.
          type:
          - number
          - 'null'
        remove:
          description: Set to true to remove this product from the media buy
          type: boolean
        pageId:
          description: Platform-specific page identity for ad placements. Required for Meta products when the connected ad account has more than one authorized Facebook Page — pass one of the page IDs listed in the error message. Omit when the account has exactly one authorized page.
          example: '1147910135081908'
          type: string
          minLength: 1
        pixelId:
          description: 'Meta Pixel / Dataset ID for conversion tracking. Required for Meta Sales (OUTCOME_SALES) products — pass the pixel ID listed in the error message. There is no auto-select: every Meta Sales buy must explicitly specify a pixel.'
          example: '123456789012345'
          type: string
          minLength: 1
      required:
      - productId
      additionalProperties: false
    CampaignUtmConfig:
      description: UTM configuration for a campaign. Overrides advertiser-level defaults for matching param keys.
      type: object
      properties:
        params:
          description: Array of UTM parameter mappings for this campaign
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              paramKey:
                description: Output query parameter key appended to landing URL (e.g., "utm_source", "bg_campaign")
                example: utm_campaign
                type: string
                pattern: ^[a-zA-Z0-9_-]{1,100}$
              paramValue:
                description: Macro name (e.g., "{CAMPAIGN_ID}") or static string (e.g., "scope3") to resolve as the value
                example: '{CAMPAIGN_ID}'
                type: string
                minLength: 1
                maxLength: 200
            required:
            - paramKey
            - paramValue
        deleteMissing:
          description: If true, remove campaign-level UTM params not in this request (replace mode). If false/omitted, only add/update (additive mode).
          type: boolean
      required:
      - params
    FrequencyCapTargetLevel:
      description: Level of the entity the frequency cap applies to
      type: string
      enum:
      - ADVERTISER
      - CAMPAIGN
      - CREATIVE
    CampaignStorefrontRef:
      description: A storefront the campaign is pinned to, hydrated from the storefront IDs the buyer set on create/update.
      type: object
      properties:
        id:
          description: Storefront DB ID
          example: 42
          type: integer
          maximum: 9007199254740991
          minimum: 1
        platformId:
          description: Public-facing storefront slug (the platform identifier returned by `list_storefronts`)
          example: acme-media
          type: string
        name:
          description: Storefront display name
          example: Acme Media
          type: string
      required:
