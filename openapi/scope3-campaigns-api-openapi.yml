                - 'null'
              internal_status:
                type: string
              adcp_status:
                type:
                - string
                - 'null'
              operational_status:
                type: string
                enum:
                - not_submitted
                - pending_creatives
                - pending_start
                - active
                - paused
                - completed
                - attention_required
              previous_internal_status:
                type: string
              previous_adcp_status:
                type:
                - string
                - 'null'
              updated:
                type: boolean
              status_refresh_source:
                type: string
                enum:
                - direct_agent
                - delegated_adapter
                - storefront_route_rollup
                - not_submitted
                - persisted_terminal
                - refresh_failed
              blockers:
                type: array
                items:
                  type: string
              pending_reason:
                description: Why the buy is not delivering yet, rolled up to the most-blocking wait across its source legs. An annotation derived from forwarding state — never a status.
                allOf:
                - $ref: '#/components/schemas/MediaBuyPendingReason'
              pending_since:
                description: When the current wait began (ISO 8601), when known.
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              error_code:
                description: Buyer-safe structured error code when forwarding failed or the buy was rejected.
                allOf:
                - $ref: '#/components/schemas/BuyerMediaBuyErrorCode'
              error_owner:
                description: Which party owns fixing the error (buyer_input | platform | seller).
                allOf:
                - $ref: '#/components/schemas/MediaBuyErrorOwner'
              source_message:
                description: The source's sanitized rejection or moderation message, when provided.
                type: string
              forwarded_at:
                description: When the buy was forwarded to its inventory source(s) (ISO 8601).
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              buyer_reference:
                description: Support reference for this buy (sf:<storefrontId>:<mediaBuyId>). Quote it with the request timestamp when contacting the seller or Scope3 support.
                type: string
