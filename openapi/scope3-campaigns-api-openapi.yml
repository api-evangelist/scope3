    PacingPeriods:
      description: Defines a pacing schedule for a campaign. Periods represent time windows with varying spend intensity. Gaps between periods are treated as pauses (no spend). Use weight mode for relative intensity (e.g., 2x during holidays) or budget mode for explicit dollar amounts per period.
      type: object
      properties:
        mode:
          description: How period budgets are determined. "weight" uses relative weights to distribute the campaign budget proportionally. "budget" uses explicit dollar amounts per period.
          type: string
          enum:
          - weight
          - budget
        periods:
          description: Ordered list of pacing periods with date ranges and spend intensity
          minItems: 1
          maxItems: 52
          type: array
          items:
            type: object
            properties:
              label:
                description: Human-readable label for this period (e.g. "Memorial Day Heavy-Up")
                type: string
                minLength: 1
                maxLength: 100
              start:
                description: Period start date (YYYY-MM-DD, inclusive)
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
              end:
                description: Period end date (YYYY-MM-DD, inclusive)
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
              weight:
                description: Relative spend weight (1.0 = normal, 2.5 = 150% more, 0 = skip this period). Required when mode is "weight".
                type: number
                minimum: 0
                maximum: 10
              budget:
                description: Absolute budget for this period (0 = skip this period). Required when mode is "budget".
                type: number
                minimum: 0
            required:
            - label
            - start
            - end
      required:
      - mode
      - periods
    EventGoal:
      description: Optimize for advertiser-tracked conversion events via event sources.
      type: object
      properties:
        kind:
          type: string
          enum:
          - event
        eventSources:
          description: Event source and type pairs feeding this goal. Seller deduplicates by event_id across entries.
          minItems: 1
          type: array
          items:
            type: object
            properties:
              eventSourceId:
                description: Event source to include (must be configured via sync_event_sources)
                example: website_pixel
                type: string
                minLength: 1
              eventType:
                description: IAB ECAPI event type to optimize for
                type: string
                enum:
                - page_view
                - view_content
                - select_content
                - select_item
                - search
                - share
                - add_to_cart
                - remove_from_cart
                - viewed_cart
                - add_to_wishlist
                - initiate_checkout
                - add_payment_info
                - purchase
                - refund
                - lead
                - qualify_lead
                - close_convert_lead
                - disqualify_lead
                - complete_registration
                - subscribe
                - follow
                - content_view
                - watch_milestone
                - start_trial
                - app_install
                - app_launch
                - contact
                - schedule
                - donate
                - submit_application
                - custom
              customEventName:
                description: Required when eventType is 'custom'. Platform-specific custom event name.
                type: string
              valueField:
                description: Field on custom_data carrying the monetary value. Required when target is 'per_ad_spend'.
                example: value
                type: string
              valueFactor:
                description: Multiplier for valueField (default 1). Use -1 for refunds, 0.01 for cents.
                example: 1
                type: number
            required:
            - eventSourceId
            - eventType
        target:
          description: Target cost or return. When omitted, the seller maximizes conversions within budget.
          oneOf:
          - type: object
            properties:
              kind:
                type: string
                enum:
                - cost_per
              value:
                description: Target cost per unit in buy currency
                example: 25
                type: number
                exclusiveMinimum: 0
            required:
            - kind
            - value
          - type: object
            properties:
              kind:
                type: string
                enum:
                - per_ad_spend
              value:
                description: Target return ratio (e.g. 4.0 = $4 of value per $1 spent)
                example: 4
                type: number
                exclusiveMinimum: 0
            required:
            - kind
            - value
          - type: object
            properties:
              kind:
                type: string
                enum:
                - maximize_value
            required:
            - kind
          type: object
        attributionWindow:
          description: Attribution window for this goal. When omitted, the seller uses their default.
          allOf:
          - $ref: '#/components/schemas/OptimizationAttributionWindow'
        priority:
          description: Priority among goals on this package. 1 = highest. When omitted, sellers use array position.
          example: 1
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - kind
      - eventSources
