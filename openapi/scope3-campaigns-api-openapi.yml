    DataDeliveryOutputInput:
      description: A single Data Delivery Output entry. Used inline on advertiser/campaign create+update.
      type: object
      properties:
        dataDeliveryType:
          description: The kind of LLD shipped by this Output.
          type: string
          enum:
          - MB_DELIVERY
          - IMPRESSIONS
          - CLICKS
          - VAST_EVENTS
          - CAPI_ATTRIBUTION
          - MMP_POSTBACKS
        cadence:
          description: Firing rate. HOURLY fires at minute 0 every hour, DAILY at 00:00 UTC, WEEKLY at 00:00 UTC on syncWeeklyDay.
          type: string
          enum:
          - HOURLY
          - DAILY
          - WEEKLY
        syncWeeklyDay:
          description: Day of week for WEEKLY cadence (0=Sunday..6=Saturday). Required when cadence=WEEKLY, ignored otherwise.
          type: integer
          minimum: 0
          maximum: 6
        enabled:
          description: When false, the Temporal schedule is paused — no new runs fire, in-flight runs continue. Defaults to true.
          default: true
          type: boolean
        credentialName:
          description: Name of the Data Delivery Credential (within the same advertiser) that authenticates this Output. The credential carries the auth target (e.g., GCS bucket) and is Probe-validated. Must reference a credential whose destinationType matches deliveryConfig.type.
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        deliveryConfig:
          $ref: '#/components/schemas/DeliveryConfig'
      required:
      - dataDeliveryType
      - cadence
      - credentialName
      - deliveryConfig
    CampaignManagement:
      description: 'Whether the platform acts on this campaign. "tracked" = a campaign the platform did not set up, mirrored from a connected seller account: the shell is derived from the buys underneath, read-only, and updates automatically as the seller changes things. "managed" = a campaign authored or adopted through the platform (get_products → create_media_buy → update_media_buy) — the platform sends instructions down. In both states the execution system remains the source of truth.'
      type: string
      enum:
      - tracked
      - managed
    BuyerMediaBuyResponse:
      description: Response containing a single media buy with why-visibility
      type: object
      properties:
        mediaBuy:
          $ref: '#/components/schemas/BuyerMediaBuy'
      required:
      - mediaBuy
      additionalProperties: false
    UpdateMediaBuyPackageInput:
      description: Per-package update for a media buy with deployed packages
      type: object
      properties:
        packageId:
          description: Package ID to update
          type: string
          minLength: 1
        budget:
          description: Updated budget amount
          type: number
          exclusiveMinimum: 0
        pacing:
          description: Updated pacing strategy
          type: string
          enum:
          - even
          - asap
          - front_loaded
        bidPrice:
          description: Updated bid price (CPM). Pass null to clear.
          type:
          - number
          - 'null'
        startTime:
          description: Updated flight start date/time for this package (ISO 8601). Must fall within the media buy's date range.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        endTime:
          description: Updated flight end date/time for this package (ISO 8601). Must fall within the media buy's date range.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        targetingOverlay:
          description: Governed audience IDs to merge into the existing package targeting overlay.
          type: object
          properties:
            audience_include:
              type: array
              items:
                type: string
            audience_exclude:
              type: array
              items:
                type: string
          additionalProperties: false
      required:
      - packageId
      additionalProperties: false
    PackagePacingPeriod:
      description: 'Which pacing period a package was cut for. This is what the numeric suffix on a storefront-minted package id refers to: package ids are assigned in product-then-period order at dispatch, so the suffix is a position, not a meaning. Read this field rather than parsing the id. Absent when the media buy is not paced, and on packages created before period identity was recorded.'
      type: object
      properties:
        index:
          description: One-based ordinal of the pacing period this package was cut for, counting from the first period on the campaign.
          example: 6
          type: integer
          maximum: 9007199254740991
          minimum: 1
        label:
          description: The period label as named on the campaign, when the campaign named it.
          example: Week 6
          type: string
      required:
      - index
      additionalProperties: false
    MediaBuyRefPendingChange:
      description: Present when this buy has a submitted change that has not yet reached the delivering buy. Call `get_media_buy` for the field-level differences; this reference stays lightweight by design.
      type: object
      properties:
        status:
          description: Lifecycle status of the queued change, typically PENDING_APPROVAL.
          example: PENDING_APPROVAL
          type: string
        pendingAt:
          description: Which layer the queued change is parked at.
          type: string
          enum:
          - storefront
          - salesagent
          - unknown
      required:
      - status
      additionalProperties: false
    PerformanceConfigOutput:
      description: Configuration for performance campaign optimization
      type: object
      properties:
        optimizationGoals:
          description: Optimization goals for the campaign. Each goal targets either conversion events or seller-native metrics.
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/OptimizationGoalOutput'
      required:
      - optimizationGoals
      additionalProperties: false
    CampaignGeoMetroNames:
      description: Display labels for metro codes. Returned only when requested with fields=geo_metro_names; labels are derived from the local geo-metro label table and are not accepted on create/update.
      type: array
      items:
        type: object
        properties:
          system:
            description: Metro targeting system these display labels belong to, e.g. nielsen_dma.
            type: string
            minLength: 1
          values:
            maxItems: 250
            type: array
            items:
              type: object
              properties:
                code:
                  description: Metro code from the corresponding metro targeting field.
                  type: string
                  minLength: 1
                name:
                  description: Human-readable display label for the metro code.
                  type: string
                  minLength: 1
              required:
              - code
              - name
              additionalProperties: false
        required:
        - system
        - values
        additionalProperties: false
    CampaignProductEntry:
      description: A product staged on a campaign with discovery and execution context
      type: object
      properties:
        productId:
          description: Unique product identifier
          type: string
        productName:
          description: Human-readable product name
          type: string
        salesAgentId:
          description: Sales agent ID that supplied this product
          type: string
        salesAgentName:
          description: Sales agent display name (from the local `adcp_agent` row)
          type: string
        publisherDomain:
          description: Publisher domain for this product
          type: string
        publisherName:
          description: Publisher display name
          type: string
        bidPrice:
          description: Bid price set on the product
          type: number
        budget:
          description: Budget allocated to this product
          type: number
        pricingOptionId:
          description: Selected pricing option ID for the product
          type: string
        pricingModel:
          description: Pricing model (e.g. CPM, fixed)
          type: string
        selectedAt:
          description: When this product was selected (ISO 8601)
          type: string
        searchContext:
          description: Discovery run (search context) that surfaced this product
          type: object
          properties:
            id:
              type: string
            brief:
              type: string
          required:
          - id
          - brief
          additionalProperties: false
        mediaBuys:
          description: Media buys this product is attached to, including the complete package IDs for each buy (empty if the product has not been executed; can contain multiple entries on multi-strategy campaigns)
          type: array
          items:
            type: object
            properties:
              mediaBuyId:
                type: string
              status:
                type: string
              name:
                type: string
              packageIds:
                description: Complete package IDs for this product on this media buy. Use these IDs for mediaBuys[].packages[] updates.
                type: array
                items:
                  type: string
            required:
            - mediaBuyId
            - status
            - name
            - packageIds
            additionalProperties: false
      required:
      - productId
      - salesAgentId
      - selectedAt
      - mediaBuys
      additionalProperties: false
    CampaignResponse:
      description: Response containing a single campaign
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        warnings:
          description: Non-blocking advisories about the campaign. On create, includes a soft credit-limit warning when the budget already exceeds the org’s available Scope3 credit (the campaign is still created; the hard 402 gate fires at execute).
          type: array
          items:
            type: string
      required:
      - campaign
      additionalProperties: false
    CreateCampaignOpenApiBody:
      oneOf:
      - $ref: '#/components/schemas/CreateDiscoveryCampaignBody'
      - $ref: '#/components/schemas/CreatePerformanceCampaignBody'
      type: object
      discriminator:
        propertyName: mode
        mapping:
          discovery: '#/components/schemas/CreateDiscoveryCampaignBody'
          performance: '#/components/schemas/CreatePerformanceCampaignBody'
    RefreshDirectedCampaignBody:
      description: Request body for refreshing a directed campaign mirror without an upstream mutation.
      type: object
      properties:
        mode:
          type: string
          enum:
          - directed
        refresh:
          description: Trigger a mirror refresh against the upstream seller without writing to it.
          type: boolean
          enum:
          - true
      required:
      - mode
      - refresh
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key or access token
