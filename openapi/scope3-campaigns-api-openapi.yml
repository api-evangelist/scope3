    BuyerMediaBuy:
      description: A single media buy with its optimization goals and why-visibility annotation (pendingReason, errorCode, forwardedAt, buyerReference). Use get_campaign for packages, products, and delivery.
      type: object
      properties:
        mediaBuyId:
          description: Buyer media buy ID
          example: mb_ETBn4gJ9Wu
          type: string
        name:
          description: Media buy name
          type: string
        status:
          description: Interchange media buy status (DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, COMPLETED, CANCELED, FAILED, REJECTED).
          example: PENDING_APPROVAL
          type: string
        pendingAt:
          description: Which layer the buy is parked at; only present while status is PENDING_APPROVAL. Use pendingReason for the specific wait.
          type: string
          enum:
          - storefront
          - salesagent
          - unknown
        pendingChange:
          description: A submitted change that has not yet reached the delivering buy. Every other field on this object describes what is LIVE, so this is the only place a queued change surfaces. Absent when there is nothing pending.
          allOf:
          - $ref: '#/components/schemas/MediaBuyPendingChange'
        pendingReason:
          description: Why the buy is not delivering yet, rolled up to the most-blocking wait across its legs. An annotation derived from persisted forwarding state — never a status. Absent when the buy is delivering, terminal, or not storefront-routed.
          allOf:
          - $ref: '#/components/schemas/MediaBuyPendingReason'
        pendingSince:
          description: When the current wait began (ISO 8601). Present when pendingReason is set and the start of the wait is known.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        errorCode:
          description: Buyer-safe structured error code when forwarding failed or the buy was rejected. Internal platform codes are mapped to this set and never emitted raw.
          allOf:
          - $ref: '#/components/schemas/BuyerMediaBuyErrorCode'
        errorOwner:
          description: Which party owns fixing the error. Present whenever errorCode is present.
          allOf:
          - $ref: '#/components/schemas/MediaBuyErrorOwner'
