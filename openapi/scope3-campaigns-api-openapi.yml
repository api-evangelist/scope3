          items:
            $ref: '#/components/schemas/MediaBuyRef'
        brief:
          description: Campaign brief
          type: string
        flightDates:
          description: Campaign flight dates
          type: object
          properties:
            startDate:
              description: Campaign start date (ISO 8601)
              example: '2025-01-15T00:00:00Z'
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            endDate:
              description: Campaign end date (ISO 8601)
              example: '2025-03-31T23:59:59Z'
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          required:
          - startDate
          - endDate
          additionalProperties: false
        budget:
          description: Campaign budget configuration
          type: object
          properties:
            total:
              type: number
              exclusiveMinimum: 0
            currency:
              default: USD
              type: string
              minLength: 3
              maxLength: 3
            dailyCap:
              type: number
              exclusiveMinimum: 0
            pacing:
              type: string
              enum:
              - EVEN
              - ASAP
              - FRONTLOADED
          required:
          - total
          - currency
          additionalProperties: false
        allocatedBudget:
          description: Sum of active media buy budgets (plus performance spend on archived media buys) on this campaign. Only present when the campaign has a budget.total set. Expressed in the campaign budget currency.
          example: 7500
          type: number
          minimum: 0
        unallocatedBudget:
          description: Media budget remaining for new media buys, computed as the media portion of budget.total (after the Scope3 fee) minus allocatedBudget. Only present when the campaign has a budget.total set. Expressed in the campaign budget currency. May be negative if archived performance spend exceeds the media budget.
          example: 2500
          type: number
        pacingPeriods:
          description: Pacing schedule for the campaign, if configured. In responses, each period includes a resolved budget (computed dollar amount). In weight mode, weights are preserved alongside the resolved budget.
