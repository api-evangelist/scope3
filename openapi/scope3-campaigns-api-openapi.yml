        pacingPeriods:
          description: Pacing schedule for the campaign. Set to null to remove pacing periods and revert to standard single-period behavior. Can only be modified on DRAFT campaigns.
          allOf:
          - $ref: '#/components/schemas/PacingPeriods'
        utmConfig:
          description: 'UTM (Urchin Tracking Module) parameter configuration for this campaign. Use deleteMissing: true to replace; otherwise additive.'
          allOf:
          - $ref: '#/components/schemas/CampaignUtmConfig'
        dataDelivery:
          description: Campaign-scoped data-delivery configuration. Groups Data Delivery Outputs that override advertiser-scoped delivery for the same `dataDeliveryType`. Omit to leave existing config untouched.
          type: object
          properties:
            outputs:
              description: Campaign-scoped Data Delivery Outputs. Override advertiser-scoped Outputs by `dataDeliveryType`. Replaces all existing campaign-scoped Outputs when provided. Pass an empty array to clear. Omit to leave existing Outputs untouched.
              allOf:
              - $ref: '#/components/schemas/DataDeliveryOutputArrayInput'
        frequencyCaps:
          description: Buyer-side frequency cap configs for this campaign. When provided, replaces all existing non-archived caps for this campaign (pass an empty array to clear). Omit to leave existing caps untouched.
          type: array
          items:
            $ref: '#/components/schemas/FrequencyCapConfigInput'
        mode:
          not: {}
    UpdateCampaignOpenApiBody:
      anyOf:
      - $ref: '#/components/schemas/UpdateLegacyCampaignBody'
      - $ref: '#/components/schemas/UpdateDiscoveryCampaignBody'
      - $ref: '#/components/schemas/UpdatePerformanceCampaignBody'
      - $ref: '#/components/schemas/RefreshDirectedCampaignBody'
    ResolveTargetingDimensionResponse:
      description: Resolution candidates for localized targeting text within a dimension.
      type: object
      properties:
        system:
          $ref: '#/components/schemas/TargetingDimensionSystem'
        locale:
          description: Locale used for the resolution
          example: en-US
          type: string
          enum:
          - en-US
        query:
          description: Original query text
          example: LA DMA
          type: string
        candidates:
          description: Candidate targeting codes ordered by descending confidence. Empty when no dictionary entry matches.
          type: array
          items:
            $ref: '#/components/schemas/TargetingDimensionResolveCandidate'
        ambiguous:
          description: True when the top candidates are close enough that the caller should ask for clarification.
          example: false
          type: boolean
      required:
      - system
      - locale
      - query
      - candidates
      - ambiguous
      additionalProperties: false
    CampaignCascadeResponse:
      description: Campaign cascade operation outcome, including the status change result for each media buy
      type: object
      properties:
        campaignId:
          description: Campaign ID
          example: cmp_987654321
          type: string
        campaignName:
          description: Campaign name
          type: string
        previousStatus:
          description: Previous campaign status
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - COMPLETED
          - CANCELED
          - ARCHIVED
        newStatus:
          description: New campaign status
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - COMPLETED
          - CANCELED
          - ARCHIVED
        mediaBuyResults:
          description: Per-media-buy cascade outcomes
          type: array
          items:
            $ref: '#/components/schemas/MediaBuyCascadeResult'
        totalMediaBuys:
          description: Total number of media buys the cascade attempted
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        successCount:
          description: Number of media buys updated successfully
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        failureCount:
          description: Number of media buys that failed to update
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
      - campaignId
      - campaignName
      - previousStatus
      - newStatus
      - mediaBuyResults
      - totalMediaBuys
      - successCount
      - failureCount
      additionalProperties: false
    MediaBuyStatusChangeResponse:
      description: Response from pausing or reactivating a single media buy. Only this media buy is affected — its campaign is never cascaded.
      type: object
      properties:
        mediaBuyId:
          description: The media buy ID
          type: string
        name:
          description: The media buy name
          type: string
        previousStatus:
          description: Status of the media buy before the status change
          type: string
        newStatus:
          description: Status of the media buy after the status change
          type: string
        success:
          description: Whether the media buy status change succeeded
          type: boolean
        error:
          description: Error message when the media buy status change failed
          type: string
      required:
      - mediaBuyId
      - name
      - previousStatus
      - newStatus
      - success
      additionalProperties: false
    FrequencyCapConfigInput:
      description: Frequency cap entry supplied inside a parent advertiser/campaign/creative request body. On PUT, the full array replaces all existing caps for that target.
      type: object
      properties:
        max_impressions:
          description: Maximum number of impressions allowed within the window
          example: 3
          type: integer
          maximum: 9007199254740991
          minimum: 1
        window:
          $ref: '#/components/schemas/FrequencyCapWindow'
      required:
      - max_impressions
      - window
      additionalProperties: {}
    Campaign:
      description: Campaign resource representation
      type: object
      properties:
        campaignId:
          description: Unique identifier for the campaign
          example: cmp_987654321
          type: string
        advertiserId:
          description: Advertiser ID that owns this campaign
          example: '12345'
          type: string
        name:
          description: Campaign name
          example: Summer 2025 Campaign
          type: string
        status:
          description: Current campaign status
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - COMPLETED
          - CANCELED
          - ARCHIVED
        mode:
          description: 'Who is steering this campaign — discovery, performance, or directed. Backfilled by projection for existing campaigns (see deriveCampaignMode); no data movement. The "directed" value is deprecated: read `management` instead.'
          allOf:
          - $ref: '#/components/schemas/CampaignMode'
        management:
          description: 'Whether the platform acts on this campaign: "tracked" (a campaign the platform did not set up, mirrored read-only from a connected seller account) or "managed" (authored or adopted through the platform).'
          allOf:
          - $ref: '#/components/schemas/CampaignManagement'
        directed:
          description: Subscription-backed directed mirror state — connection, upstream account, dual-keyed ids, and sync health. Not present on inbound single-storefront AdCP campaigns.
          allOf:
          - $ref: '#/components/schemas/DirectedCampaignInfo'
        mediaBuyRefs:
          description: Lightweight references to every media buy on this campaign (id + status). Surfaced early in the response so LLM callers can enumerate media buy IDs even when the full nested `mediaBuys[]` tail is truncated by a small context window. Use the `mediaBuyId` query param on `get_campaign` to drill into specific buys without loading the full tree.
