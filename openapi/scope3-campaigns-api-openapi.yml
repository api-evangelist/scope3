                description: '"asap" or ISO 8601 date-time. Start of this media buy. Cannot be earlier than the campaign''s flightDates.startDate. Media buy dates MAY correspond to a pacingPeriods[].start when the media buy represents a specific period, but pacing periods do not govern media buy dates — a media buy can have any start within the campaign flight, with or without pacing periods.'
