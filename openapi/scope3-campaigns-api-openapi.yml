            - adcp_media_buy_id
            - internal_status
            - adcp_status
            - operational_status
            - previous_internal_status
            - previous_adcp_status
            - updated
            - status_refresh_source
            - blockers
            additionalProperties: false
        agents_queried:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        errors:
          type: array
          items:
            type: object
            properties:
              media_buy_id:
                type: string
              error:
                type: string
              code:
