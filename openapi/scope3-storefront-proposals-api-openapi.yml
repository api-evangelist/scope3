    StorefrontProposalOperatorReference:
      description: Resolvable buyer identity for a storefront proposal. Prefer { domain } for brand-backed buyers; use { customerId } only as an unbranded fallback.
      anyOf:
      - type: object
        properties:
          domain:
            description: Buyer brand domain. The buyer must resolve to this brand domain when redeeming the proposal code.
            example: acme.com
            type: string
            minLength: 1
            maxLength: 255
        required:
        - domain
      - type: object
        properties:
          customerId:
            description: Buyer customer id fallback used only when the buyer does not have an advertiser brand domain.
            example: 123
            type: integer
            maximum: 9007199254740991
            minimum: 1
        required:
        - customerId
    ProposalSnapshot:
      description: Frozen products + proposals captured from the discovery session at compose time
      type: object
      properties:
        products:
          description: All products that were available in the discovery session
          type: array
          items:
            $ref: '#/components/schemas/Product'
        proposals:
          description: All proposals from the discovery session (including the chosen one)
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
      required:
      - products
      - proposals
      additionalProperties: false
