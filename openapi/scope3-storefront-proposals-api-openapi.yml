      required:
      - data
      - error
      additionalProperties: false
    Product:
      description: Product resource for campaign inventory
      type: object
      properties:
        productId:
          description: Unique identifier for the product
          example: prod_123
          type: string
        name:
          description: Product name
          example: Premium CTV Inventory - Sports
          type: string
        channel:
          description: First canonical AdCP media channel. Use channels for the complete set.
          example: ctv
          type: string
        channels:
          description: Canonical AdCP media channels declared by the product
          example:
          - streaming_audio
          - podcast
          type: array
          items:
            type: string
        inventoryType:
          description: Inventory classification such as premium or run_of_site; not a media channel
          example: run_of_site
          type: string
        formatTypes:
          description: Canonical AdCP format kinds derived from formatOptions (never legacy named-format IDs)
          example:
          - video_hosted
          type: array
          items:
            type: string
        cpm:
          description: Cost per mille (CPM)
          example: 12.5
          type: number
        currency:
          description: ISO currency code for `cpm` (e.g. "USD", "ZAR")
          example: USD
          type: string
        expiresAt:
          description: When this product's pricing stops being valid (ISO 8601). Present only when the seller quoted an FX-converted price (a rate-of-the-day conversion into a currency the product is not natively priced in); absent for natively-priced products, which carry no expiry and cache freely. A cached product past this timestamp MUST be treated as stale — re-discover or re-quote rather than transacting on the expired price. Selecting or booking against an expired quote gets a fresh price, not the stale one.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        pricingScope:
          description: Whether this product's pricing is the seller's public rate card ('public') or reflects a buyer-specific discount/rate ('account'). Absent is equivalent to 'public' (a pre-3.1 seller, or a source that has never applied account-specific pricing). A buyer's agent should treat 'public' items as portable across a shared/anonymous cache and 'account' items as private to this account — never re-serve an account-scoped price to another account or a public cache partition.
          type: string
          enum:
          - public
          - account
        salesAgentId:
          description: Sales agent ID
          type: string
        salesAgentName:
          description: Sales agent name
          type: string
        storefrontId:
          description: Storefront ID — the storefront this product was discovered through. A single sales agent may back sources across multiple storefronts; products are stamped per (storefront, agent) pairing so the same product can appear in multiple storefronts independently.
          type: string
        storefrontName:
          description: Storefront display name
          type: string
        supportedRoutingTypes:
          deprecated: true
          description: Deprecated v2 compatibility field. It is not a storefront type or product capability and must not affect eligibility or execution.
          type: array
          items:
            type: string
            enum:
            - DECISIONED
            - ROUTED
        description:
          description: Product description
          type: string
        deliveryType:
          description: Delivery type — guaranteed means fixed delivery commitment
          example: guaranteed
          type: string
          enum:
          - guaranteed
          - non_guaranteed
        briefRelevance:
          description: AI-generated explanation of why this product matches the campaign brief
          type: string
        productCard:
          description: Standard visual card (300x400px) for UI rendering
          allOf:
          - $ref: '#/components/schemas/ProductCardData'
        productCardDetailed:
          description: Detailed card with carousel and full specifications
          allOf:
          - $ref: '#/components/schemas/ProductCardDetailedData'
        pricingOptions:
          description: Full pricing options from the sales agent
          type: array
          items:
            $ref: '#/components/schemas/PricingOptionData'
        estimatedExposures:
          description: Estimated impressions for guaranteed products
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        forecast:
          description: Structured delivery forecast with budget points and metric ranges (ADCP 3.15+)
          type: object
          additionalProperties: {}
        bookability:
          description: Sanitized Sales Agent cached pricing/availability guidance for whether the product is bookable.
          type: string
        publisherProperties:
          description: Publisher properties from ADCP (domains, property types, etc.)
          type: array
          items:
            type: object
            properties:
              publisherDomain:
                type: string
              propertyType:
                type: string
              name:
                type: string
              selectionType:
                type: string
              identifiers:
                type: array
                items:
                  type: object
                  additionalProperties: {}
            additionalProperties: false
        isSandbox:
          description: Whether this product was discovered in sandbox mode
          type: boolean
        formatOptions:
          description: AdCP 3.1 format declarations for this product. Each entry carries a format_kind discriminator, optional format_option_id (stable identifier buyers use to select a specific format via format_option_refs in create_media_buy), and canonical params. For hosted-video formats (format_kind "video_hosted"), params.containers / params.video_codecs / params.audio_codecs advertise the accepted delivery containers and codecs, so a buyer can avoid sending a creative that would be rejected downstream. Present only when the sales agent publishes v2 format declarations alongside legacy format_ids.
          type: array
          items:
            $ref: '#/components/schemas/ProductFormatOption'
      required:
      - productId
      - name
      additionalProperties: false
    ProductFormatOption:
      description: AdCP 3.1 format declaration for a product
      type: object
      properties:
        format_kind:
          description: AdCP format kind discriminator (e.g. video_hosted, image)
          example: video_hosted
          type: string
        format_option_id:
          description: Stable identifier buyers use to select this format via format_option_refs in create_media_buy
          type: string
        display_name:
          description: Human-readable name for this format option
          type: string
        params:
          description: Canonical params for this format option
          allOf:
          - $ref: '#/components/schemas/ProductFormatOptionParams'
      additionalProperties: {}
    ApiError:
      description: Structured error object
      type: object
      properties:
        code:
          description: Machine-readable error code
          type: string
        message:
          description: Human-readable error message
          type: string
        field:
          description: Field path associated with the error
          type: string
        details:
          description: Additional error context
          type: object
          additionalProperties: {}
      required:
      - code
      - message
      additionalProperties: false
    CreateStorefrontProposalBody:
      description: Request body for creating a storefront proposal
      type: object
      properties:
        operatorId:
          description: 'Buyer identity for the proposal. Prefer { "domain": "brand.example" }. Legacy string values are accepted as domain strings, except customer:<id> which is decoded as { customerId }.'
          example:
            domain: acme.com
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - $ref: '#/components/schemas/StorefrontProposalOperatorReference'
        label:
          description: Seller's internal label for the proposal
          example: Acme Q3 RFP — CTV
          type: string
          minLength: 1
          maxLength: 255
        notes:
          description: Free-form notes about the offline RFP
          type: string
          maxLength: 4000
        expiresAt:
          description: When the proposal code expires (ISO 8601). Server enforces this is no later than the underlying proposal.expiresAt.
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        discoveryId:
          description: Discovery session id from a recent discover-products call. The server reads the cached snapshot for this session and persists it as the frozen offer. The session must have been scoped to this seller and restricted to its storefront sales agents.
          example: disc_a1b2c3
          type: string
          minLength: 1
          maxLength: 255
        proposalId:
          description: Which proposal from the discovery snapshot to save with the proposal code.
          example: proposal_abc123
          type: string
          minLength: 1
          maxLength: 255
      required:
      - operatorId
      - label
      - expiresAt
      - discoveryId
      - proposalId
    StorefrontProposalOperatorReferenceOutput:
      description: Resolvable buyer identity for a storefront proposal. Prefer { domain } for brand-backed buyers; use { customerId } only as an unbranded fallback.
      anyOf:
      - type: object
        properties:
          domain:
            description: Buyer brand domain. The buyer must resolve to this brand domain when redeeming the proposal code.
            example: acme.com
            type: string
            minLength: 1
            maxLength: 255
        required:
        - domain
        additionalProperties: false
      - type: object
        properties:
          customerId:
            description: Buyer customer id fallback used only when the buyer does not have an advertiser brand domain.
            example: 123
            type: integer
            maximum: 9007199254740991
            minimum: 1
        required:
        - customerId
        additionalProperties: false
