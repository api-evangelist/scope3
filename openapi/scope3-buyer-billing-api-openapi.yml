          - APPLY_FOR_CREDIT
          - RESOLVE_HOLD
          - UPDATE_PAYMENT_METHOD
          - NONE
        message:
          description: Human sentence describing the action, for direct display.
          type: string
        docsUrl:
          description: mintlify/v2 page explaining this action, when one exists.
          type:
          - string
          - 'null'
        route:
          description: The REST method + path that resolves this action (e.g. "POST /api/v2/accept-tos"), when a self-serve route exists today AND is reachable by the caller. For APPLY_FOR_CREDIT the route is only emitted when the `customer-credit-prepay` flag is on for the customer (the credit-applications surface is gated by it); the enum value is returned either way.
          type:
          - string
          - 'null'
        taskId:
          description: The MCP tool/Task name that resolves this action, when a bounded agent Task exists today.
          type:
          - string
          - 'null'
      required:
      - type
      - message
      - docsUrl
      - route
      - taskId
      additionalProperties: false
    BillingCapabilities:
      description: Capability derived from the org's own role UNION its children's roles. Always present — computed server-side so no consumer decides capability from `roles` alone. `roles` is left unchanged for existing consumers that specifically want the org's OWN role.
      type: object
      properties:
        seller:
          description: Whether the org has SELLER capability — its own `roles` OR at least one of its child accounts' roles (AI-3378). A parent org whose storefronts live only in child accounts (agency/reseller shape) still gets `true` here, unlike `roles` which only reflects the org's own customer row.
          type: boolean
        buyer:
          description: Whether the org has BUYER capability — its own `roles` OR at least one of its child accounts' roles (AI-3378).
          type: boolean
      required:
      - seller
      - buyer
      additionalProperties: false
