          description: ISO 4217 currency code
          example: USD
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        amountMinor:
          description: Invoice amount in minor units (e.g. cents for USD)
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
