      description: 'A customer’s credit/prepay position: their ledger balance sheet plus the derived funded / owed / spendable figures, all in `currency` minor units.'
      type: object
      properties:
        effectiveCustomerId:
          description: The credit-bearing customer the position is computed for (the caller, or its PARENT when the caller is a CHILD).
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          description: ISO 4217 currency every minor-unit field on this response is denominated in (the customer’s standing currency).
          allOf:
          - $ref: '#/components/schemas/LedgerCurrency'
        creditLimitMinor:
          description: Scope3-granted credit ceiling in minor units (absolute, not monthly). `0` means the customer has no credit line (a null or zero `customer_standing.credit_limit`) — they must apply for credit or contact Scope3; only a positive value grants credit.
          example: '30000000'
          type: string
          pattern: ^-?\d+$
        fundedBalanceMinor:
          description: Prepaid funds Scope3 currently holds for the customer (the `buyer_funds` LIABILITY balance), in minor units. `0` when none.
          example: '10000000'
          type: string
          pattern: ^-?\d+$
        owedBalanceMinor:
          description: Amount the customer currently owes Scope3 on credit (the `buyer_accounts_receivable` ASSET balance), in minor units. `0` when none.
          example: '0'
          type: string
          pattern: ^-?\d+$
        netBalanceMinor:
          description: owed − funded, in minor units. Negative means the customer is net prepaid/in credit; positive means they have an outstanding balance.
          example: '-10000000'
          type: string
          pattern: ^-?\d+$
        spendableMinor:
          description: 'How much the customer can still spend: creditLimit + funded − owed, in minor units.'
          example: '40000000'
          type: string
          pattern: ^-?\d+$
        accounts:
          description: Full per-account balance sheet for the customer (every financial account, by code). Empty when the customer has no ledger accounts yet.
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccountBalance'
