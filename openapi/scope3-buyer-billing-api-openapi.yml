      required:
      - lineKind
      - description
      - quantity
      - unitRateMinor
      - amountMinor
      - createdAt
      additionalProperties: false
    CaptureLinkExchangeResponse:
      description: Validates the capture-link token, marks it opened, and returns everything the hosted page needs to mount the embedded card form (or render the current status if already verified/expired).
      type: object
      properties:
        status:
          description: '`pending`: issued, not yet opened. `opened`: the hosted page exchanged the token at least once. `verified`: the card-rail webhook confirmed a payment method for this link. `expired`: the TTL elapsed before verification — terminal, never re-armed.'
          type: string
          enum:
          - pending
          - opened
          - verified
          - expired
        orgDisplayName:
          description: The requesting org's display name, shown so the cardholder knows whose payment method they're adding. Omitted from the status-only poll view.
          type: string
        expiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        clientSecret:
          description: The capture-session client secret for the embedded card form. Present only while status is pending or opened.
          type: string
        publishableKey:
          type: string
      required:
      - status
      - expiresAt
      additionalProperties: false
