          description: Payment due date (ISO 8601), when the row is a formal invoice
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        paidAt:
          description: When the invoice was paid (ISO 8601)
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        invoiceRef:
          description: Reference to the underlying invoice document, when one exists
          type: string
        meta:
          description: Additional row-kind-specific metadata
          type: object
          properties:
            activityKey:
              description: Internal key correlating this row to its source activity
              type: string
            iuQuantity:
              description: Inventory-unit quantity backing a usage row, when `kind` is "usage". Usage rows appear only after the IU rate-card is ratified (AI-3027) and always exclude cost_bearer=platform (dark meter) events.
              type: number
          additionalProperties: false
      required:
      - status
      - label
      - kind
      - currency
      - amountMinor
      additionalProperties: false
    BillingHold:
      description: A payment hold blocking NEW paid actions (meter-first, block narrow — spec §5.4/§12 ruling 5). Never blocks read access, reporting, export, in-flight delivering media, or this Plan & Billing surface itself.
