          - overage
          - payment_applied
        description:
          description: Human-readable description of the line
          type: string
        quantity:
          description: Intelligence Units the line covers — set on overage lines, null otherwise
          type:
          - number
          - 'null'
        unitRateMinor:
          description: Per-IU overage rate in minor units — set on overage lines, null otherwise
          type:
          - integer
          - 'null'
          minimum: -9007199254740991
          maximum: 9007199254740991
        amountMinor:
          description: Line amount in minor units. Positive for amounts owed (commitment, overage); negative for payments applied.
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
