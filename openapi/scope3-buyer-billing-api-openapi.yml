    InvoiceActivityRow:
      description: One row of invoice activity for a buyer (or seller) org.
      type: object
      properties:
        status:
          description: Status of one invoice activity row
          type: string
          enum:
          - open
          - accruing
          - paid
          - overdue
        ref:
          description: Short reference/number for this activity row, when assigned
          type: string
        label:
          description: Human-readable description of the invoice activity row
          type: string
        kind:
          description: 'What the invoice line is for: media spend, platform fees, metered AI usage, or a credit-line purchase'
          type: string
          enum:
          - media
          - fees
          - usage
          - credit_purchase
