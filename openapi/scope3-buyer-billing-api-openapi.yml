          - string
          - 'null'
        requestedCreditLimit:
          description: Requested limit in currency minor units.
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          description: ISO 4217 currency of the limits on this application.
          type: string
        status:
          description: Lifecycle state. `PENDING` until a superadmin decides; `APPROVED` once a limit is granted (and `customer_standing.credit_limit` is raised); `REJECTED` when declined; `WITHDRAWN` when the applicant pulls it before a decision.
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - WITHDRAWN
        justification:
          description: Free-text context supplied on submit. Null when not given.
          type:
          - string
          - 'null'
        grantedCreditLimit:
          description: Limit granted by the superadmin, in currency minor units. Null until approved.
          type:
          - integer
          - 'null'
          minimum: -9007199254740991
          maximum: 9007199254740991
        reviewedBy:
          description: User id of the superadmin who decided (BIGINT serialized as string). Null while pending.
          type:
          - string
          - 'null'
        reviewerName:
          description: Display name (or email) of the superadmin who decided, resolved server-side from the core user record. Null while pending, on buyer-facing reads, or when the reviewer cannot be resolved.
          type:
          - string
          - 'null'
        reviewedAt:
