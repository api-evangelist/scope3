      - adSelectionEmissionsPerImpression
      properties:
        percentile:
          type: integer
          example: 80
        adSelectionAndMediaDistributionEmissionsPerImpression:
          type: number
          format: double
          example: 1.67
          description: Ad tech and media distribution emissions in grams of CO₂e including servers and
            cloud computing; analytics; network traffic; storage; data providers; vendor overhead; content
            creation.
        adSelectionEmissionsPerImpression:
          type: number
          format: double
          example: 1.02
          description: Ad tech emissions in grams of CO₂e.
    DataUploadStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - FAILED
      - PENDING_REVIEW
      - SUCCESS
      - SKIPPED
      - MANUALLY_IGNORED
      - REPLACED_BY_REPROCESS
      description: The status of upload
    DataUploadInformation:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: integer
          description: The upload id
        status:
          $ref: '#/components/schemas/DataUploadStatus'
        rowsFailed:
          type: integer
          description: Rows that failed to be processed correctly
        rowsTotal:
          type: integer
          description: Total number of rows processed
        md5:
          type: string
          description: Uploaded file md5
        crc32c:
          type: string
          description: Uploaded file crc32c
        filename:
          type: string
          description: Uploaded filename
        summary:
          type: object
          description: Summary of the upload
        comment:
          type: string
          description: Comment for the uploaded file
        error:
          type: string
          description: Error message if upload failed
    Err:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    DistributionMethod:
      type: string
      enum:
      - BUCKET_PUSH
      - API_PULL
      - INTEGRATION
      description: The segment distribution method
    UpdateFrequency:
      type: string
      enum:
      - DAILY
      - MONTHLY
      description: The segment update frequency
    Paging:
      type: object
      required:
      - totalRecords
      properties:
        next:
          type: string
          description: The url to query for the next page of data
        previous:
          type: string
          description: The url to query for the next page of data
        totalRecords:
          type: integer
          description: The total number of records
    SegmentList:
      type: object
      required:
      - segments
      - paging
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        paging:
          $ref: '#/components/schemas/Paging'
    Segment:
      type: object
      required:
      - id
      - name
      - segmentId
      - distributionMethod
      - updateFrequency
      - propertyLists
      - placementLists
      - createdAt
      properties:
        id:
          type: integer
          description: The internal Scope3 segment id
        name:
          type: string
          description: The segment name
        segmentId:
          type: string
          description: The client segment id
        partners:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SegmentPartner'
          description: The client partners segment information
        distributionMethod:
          $ref: '#/components/schemas/DistributionMethod'
        updateFrequency:
          $ref: '#/components/schemas/UpdateFrequency'
        channels:
          type: array
          nullable: true
          items:
            type: string
          description: Channels enabled in the segment - if not populated, all channels are enabled
        propertyLists:
          type: array
          items:
            $ref: '#/components/schemas/PropertyList'
          description: The property lists included in the segment
        placementLists:
          type: array
          items:
            $ref: '#/components/schemas/PlacementList'
          description: The placement lists included in the segment
        fileName:
          type: string
          description: The filename template with macros for bucket pushed segment files
        createdAt:
          type: string
          format: date-time
          description: Creation date and time
          example: '2021-01-30T08:30:00Z'
        deactivatedAt:
          type: string
          format: date-time
          description: Deactivated date and time
          example: '2021-01-30T08:30:00Z'
    SegmentPartner:
      type: object
      required:
      - name
      - segmentId
      properties:
        name:
          type: string
          description: The client partner's name
        segmentId:
          type: string
          description: The client partner's segment id
        seatId:
          nullable: true
          type: string
          description: The client partner's seat id
    PropertyList:
      type: object
      required:
      - name
      - countries
      - isInclusion
      properties:
        name:
          type: string
          description: The property list name
        countries:
          type: array
          items:
            type: string
          description: The countries included in the segment
        isInclusion:
          type: boolean
          description: Whether the property list is included or excluded from the segment
    PlacementList:
      type: object
      required:
      - name
      - countries
      properties:
        name:
          type: string
          description: The placement list name
        countries:
          type: array
          items:
            type: string
          description: The countries included in the segment
    SegmentDataType:
      type: string
      enum:
      - INCLUDED_PROPERTY
      - EXCLUDED_PROPERTY
      - EXCLUDED_PROPERTY_PLACEMENTS
      description: The segment data type
    SegmentDataResponse:
      type: object
      required:
      - data
      - paging
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SegmentData'
          description: The segment data
        paging:
          $ref: '#/components/schemas/Paging'
    SegmentData:
      type: object
      required:
      - id
      - segmentId
      - type
      - property
      - channel
      - country
      - inventoryId
      properties:
        id:
          type: integer
          description: The internal Scope3 segment id
        segmentId:
          type: string
          description: The client segment id
        type:
          $ref: '#/components/schemas/SegmentDataType'
        property:
          type: string
          description: The property that the inventory belongs to
        channel:
          type: string
          description: The property channel
        country:
          type: string
          description: The country, is not populated applies worldwide
        inventoryId:
          type: string
          description: The inventory identifier
        appStore:
          type: string
          nullable: true
          description: If the inventory is an app, populated with the the app store
        gpids:
          type: array
          nullable: true
          items:
            type: string
          description: The GPIDs excluded for the given property
    SavedList:
      type: object
      required:
      - id
      - name
      - domain_count
      properties:
        id:
          type: string
          description: The saved list ID
        name:
          type: string
          description: The saved list name
        domain_count:
          type: integer
          description: Number of domains in the list
    SignalsPage:
      type: object
      required:
      - data
      - page
      - page_size
      - has_more
