openapi: 3.0.0
info:
  title: calculator Scope3 Carbon Calculator API
  description: API to calculate the carbon footprint of a campaign
  version: 2.0.0
servers:
- url: https://api.scope3.com/v2
security:
- bearerAuth: []
paths:
  /measure:
    post:
      summary: Emissions Measurement
      description: Calculates the carbon footprint for advertising media
      operationId: measure
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: includeRows
        description: Whether to include all rows in the response
        schema:
          type: boolean
      - in: query
        name: latest
        description: Whether to use latest available data
        schema:
          type: boolean
      - in: query
        name: fields
        description: Comma separated list of fields to include in the row level response
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MeasureResponseFields'
      - in: query
        name: framework
        description: Default is scope3
        schema:
          $ref: '#/components/schemas/Framework'
      requestBody:
        description: Rows of delivered media to measure
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureRequest'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /creative:
    post:
      summary: Creative emissions
      description: Calculates the carbon footprint of running a creative
      operationId: creative
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: includeRows
        description: Whether to include all rows in the response
        schema:
          type: boolean
      - in: query
        name: latest
        description: Whether to use latest available data
        schema:
          type: boolean
      - in: query
        name: framework
        description: Default is scope3
        schema:
          $ref: '#/components/schemas/Framework'
      requestBody:
        description: Rows of delivered creatives to measure
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreativeRequest'
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /benchmarks:
    post:
      summary: Country-channel benchmarks
      description: Emissions by percentile per country and channel
      operationId: benchmarks
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: latest
        description: Whether to use latest available data
        schema:
          type: boolean
      requestBody:
        description: Benchmark request parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarksRequest'
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarksResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /data/upload:
    post:
      operationId: postDataUpload
      summary: Upload Data File
      description: Returns the uploaded data file status
      requestBody:
        description: 'Upload a client data file via CSV.


          If the file size exceeds 100MB, please reach out to your Scope3 contact for more options.

          '
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum:
                  - MEDIA_DELIVERY
                  - CUSTOMER_USAGE
                  - CREATIVE_DELIVERY
                  - ATP_TRAFFIC_SHAPING
                  - ATP_SUPPLY
                  - PUB_PROPERTY_METRICS
                  - DP_INVENTORY_METRICS
                  - SUSTAINABILITY_FACTS
                  - CONTENT_METADATA
                  - AI_INFERENCE
                  description: The type of data file being uploaded
                fieldMapping:
                  type: string
                  enum:
                  - CUSTOM
                  description: The field mapping type
                version:
                  type: string
                  nullable: true
                  description: The custom mapping version
                dataSource:
                  type: string
                  nullable: true
                  description: The custom mapping data source
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadInformation'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /data/upload/{uploadId}:
    get:
      operationId: getDataUploadId
      summary: Get Data File Upload by ID
      description: Returns requested data file upload information
      parameters:
      - in: path
        name: uploadId
        schema:
          type: integer
        required: true
        description: Numeric ID of the upload to get
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadInformation'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /segment/list:
    get:
      operationId: getOrganizationSegmentList
      summary: Get All Organization Segment Information
      description: Returns filtered list of organization segments
      parameters:
      - in: query
        name: page
        description: Which page number being requested
        schema:
          type: number
          minimum: 1
      - in: query
        name: segmentId
        description: specify the client segment id to fuzzy search filter on
        schema:
          type: string
      - in: query
        name: includeDeactivated
        description: whether to filter out deactivated segments
        schema:
          type: boolean
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /segment/data:
    get:
      operationId: getOrganizationSegmentDataBySegmentId
      summary: Get Organization Segment Data by Segment ID
      description: Returns requested data for the segment
      parameters:
      - in: query
        name: segmentId
        schema:
          type: string
        description: client segment id
      - in: query
        name: id
        schema:
          type: string
        description: scope3 internal segment id
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentDataResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /saved_lists:
    get:
      operationId: getSavedLists
      summary: Get Saved Lists
      description: Returns all property lists available for the authenticated customer, including list
        ID, name, and domain count.
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedList'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /signals/saved_list/{saved_list_id}:
    get:
      operationId: getSignalsBySavedList
      summary: Get Signals by Saved List
      description: Returns paginated domain-level media quality signals for all domains in the specified
        saved property list.
      parameters:
      - in: path
        name: saved_list_id
        required: true
        schema:
          type: integer
          minimum: 1
        description: Numeric ID of the saved property list
      - in: query
        name: page
        schema:
          default: 1
        description: Page number (1-based, integer)
      - in: query
        name: page_size
        schema:
          default: 1000
        description: Number of domains per page (integer, max 5000)
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalsPage'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    InventoryCoverageEnum:
      type: string
      enum:
      - modeled
      - missing
      - unknown
      description: 'modeled - Inventory is included in the Scope3 dataset for the requested date.

        missing - Inventory is not included in the Scope3 dataset for the requested date.

        unknown - Inventory is unable to measured as a result of errors.'
    InventoryIdentifier:
      type: string
      example: nytimes.com
      description: This field can accept either a domain, app id, or screen id
    DatetimeInput:
      type: string
      description: 'Dates must be in the past (i.e. prior to today) in the UTC timezone (Supported Formats:
        YYYY-MM-DD, YYYYMMDD, YYYY/MM/DD,  YYYYMMddThh:mm:ss.s, YYYYMMddThh:mm:ss, yyyy/mm/ddThh:mm:ss.s,
        yyyy/mm/ddThh:mm:ss, yyyy-mm-ddThh:mm:ss.s,yyyy-mm-ddThh:mm:ss)'
      example: '2023-03-01'
    CountryInput:
      type: string
      description: 'This is the country ISO 3166-2 alpha-2 code, alpha-3 code, or a country name e.g.
        US, USA, United States. (Supported Languages: English)'
      example: US
    RegionInput:
      type: string
      description: 'The 2-3 letter country region code (Supported Countries: Canada, US, and Australia)'
      example: NY
    NetworkInput:
      type: string
      enum:
      - fixed
      - mobile
      example: fixed
      description: The networking connection used by the consumer device
    DeviceTypeInput:
      type: string
      enum:
      - phone
      - tablet
      - pc
      - tv
      - smart-speaker
      - radio
      example: pc
      description: The consumer device. If not provided, we will infer the device type from the the channel.
        smart-speaker is only allowed for digital-audio channel radio is only allowed for traditional-radio
        channel
    SellerName:
      type: string
      example: Xandr
      description: Name of the seller entity that sold the media
    SellerDomain:
      type: string
      example: xandr.com
      description: Canonical domain of the seller entity that sold the media
    Channel:
      type: string
      enum:
      - app
      - web
      - streaming-video
      - social
      - digital-audio
      - dooh
      - ctv-bvod
      - linear-tv
      - search
      - traditional-radio
      - classic-ooh
      - print
      example: web
      description: If not provided, we will infer the channel from the the inventory id.  'digital-audio',
        'dooh' channels are currently in beta.
    AppStore:
      type: string
      enum:
      - apple-app-store
      - google-play-store
      - amazon
      - roku
      - samsung
      - lg
      - vizio
      - microsoft
      example: apple-app-store
      description: The app store where the app is distributed.
    BuyingMethod:
      type: string
      enum:
      - programmatic-open
      - programmatic-pmp
      - programmatic-guaranteed
      - direct
      - direct-takeover
      example: programmatic-open
      description: The method used to buy the impressions
    VenueCategory:
      type: string
      example: transit.airports.arrival
      description: 'The inventory venue category. A venue category describes an environment and the audience
        that may be found there. (Supported Channels: DOOH) [OpenOOH Venue Taxonomy](https://github.com/openooh/venue-taxonomy/blob/main/specification-1.0.md)'
    Plays:
      type: integer
      example: 10
      description: 'How many times an ad was shown. (Supported Channels: DOOH, Linear TV)'
    Views:
      type: integer
      example: 10
      description: The number of views counted.
    PlayDuration:
      type: number
      format: double
      example: 10
      description: 'How duration in seconds that an ad was on screen. (Supported Channels: DOOH, Linear
        TV)'
    MediaOwner:
      type: string
      description: 'The name of the organization that owns the screen inventory. (Supported Channels:
        DOOH)'
    DealId:
      type: string
      example: '12345'
      description: The identifier of the deal being bought
    PrintMedium:
      type: string
      enum:
      - newspaper
      - magazine
      - journal
      - leaflet
      example: newspaper
    CreativeInput:
      type: object
      properties:
        adFormat:
          $ref: '#/components/schemas/AdFormat'
        vendor:
          $ref: '#/components/schemas/CreativeVendor'
        totalImageDataTransferBytes:
          type: integer
          example: 150000
          description: Total bytes for the data transfer for the image itself for all impressions, ideally
            measured by the CDN
        imageSizesPixels:
          type: array
          items:
            type: string
          example:
          - 300x250
          - 970x250
          description: Array of images width x height of creative (basic image only)
        renderedWidthPixels:
          type: integer
          example: 300
          description: Width of the rendered image or video in pixels
        renderedHeightPixels:
          type: integer
          example: 250
          description: Height of the rendered image or video in pixels
        totalAudioDataTransferBytes:
          type: integer
          example: 15
          description: Total bytes for the data transfer for the core audio asset for all impressions,
            ideally measured by the CDN
        audioDurationSeconds:
          type: number
          format: double
          example: 90.1
          description: Average audio duration in seconds for a single impression
        totalVideoDataTransferBytes:
          type: integer
          example: 72800
          description: Total bytes for the data transfer for the core video asset for all loads, ideally
            measured by the CDN
        videoVastBytes:
          type: integer
          example: 12000
          description: Average size of VAST/VPAID wrapper for the video in bytes for a single load
        videoBitrateKbps:
          type: integer
          example: 500
          description: Video bitrate *as delivered* in kilobits per second
        videoSizeBytes:
          type: integer
          example: 150000
          description: Average video size _as delivered_ in bytes for a single load
        videoDurationSeconds:
          type: number
          format: double
          example: 30.5
          description: Video duration in seconds
        videoViewTimeSeconds:
          type: number
          format: double
          example: 15
          description: Average time, in seconds, that a video is viewed
        videoViewRate:
          type: number
          format: double
          example: 0.8
          description: The percentage of the video that is viewed
        timeInViewSeconds:
          type: number
          format: double
          example: 15
          description: Time that the creative was visible on the device
        adTechPlatformVideoPlayerDomain:
          type: string
          example: seenthis.co
          description: The canonical domain of the ad tech platform that owns the video player or 'default'
        adTechPlatformCreativeAdserverDomains:
          type: array
          items:
            type: string
          example: []
          description: The canonical domains of the creative adservers
        otherAssetsBytes:
          type: integer
          example: 15000
          description: Metadata, text, html, etc.
        is3PServed:
          type: boolean
          example: true
          description: Does this ad format expect/support the creative to be served by a third party ad
            server
    AdFormat:
      type: string
      example: generic-instream-video
      description: The identifier for either a platform ad format or vendor-provided ad format
    CreativeVendor:
      type: string
      example: YouTube
      description: The name of vendor organization that owns the ad format. Should not be provided for
        platform ad formats.
    BroadcastMethod:
      type: string
      enum:
      - ota
      - cable
      - satellite
      - iptv
      - am
      - fm
      example: ota
      description: Signal delivery method
    MeasureResponseFields:
      type: string
      enum:
      - all
      - emissionsBreakdown
      - coverage
      - policies
      description: Specify the row level output fields to be returned. By default, only totalEmissions,
        inventoryCoverage, and error fields are returned.
    DailyDeliveryRow:
      type: object
      required:
      - utcDatetime
      properties:
        rowIdentifier:
          type: string
          example: nytimes
          description: An identifier for this row to be used in the response.
        impressions:
          type: integer
          example: 13821
        utcDatetime:
          $ref: '#/components/schemas/DatetimeInput'
        inventoryId:
          $ref: '#/components/schemas/InventoryIdentifier'
        appStore:
          $ref: '#/components/schemas/AppStore'
        country:
          $ref: '#/components/schemas/CountryInput'
        region:
          $ref: '#/components/schemas/RegionInput'
        deviceType:
          $ref: '#/components/schemas/DeviceTypeInput'
        channel:
          $ref: '#/components/schemas/Channel'
        network:
          $ref: '#/components/schemas/NetworkInput'
        creative:
          $ref: '#/components/schemas/CreativeInput'
        sellerDomain:
          $ref: '#/components/schemas/SellerDomain'
        sellerName:
          $ref: '#/components/schemas/SellerName'
        buyingMethod:
          $ref: '#/components/schemas/BuyingMethod'
        dealId:
          $ref: '#/components/schemas/DealId'
        globalPlacementId:
          type: string
          description: This is a publisher-specified placement identifier that is passed unchanged by
            all supply-side platforms.
        venueCategory:
          $ref: '#/components/schemas/VenueCategory'
        plays:
          $ref: '#/components/schemas/Plays'
        views:
          $ref: '#/components/schemas/Views'
        playDuration:
          $ref: '#/components/schemas/PlayDuration'
        mediaOwner:
          $ref: '#/components/schemas/MediaOwner'
        compensationRate:
          type: number
          format: double
          example: 0.05
          description: The rate at which emissions are compensated. Greater than or equal to zero. If
            not provided, the reporting customer's compensation rules will be used.
        isApp:
          type: boolean
          example: true
          description: Whether the inventory is an app.
        broadcastMethod:
          $ref: '#/components/schemas/BroadcastMethod'
        uniqueReach:
          type: integer
          example: 203043
          description: Number of unique individuals reached.
        averageFrequency:
          type: number
          example: 176
          description: Average number of times each individual has seen the ad.
        displayDurationDays:
          type: integer
          example: 30
          description: Number of days the classic-ooh ad was displayed.
        campaignStartDate:
          $ref: '#/components/schemas/DatetimeInput'
        campaignEndDate:
          $ref: '#/components/schemas/DatetimeInput'
        shareOfTimePct:
          type: number
          format: double
          example: 50
          description: Share of time the ad was visible on the classic-ooh screen as a percentage (0-100).
        physicalWidthMeters:
          type: number
          format: double
          example: 2.5
          description: Physical width of the classic-ooh ad in meters.
        physicalHeightMeters:
          type: number
          format: double
          example: 3
          description: Physical height of the classic-ooh ad in meters.
        printMedium:
          $ref: '#/components/schemas/PrintMedium'
        printCirculations:
          type: integer
          example: 50000
          description: Number of copies distributed for the print campaign.
    CalculateOutputRow:
      type: object
      required:
      - inventoryCoverage
      properties:
        rowIdentifier:
          type: string
          description: Row identifier associated with these emissions based on the request input
          example: '1'
        inventoryCoverage:
          $ref: '#/components/schemas/InventoryCoverageEnum'
        totalEmissions:
          type: number
          format: double
          example: 0.45
          description: Total footprint of the campaign in grams of CO₂e.
        error:
          $ref: '#/components/schemas/Error'
        coverage:
          $ref: '#/components/schemas/MeasureResponseRowCoverage'
        emissionsBreakdown:
          $ref: '#/components/schemas/MeasureResponseRowEmissions'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
    SupplyGraph:
      type: object
      required:
      - logical
      - technical
      properties:
        totalCount:
          type: integer
          example: 8
          description: Number of times matched seller appears in supply chain emissions graph, or the
            count of all property ads txt nodes
        logical:
          $ref: '#/components/schemas/LogicalSupplyGraph'
        technical:
          $ref: '#/components/schemas/TechnicalSupplyGraph'
      description: Ad selection graph seller depth information. [Programmatic Insights customers only]
    LogicalSupplyGraph:
      type: object
      properties:
        minDepth:
          type: integer
          example: 1
          description: Minimum depth of ad selection path to the matched seller OR the maximum depth of
            all property ads txt nodes Based on the minimum depth, buying method and seller type.
        maxDepth:
          type: integer
          example: 5
          description: Maximum depth of ad selection path to the matched seller OR the maximum depth of
            all property ads txt nodes Based on the maximum depth, buying method and seller type.
        averageDepth:
          type: number
          format: double
          example: 3
          description: Average depth of ad selection path to the matched seller OR the maximum depth of
            all property ads txt nodes Based on the average depth, buying method and seller type.
      description: Logical information calculates depth based on the full ad selection graph.
    TechnicalSupplyGraph:
      type: object
      properties:
        minDepth:
          type: integer
          example: 1
          description: Minimum depth of ad selection path to the matched seller OR the maximum depth of
            all property ads txt nodes Based on the minimum depth, buying method and seller type.
        maxDepth:
          type: integer
          example: 5
          description: Maximum depth of ad selection path to the matched seller OR the maximum depth of
            all property ads txt nodes Based on the maximum depth, buying method and seller type.
        averageDepth:
          type: number
          format: double
          example: 3
          description: Average depth of ad selection path to the matched seller OR the maximum depth of
            all property ads txt nodes Based on the average depth, buying method and seller type.
      description: Technical information ignores ad selection graph passthrough nodes. The calculated
        depth only uses nodes that very directly involved in the ad selection process.
    MeasureRequest:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DailyDeliveryRow'
    MeasureResponse:
      type: object
      required:
      - totalEmissions
      - totalEmissionsBreakdown
      - coverage
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        totalEmissions:
          type: number
          format: double
          example: 2823.9
          description: The total emissions in grams of CO₂e
        rows:
          description: Only included if the includeRows parameter is true.
          type: array
          items:
            $ref: '#/components/schemas/CalculateOutputRow'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/SummaryPolicy'
        totalEmissionsBreakdown:
          $ref: '#/components/schemas/MeasureResponseEmissionsBreakdown'
        coverage:
          $ref: '#/components/schemas/MeasureResponseCoverage'
    RequestId:
      type: string
      description: Auto generated request identifier
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    MeasureResponseEmissionsBreakdown:
      type: object
      required:
      - framework
      - totals
      properties:
        framework:
          $ref: '#/components/schemas/Framework'
        totals:
          oneOf:
          - $ref: '#/components/schemas/Scope3MeasureResponseEmissionsBreakdownDetails'
          - $ref: '#/components/schemas/Scope3ConsumerDeviceMeasureResponseEmissionsBreakdownDetails'
          - $ref: '#/components/schemas/GMSFMeasureResponseEmissionsBreakdownDetails'
    Scope3MeasureResponseEmissionsBreakdownDetails:
      type: object
      properties:
        mediaDistribution:
          type: number
          format: double
          example: 0.15
          description: Total media distribution emissions in grams of CO₂e
        adSelection:
          type: number
          format: double
          example: 0.15
          description: Total ad selection emissions in grams of CO₂e
        creativeDelivery:
          type: number
          format: double
          example: 0.15
          description: Total creative delivery emissions in grams of CO₂e
        compensated:
          type: number
          format: double
          example: 0.15
          description: Total compensated emissions in grams of CO₂e
        techManipulation:
          type: number
          format: double
          example: 0.15
          description: Total tech manipulation emissions in grams of CO₂e
        disposal:
          type: number
          format: double
          example: 0.15
          description: Total disposal emissions in grams of CO₂e
    Scope3ConsumerDeviceMeasureResponseEmissionsBreakdownDetails:
      type: object
      properties:
        mediaDistribution:
          type: number
          format: double
          example: 0.15
          description: Total media distribution emissions in grams of CO₂e
        adSelection:
          type: number
          format: double
          example: 0.15
          description: Total ad selection emissions in grams of CO₂e
        creativeDelivery:
          type: number
          format: double
          example: 0.15
          description: Total creative delivery emissions in grams of CO₂e
        compensated:
          type: number
          format: double
          example: 0.15
          description: Total compensated emissions in grams of CO₂e
        techManipulation:
          type: number
          format: double
          example: 0.15
          description: Total tech manipulation emissions in grams of CO₂e
        disposal:
          type: number
          format: double
          example: 0.15
          description: Total disposal emissions in grams of CO₂e
    GMSFMeasureResponseEmissionsBreakdownDetails:
      type: object
      properties:
        adSelection:
          type: number
          format: double
          example: 0.15
          description: Total ad selection emissions in grams of CO₂e
        creativeDelivery:
          type: number
          format: double
          example: 0.15
          description: Total creative delivery emissions in grams of CO₂e
        compensated:
          type: number
          format: double
          example: 0.15
          description: Total compensated emissions in grams of CO₂e
        techManipulation:
          type: number
          format: double
          example: 0.15
          description: Total tech manipulation emissions in grams of CO₂e
        disposal:
          type: number
          format: double
          example: 0.15
          description: Total disposal emissions in grams of CO₂e
    MeasureResponseCoverage:
      type: object
      required:
      - totalImpressions
      - totalRows
      properties:
        totalImpressions:
          $ref: '#/components/schemas/SummaryMetric'
        totalRows:
          $ref: '#/components/schemas/SummaryMetric'
        sellers:
          $ref: '#/components/schemas/VerifiedSummaryMetric'
        properties:
          $ref: '#/components/schemas/VerifiedSummaryMetric'
        channels:
