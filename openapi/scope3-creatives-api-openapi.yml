                minLength: 1
              asset_type:
                description: Creative asset type (AdCP spec + extensions)
                type: string
                enum:
                - IMAGE
                - VIDEO
                - AUDIO
                - HTML
                - JAVASCRIPT
                - CSS
                - TEXT
                - URL
                - VAST
                - FONT
                - LOGO
                - DOCUMENT
              label:
