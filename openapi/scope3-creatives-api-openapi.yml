    BulkUpdateCreativesBody:
      description: Bulk update saved campaign creatives. Use dry_run first to confirm the matched set.
      type: object
      properties:
        selection:
          $ref: '#/components/schemas/BulkUpdateCreativeSelection'
        update:
          type: object
          properties:
            click_url:
              description: Set the canonical click-through URL for every selected creative.
              type: string
              format: uri
            format_id:
              description: Set the primary format for every selected creative. Use to retype creatives to a sales agent's required format id (e.g. display_300x250_nongenerative).
              type: object
              properties:
                agent_url:
                  type: string
                id:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                width:
                  type: number
                  minimum: 1
                height:
                  type: number
                  minimum: 1
                duration_ms:
                  type: number
                  minimum: 1
              required:
              - agent_url
              - id
              additionalProperties: {}
            target_format_ids:
              description: Set the additional format ids every selected creative covers. Replaces the existing list on each creative.
              type: array
              items:
                type: object
                properties:
                  agent_url:
                    type: string
                  id:
                    type: string
                    pattern: ^[a-zA-Z0-9_-]+$
                  width:
                    type: number
                    minimum: 1
                  height:
                    type: number
                    minimum: 1
                  duration_ms:
                    type: number
                    minimum: 1
                required:
                - agent_url
                - id
                additionalProperties: {}
        dry_run:
          description: When true, return the matched creative set without applying changes. Defaults to true for human confirmation.
          default: true
          type: boolean
        exclude_creative_ids:
          description: Creative IDs to remove from the matched set before applying the update
          maxItems: 200
          type: array
          items:
            type: string
            minLength: 1
        limit:
          description: Maximum number of creatives to match/update
          default: 200
          type: integer
          minimum: 1
          maximum: 500
        confirm_partial_batch:
          description: When false, applying a bulk update is rejected if more creatives match than the requested limit. Set true only when the buyer explicitly confirms a partial batch.
          default: false
          type: boolean
      required:
      - selection
      - update
