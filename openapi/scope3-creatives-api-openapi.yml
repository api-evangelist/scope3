  /campaigns/{campaignId}/creative-sessions/{sessionId}/evaluate:
    post:
      operationId: evaluateCreativeSession
      summary: Evaluate creative session
      description: Run draft or final evaluator checks across a creative iteration session.
      tags:
      - Creatives
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: campaignId
        schema:
          type: string
          minLength: 1
        required: true
      - in: path
        name: sessionId
        schema:
          type: string
          minLength: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  default: draft
                  type: string
                  enum:
                  - generation
                  - selection
                  - refinement
                  - finalization
                  - adaptation
                  - approval
                  - live_learning
                  - draft
                  - final
                selected_variant_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Evaluate creative session
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /campaigns/{campaignId}/creative-sessions/{sessionId}/finalize:
    post:
      operationId: finalizeCreativeSession
      summary: Finalize creative session
      description: Save the selected creative session variant as a campaign creative manifest.
      tags:
      - Creatives
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: campaignId
        schema:
          type: string
          minLength: 1
        required: true
      - in: path
        name: sessionId
        schema:
          type: string
          minLength: 1
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected_variant_id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: Finalize creative session
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /campaigns/{campaignId}/creative-references:
    get:
      operationId: getCreativeReferences
      summary: Get creative references
      description: 'Get the campaign advertiser''s creative library as generative reference sources: sourced materials (reference-role assets, filterable by media type) and past creatives (filterable by campaign). Gated behind the buyer-generative-creative surface.'
      tags:
      - Creatives
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: campaignId
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Get creative references
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  sourced_materials:
                    type: array
                    items:
                      type: object
                      properties:
                        reference_id:
                          type: string
                        name:
                          type: string
                        format:
                          type: string
                        media_kind:
                          type: string
                          enum:
                          - image
                          - video
                          - audio
                          - other
                        reuse_count:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        preview_url:
                          type: string
                      required:
                      - reference_id
                      - name
                      - format
                      - media_kind
                      additionalProperties: false
                  sourced_materials_total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  past_creatives:
                    type: array
                    items:
                      type: object
                      properties:
                        creative_id:
                          type: string
                        name:
                          type: string
                        format:
                          type: string
                        reuse_count:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        preview_url:
                          type: string
                        campaign_id:
                          type: string
                        campaign_name:
                          type: string
                      required:
                      - creative_id
                      - name
                      - format
                      - campaign_id
                      additionalProperties: false
                  past_creatives_total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  preselected:
                    type: object
                    properties:
                      sourced_materials:
                        type: array
                        items:
                          type: string
                      past_creatives:
                        type: array
                        items:
                          type: string
                    required:
                    - sourced_materials
                    - past_creatives
                    additionalProperties: false
                required:
                - campaign_id
                - sourced_materials
                - past_creatives
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreativeManifestListResponse:
      description: Paginated list of creative manifest summaries
      type: object
      properties:
        manifests:
          description: Manifests projected to the summary shape. Use `get_creative` for full detail.
          type: array
          items:
            $ref: '#/components/schemas/CreativeManifestSummary'
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - manifests
      - total
      additionalProperties: false
    CreativeAssetControl:
      description: Renderer/evaluator guidance for supplied creative assets that must retain visual fidelity through generation and refinement.
      type: object
      properties:
        locked_asset:
          description: When true, creative generation and rendering should preserve this supplied asset rather than redraw or reinterpret it.
          type: boolean
        asset_role:
          description: Role of the supplied asset, such as product, package, logo, brand, reference, or scene.
          type: string
          enum:
          - product
          - package
          - logo
          - brand
          - reference
          - scene
          - other
        can_transform:
          description: Whether the asset may be transformed. Set false for exact product imagery, packaging, logos, book covers, or regulated artwork.
          type: boolean
        preservation_notes:
          description: Human-readable instructions for preserving asset fidelity, e.g. "Preserve cover typography and portrait exactly."
          type: string
          minLength: 1
          maxLength: 1000
        source_asset_id:
          description: Raw/source creative-session asset ID used to derive this linked asset, when the asset is a rendition or locked composite.
          type: string
          minLength: 1
          maxLength: 255
        rendition_asset_id:
          description: Creative-session rendition asset ID used in the final creative manifest.
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false
    ConnectBuyerModelCredentialBody:
      type: object
      properties:
        providerType:
          type: string
          enum:
          - audiostack
          - elevenlabs
          - fal
          - gemini
          - openai
          - veo
        apiKey:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - providerType
      - apiKey
      - label
    CreativeCollectionMemberInput:
      description: A saved creative or source/generated asset to add to a collection.
      type: object
      properties:
        member_type:
          description: Type of item in a creative collection. Creative members are saved campaign creatives; asset members are raw/source/brand/generated assets.
          type: string
          enum:
          - creative
          - asset
        member_id:
          type: string
          minLength: 1
          maxLength: 255
        label:
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          default: {}
          type: object
          additionalProperties: {}
      required:
      - member_type
      - member_id
    FrequencyCapWindow:
      description: Rolling time window over which max_impressions applies (AdCP Duration shape).
      type: object
      properties:
        interval:
          type: number
          minimum: 1
        unit:
          anyOf:
          - type: string
            enum:
            - seconds
          - type: string
            enum:
            - minutes
          - type: string
            enum:
            - hours
          - type: string
            enum:
            - days
          - type: string
            enum:
            - campaign
      required:
      - interval
      - unit
      additionalProperties: {}
    CreateCreativeManifestMetadata:
      description: JSON metadata for creating a creative manifest
      type: object
      properties:
        name:
          description: Manifest name (auto-generated if omitted)
          type: string
          minLength: 1
          maxLength: 255
        message:
          description: Creative brief / direction text
          type: string
          minLength: 1
          maxLength: 5000
        url_asset:
          description: Add a single URL asset (per AdCP url-asset spec). For multi-slot formats (e.g. native), use `url_assets` instead.
          type: object
          properties:
            url:
              description: URL to add as asset (must be http/https)
              type: string
              format: uri
            url_type:
              description: URL type classification
              type: string
              enum:
              - clickthrough
              - tracker_pixel
              - tracker_script
              - vast
          required:
          - url
          - url_type
        url_assets:
          description: URL assets assigned to specific AdCP format slots (e.g. native landing_page, click trackers). Each entry pairs a slot `asset_id` with a URL.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/UrlAssetSlotInput'
        text_assets:
          description: Text assets assigned to specific AdCP format slots (e.g. native headline, long_headline, description, business_name, disclosure). Each entry pairs a slot `asset_id` with content.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/TextAssetSlotInput'
        webhook_asset:
          description: Add a webhook asset for DCO (dynamic content).
          type: object
          properties:
            url:
              description: URL to add as asset (must be http/https)
              type: string
              format: uri
            method:
              type: string
              enum:
              - GET
              - POST
            timeout_ms:
              type: integer
              minimum: 10
              maximum: 5000
            response_type:
              type: string
              enum:
              - html
              - json
              - xml
              - javascript
            security:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - hmac_sha256
                  - api_key
                  - none
                hmac_header:
                  type: string
                api_key_header:
                  type: string
              required:
              - method
          required:
          - url
          - response_type
          - security
        format_id:
          description: Legacy-v1 ADCP named-format ref for this creative (auto-resolved from template if omitted). Use format_kind for AdCP 3.1 canonical formats.
          type: object
          properties:
            agent_url:
              type: string
            id:
              type: string
              pattern: ^[a-zA-Z0-9_-]+$
            width:
              type: number
              minimum: 1
            height:
              type: number
              minimum: 1
            duration_ms:
              type: number
              minimum: 1
          required:
          - agent_url
          - id
          additionalProperties: {}
        format_kind:
          description: AdCP 3.1 canonical format kind (e.g. image_carousel, video_hosted). Alternative to format_id for canonical formats.
          anyOf:
          - type: string
            enum:
            - image
          - type: string
            enum:
            - html5
          - type: string
            enum:
            - display_tag
          - type: string
            enum:
            - image_carousel
          - type: string
            enum:
            - video_hosted
          - type: string
            enum:
            - video_vast
          - type: string
            enum:
            - audio_hosted
          - type: string
            enum:
            - audio_daast
          - type: string
            enum:
            - sponsored_placement
          - type: string
            enum:
            - native_in_feed
          - type: string
            enum:
            - responsive_creative
          - type: string
            enum:
            - agent_placement
          - type: string
            enum:
            - custom
        format_option_ref:
          description: Pins this manifest to a specific format_options[] entry on a product, identified by format_option_id. Use scope:"publisher" with publisher_domain for catalog-backed options, scope:"product" for product-inline options.
          oneOf:
          - type: object
            properties:
              scope:
                type: string
                enum:
                - publisher
              publisher_domain:
                type: string
              format_option_id:
                type: string
            required:
            - scope
            - publisher_domain
            - format_option_id
            additionalProperties: false
          - type: object
            properties:
              scope:
                type: string
                enum:
                - product
              format_option_id:
                type: string
            required:
            - scope
            - format_option_id
            additionalProperties: false
          type: object
        industry_identifiers:
          description: Industry identifiers (Ad-ID, ISCI, Clearcast clock number, IDcrea) per AdCP spec.
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - ad_id
                - isci
                - clearcast_clock
                - idcrea
              value:
                type: string
            required:
            - type
            - value
        template_id:
          description: Creative template ID — legacy-v1 ADCP named-format id (e.g., "display_image", "display_html", "video_standard") or vendor tag (e.g., "vendor_dcm_tag")
          type: string
        assets:
          description: 'Multipart REST metadata only: each filename must match a file uploaded in the same multipart request. Murph chat attachments are not multipart files; represent them as linked_assets[].data_url using the murph-attachment://N placeholder instead. If omitted, multipart files are auto-classified.'
          type: array
          items:
            type: object
            properties:
              filename:
                description: Must match an uploaded file's originalname
                type: string
                minLength: 1
              asset_type:
                description: Asset type (auto-detected from MIME if omitted)
                type: string
                enum:
                - IMAGE
                - VIDEO
                - AUDIO
                - HTML
                - JAVASCRIPT
                - CSS
                - TEXT
                - URL
                - VAST
                - FONT
                - LOGO
                - DOCUMENT
              label:
                description: Label/key for this asset in the manifest (auto-generated if omitted)
                type: string
              slot_asset_id:
                description: AdCP format slot asset_id for this file (used by multi-slot formats like native).
                type: string
                minLength: 1
                maxLength: 255
              locked_asset:
                description: When true, creative generation and rendering should preserve this supplied asset rather than redraw or reinterpret it.
                type: boolean
              asset_role:
                description: Role of the supplied asset, such as product, package, logo, brand, reference, or scene.
                type: string
                enum:
                - product
                - package
                - logo
                - brand
                - reference
                - scene
                - other
              can_transform:
                description: Whether the asset may be transformed. Set false for exact product imagery, packaging, logos, book covers, or regulated artwork.
                type: boolean
              preservation_notes:
                description: Human-readable instructions for preserving asset fidelity, e.g. "Preserve cover typography and portrait exactly."
                type: string
                minLength: 1
                maxLength: 1000
              source_asset_id:
                description: Raw/source creative-session asset ID used to derive this linked asset, when the asset is a rendition or locked composite.
                type: string
                minLength: 1
                maxLength: 255
              rendition_asset_id:
                description: Creative-session rendition asset ID used in the final creative manifest.
                type: string
                minLength: 1
                maxLength: 255
            required:
            - filename
        linked_assets:
          description: URL-backed or inline media assets from a chat attachment, DAM, catalog, product page, or creative generator. For every Murph chat attachment, use linked_assets[].data_url = murph-attachment://N; never put its filename in assets[] because buyer_api_call does not send multipart file bytes.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/LinkedCreativeAssetInput'
        brandAgentId:
          description: Advertiser ID (parameter name kept for wire compatibility). Required when creating an advertiser-level master without a campaign. Ignored when the manifest is created under a campaign (resolved from campaign context).
          type: string
        frequencyCaps:
          description: Buyer-defined frequency caps for this creative. When provided, sets the full list.
          type: array
          items:
            $ref: '#/components/schemas/FrequencyCapConfigInput'
        cards:
          description: Carousel cards (image_carousel format). Min 2, max 10. Each card needs filename (for an uploaded file) or url (for a pre-hosted asset), plus optional headline, description, cta, landing_page_url.
          minItems: 2
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/CardInput'
    ManifestAssetResponse:
      description: Asset within a creative manifest
      type: object
      properties:
        asset_id:
          description: Asset ID
          type: string
        name:
          description: Display name
          type: string
        original_filename:
          description: Original uploaded filename
          type: string
        asset_type:
          description: Asset type
          type: string
          enum:
          - IMAGE
          - VIDEO
          - AUDIO
          - HTML
          - JAVASCRIPT
          - CSS
          - TEXT
          - URL
          - VAST
          - FONT
          - LOGO
          - DOCUMENT
        content_type:
          description: MIME type
          type: string
        file_size:
          description: File size in bytes
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        public_url:
          description: Public URL
          type: string
          format: uri
        asset_source:
          description: Whether this asset was uploaded by the user or generated by the system
          type: string
          enum:
          - CREATIVE_SOURCE
          - USER_UPLOADED
          - SYSTEM_PROCESSED
        slot_asset_id:
          description: AdCP format slot asset_id assigned to this asset, when applicable. The slot asset_id is the key under which the asset appears in the AdCP creative manifest.
          type: string
        asset_control:
          description: Optional fidelity controls for supplied assets that should be preserved by creative generators, renderers, and evaluators.
          allOf:
          - $ref: '#/components/schemas/CreativeAssetControl'
        width:
          description: Actual width in pixels (image and video assets only)
          type: integer
          maximum: 9007199254740991
          minimum: 1
        height:
          description: Actual height in pixels (image and video assets only)
          type: integer
          maximum: 9007199254740991
          minimum: 1
        declared_sizes:
          description: Buyer-declared display sizes for an HTML ad tag, supplied out-of-band via a CSV/manifest at upload. Declared, not probed — distinct from width/height, which hold measured dimensions.
          type: array
          items:
            type: object
            properties:
              width:
                type: integer
                maximum: 9007199254740991
                minimum: 1
              height:
                type: integer
                maximum: 9007199254740991
                minimum: 1
            required:
            - width
            - height
            additionalProperties: false
        duration_ms:
          description: Detected duration in milliseconds, probed at upload (video and audio assets)
          type: integer
          maximum: 9007199254740991
          minimum: 1
