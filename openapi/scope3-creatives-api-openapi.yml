    CreativeManifestSummary:
      description: Compact creative-manifest view returned by list endpoints. Use `get_creative` for the full resource.
      type: object
      properties:
        creative_id:
          description: Creative manifest ID
          type: string
        campaign_id:
          description: Campaign ID (omitted for advertiser-level masters)
          type: string
        name:
          description: Manifest name
          type: string
        format_id:
          description: ADCP format identifier
          type: object
          properties:
            id:
              type: string
            agent_url:
              type: string
            width:
              type: number
            height:
              type: number
            duration_ms:
              type: number
          required:
          - id
          - agent_url
          additionalProperties: {}
        format_kind:
          description: AdCP 3.1 canonical format kind (e.g. image_carousel, video_hosted)
          type: string
        template_id:
          description: Creative template used for this manifest
          type: string
        brand_domain:
          description: Brand domain (auto-resolved)
          type: string
        preview_url:
          description: URL to preview the processed creative (processed HTML hosted in GCS)
          type: string
          format: uri
        requires_upgrade:
          description: True when this creative has no format_kind and must be upgraded before it can be assigned to new media buys. Call POST .../upgrade to set format_kind and clear this flag.
          type: boolean
        reuse_count:
          description: Number of campaigns this creative is actively attached to. A reuse signal for the advertiser library (returned on the advertiser-scoped list); omitted on single-manifest reads.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        creative_role:
          description: Advertiser-library role (evergreen or reference). Absent for flight-specific creatives that live on their campaign.
          allOf:
          - $ref: '#/components/schemas/CreativeRole'
        creative_source:
          description: Provenance of the creative (uploaded/generated/connected). Today always "uploaded".
          allOf:
          - $ref: '#/components/schemas/CreativeSource'
        platform_links:
          description: Provider/sales-agent creative identifiers captured from sync_creatives for round-trip comparison.
          type: array
          items:
            $ref: '#/components/schemas/CreativeManifestPlatformLink'
        created_at:
          description: Created timestamp
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_at:
          description: Updated timestamp
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        asset_count:
          description: Number of uploaded assets in this manifest. Replaces the embedded `assets[]` array on summary rows.
          example: 3
          type: integer
          minimum: 0
          maximum: 9007199254740991
        primary_asset_type:
          description: The dominant media asset type (VIDEO > AUDIO > IMAGE/HTML) — lets clients classify a creative by medium even when format_kind is absent (e.g. a bare upload). Omitted when the manifest has no media asset.
          type: string
          enum:
          - IMAGE
          - VIDEO
          - AUDIO
          - HTML
          - JAVASCRIPT
          - CSS
          - TEXT
          - URL
          - VAST
          - FONT
          - LOGO
          - DOCUMENT
        sync_status:
          description: Compact sync status across sales agents. Use `get_creative` for the full sync metadata (including `last_synced_at`).
          type: object
          properties:
            synced:
              description: True when the manifest is synced with at least one agent
              type: boolean
            agent_count:
              description: Number of sales agents the manifest is synced with
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
          - synced
          - agent_count
          additionalProperties: false
        target_format_ids:
          description: Additional format IDs this creative covers beyond its primary format_id.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              agent_url:
                type: string
              width:
                type: number
              height:
                type: number
              duration_ms:
                type: number
            required:
            - id
            - agent_url
            additionalProperties: {}
        placements:
          description: Resolved placements this creative maps to (primary + target formats), named against the campaign's required placements. Populated by the campaign creative-manifest list.
          type: array
          items:
            type: object
            properties:
              placement_id:
                type: string
              placement_name:
                type: string
            required:
            - placement_id
            - placement_name
            additionalProperties: false
      required:
      - creative_id
      - name
      - created_at
      - updated_at
      - asset_count
      additionalProperties: false
    ProductFormatOptionParams:
