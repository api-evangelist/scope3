    AssignCreativeToCampaignBody:
      description: Assign an advertiser-library creative to a campaign
      type: object
      properties:
        campaignId:
          description: Campaign ID to assign the creative to
          type: string
          minLength: 1
      required:
      - campaignId
    BulkUpdateCreativeSelection:
      description: Selectors for a campaign-scoped bulk creative update
      type: object
      properties:
        collection_id:
          description: Creative collection ID to use as the matched set. Only creative members in the collection are included.
          type: string
          minLength: 1
          maxLength: 255
        creative_ids:
          description: Exact creative IDs to include
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
            minLength: 1
        name_contains:
          description: Case-insensitive partial creative name match
          type: string
          minLength: 1
          maxLength: 200
        created_after:
          description: Include creatives created at or after this ISO timestamp
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        created_before:
          description: Include creatives created at or before this ISO timestamp
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_after:
          description: Include creatives updated at or after this ISO timestamp
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_before:
          description: Include creatives updated at or before this ISO timestamp
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        template_id:
          description: Match creatives using this template ID
          type: string
          minLength: 1
          maxLength: 255
        format_kind:
          description: Match creatives using this canonical format kind
          type: string
          minLength: 1
          maxLength: 255
        asset_type:
          description: Match creatives containing at least one active asset type
          type: string
          enum:
          - IMAGE
          - VIDEO
          - AUDIO
          - HTML
          - JAVASCRIPT
          - CSS
          - TEXT
          - URL
          - VAST
          - FONT
          - LOGO
          - DOCUMENT
    UpdateCreativeManifestMetadata:
      description: JSON metadata for updating a creative manifest
      type: object
      properties:
        name:
          description: Updated manifest name
          type: string
          minLength: 1
          maxLength: 255
        message:
          description: Updated creative brief
          type: string
          maxLength: 5000
        format_id:
          description: Updated legacy-v1 ADCP named-format ref
          type: object
          properties:
            agent_url:
              type: string
            id:
              type: string
              pattern: ^[a-zA-Z0-9_-]+$
