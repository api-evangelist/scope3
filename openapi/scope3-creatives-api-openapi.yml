          - id
          additionalProperties: {}
        format_kind:
          description: Updated AdCP 3.1 canonical format kind. Alternative to format_id for canonical formats.
          anyOf:
          - type: string
            enum:
            - image
          - type: string
            enum:
            - html5
          - type: string
            enum:
            - display_tag
          - type: string
            enum:
            - image_carousel
          - type: string
            enum:
            - video_hosted
          - type: string
            enum:
            - video_vast
          - type: string
            enum:
            - audio_hosted
          - type: string
            enum:
            - audio_daast
          - type: string
            enum:
            - sponsored_placement
          - type: string
            enum:
            - native_in_feed
          - type: string
            enum:
            - responsive_creative
          - type: string
            enum:
            - agent_placement
          - type: string
            enum:
            - custom
        format_option_ref:
          description: Updated format_option_ref. Accepts scope:"publisher" (requires publisher_domain) or scope:"product". Legacy flat shape without scope is also accepted.
          oneOf:
          - type: object
            properties:
              scope:
                type: string
                enum:
                - publisher
              publisher_domain:
                type: string
              format_option_id:
                type: string
            required:
            - scope
            - publisher_domain
            - format_option_id
            additionalProperties: false
          - type: object
            properties:
              scope:
                type: string
                enum:
                - product
              format_option_id:
                type: string
            required:
            - scope
            - format_option_id
            additionalProperties: false
          type: object
        industry_identifiers:
          description: Updated industry identifiers. Replaces existing list.
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - ad_id
                - isci
                - clearcast_clock
                - idcrea
              value:
                type: string
            required:
            - type
            - value
        target_format_ids:
          description: Additional format IDs this creative covers beyond its primary format_id. Replaces the existing list.
          type: array
          items:
            type: object
            properties:
              agent_url:
                type: string
              id:
                type: string
                pattern: ^[a-zA-Z0-9_-]+$
              width:
                type: number
                minimum: 1
              height:
                type: number
                minimum: 1
              duration_ms:
                type: number
                minimum: 1
            required:
            - agent_url
            - id
            additionalProperties: {}
        template_id:
          description: Updated creative template ID
          type: string
        click_url:
          description: Canonical click-through URL. Server assigns this to the AdCP click_url slot and refreshes click tracking metadata.
          type: string
          format: uri
        url_asset:
          description: Add a single URL asset (per AdCP url-asset spec). For multi-slot formats (e.g. native), use `url_assets` instead.
          type: object
          properties:
            url:
              description: URL to add as asset (must be http/https)
              type: string
              format: uri
            url_type:
              description: URL type classification
              type: string
              enum:
              - clickthrough
              - tracker_pixel
              - tracker_script
              - vast
          required:
          - url
          - url_type
        url_assets:
          description: URL assets assigned to specific AdCP format slots. Each entry replaces any existing asset assigned to the same slot asset_id.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/UrlAssetSlotInput'
        text_assets:
          description: Text assets assigned to specific AdCP format slots. Each entry replaces any existing asset assigned to the same slot asset_id.
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/TextAssetSlotInput'
        webhook_asset:
          description: Add a webhook asset for DCO (dynamic content).
          type: object
          properties:
            url:
              description: URL to add as asset (must be http/https)
              type: string
              format: uri
            method:
              type: string
              enum:
              - GET
              - POST
            timeout_ms:
              type: integer
              minimum: 10
              maximum: 5000
            response_type:
