aid: scope3
name: Scope3
description: >-
  Scope3 is the source of truth for greenhouse-gas emissions data in media and advertising,
  and operates the Interchange for agent-to-agent (agentic) advertising. Its APIs let buyers,
  publishers, and platforms measure the carbon footprint of every ad impression and creative
  across channels, benchmark against country/channel percentiles, and run AI-powered
  programmatic advertising through an agentic buyer/storefront platform. Scope3 exposes three
  public API surfaces: the Carbon Calculator (Measurement) API at api.scope3.com/v2, the AI
  Impact Measurement API at aiapi.scope3.com (energy, gCO2e, and water per inference), and the
  Agentic Platform at api.agentic.scope3.com with a hosted MCP server, a `scope3` CLI, and
  published buyer/storefront Agent Skills. Backed by GV.
