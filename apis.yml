aid: scope3
name: Scope3
description: >-
  Scope3 is the source of truth for greenhouse-gas emissions data in media and advertising, and
  operates Scope3 Interchange, an agentic advertising platform where buyer agents and seller
  storefronts transact on the open Ad Context Protocol (AdCP). Its APIs let buyers, publishers
  and platforms measure the carbon footprint of every ad impression and creative across
  channels, benchmark against country/channel percentiles, and run AI-driven programmatic
  advertising end to end. Scope3 publishes four OpenAPI documents across three surfaces: the
  Carbon Calculator (Measurement) API at api.scope3.com/v2, the AI Impact Measurement API at
  aiapi.scope3.com (energy, gCO2e and water per inference), and the Interchange Buyer and
  Storefront v2 APIs at api.interchange.io with 481 operations between them. Interchange is
  built for AI agents as primary callers: hosted remote MCP endpoints with OAuth (RFC 8414
  metadata, dynamic client registration, PKCE), an A2A agent card, three published Agent
  Skills, a documented error envelope, IETF draft-7 rate-limit headers and a published IU
  pricing model. Backed by GV.
