  rest: [mcpApiCall]
  binding: rest
  confidence: high
  note: >-
    Documented as "Make authenticated REST API calls to any endpoint"; requires a named
    `operation`, with no raw method+endpoint mode. Transitively binds all 481 published
    buyer + storefront operations. mcpApiCall (POST /api-call) is its REST twin in both specs.
- tool: ask_about_capability
