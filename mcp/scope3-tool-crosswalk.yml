binding_model: >-
  Scope3 does not expose one MCP tool per REST operation. The Interchange MCP server is a
  GATEWAY: three core tools cover the entire REST surface, and the operation is selected by
  the `operation` argument to api_call rather than by tool name. Each core tool therefore
  binds to a whole family of operationIds, and the real inputSchema for any given call is the
  backing OpenAPI operation's parameters + requestBody. Every core tool also has a first-class
  REST twin under the `MCP` tag in the buyer and storefront specs, which is what makes this
  crosswalk high-confidence despite tools/list being auth-gated.
