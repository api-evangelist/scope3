note: >-
  Derived from the four published specs — path structure, tag grouping, and id-reference field
  names in components.schemas. The 2026-07-21 version described the agentic platform from the
  SDK README only, because no agentic OpenAPI had been found; this round replaces that guess
  with an entity graph read out of the real Buyer (462 schemas) and Storefront (443 schemas)
  documents. Nothing here is inferred beyond what the specs declare.
