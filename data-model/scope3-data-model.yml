entities:
- name: Account
  domain: interchange-buyer, interchange-storefront
  id_field: accountId
  path_root: /accounts
  notes: >-
    The organization an API key or OAuth session resolves to. One billing organization holds
    one IU plan and wallet shared by buyer, storefront and Murph activity.
- name: Advertiser
  domain: interchange-buyer
  id_field: advertiserId
  path_root: /advertisers
  operations: 43
  notes: >-
    Buyer entity. Requires a verified brand domain before any advertiser action. Owns
    campaigns, creatives, property lists, catalogs and pricing rules.
- name: Campaign
  domain: interchange-buyer
  id_field: campaignId
  path_root: /campaigns
  operations: 29
  notes: >-
    Acts as the cart for product selection, then executes into media buys. Lifecycle
    operations include execute, pause, reactivate, auto-select products and delete.
- name: MediaBuy
  domain: interchange-buyer, interchange-storefront
  id_field: mediaBuyId
  path_root: /media-buys
  notes: >-
    The unit dispatched to a seller. Execution spans bilateral seller calls and is explicitly
    not atomic. Has its own ADCP status and approval mode.
- name: Product
  domain: interchange-buyer, interchange-storefront
  id_field: productId
  notes: The sellable unit a storefront lists and a buyer discovers, selects and buys.
- name: Discovery
  domain: interchange-buyer
  path_root: /discovery
  notes: >-
    A pre-campaign product-discovery session with its own selection set, refinement and
    revision events (the sole published webhook event type is discovery.revision).
- name: Creative
  domain: interchange-buyer
  path_root: /creatives
  operations: 39
  notes: Largest single buyer capability; includes generation, review and campaign mapping.
- name: Storefront
  domain: interchange-storefront
  id_field: storefrontId
  path_root: /storefront
  operations: 159
  notes: >-
    Publisher/seller entity. Distinguishes registered domain, operator domain and publisher
    domains, where only publisher domains (authorized via each domain's adagents.json) are the
    inventory being sold.
- name: InventorySource
  domain: interchange-storefront
  id_field: sourceId
  path_root: /inventory-sources
  operations: 40
  notes: Where a storefront's avails come from; includes modular source feeds and ad-server sources.
- name: Agent
  domain: interchange-storefront
  id_field: agentId
  path_root: /agents
  notes: A sales/storefront agent that transacts on AdCP.
- name: Signal
  domain: interchange-storefront, measurement
  id_field: signal_id
  notes: >-
    The most referenced id in the storefront spec (68 occurrences). Also the measurement-side
    media-quality signal attached to a saved property list.
- name: RateCard
  domain: interchange-buyer, interchange-storefront
  id_field: rateCardId
  notes: >-
    The Organization IU Rate Card. Accepting an exact revision requires offerVersion, planId
    and a required idempotencyKey.
- name: Plan
  domain: interchange-buyer, interchange-storefront
  id_field: planId
  notes: A commercial package on a rate-card revision (Pay as you go / 250 / 1,000).
- name: Contract
  domain: interchange-storefront
  id_field: contractId
  notes: Governs source, tenant and pricing checks on inventory feeds.
- name: CommercialOffer
  domain: interchange-buyer
  id_field: commercialOfferId
  notes: A versioned commercial document with an agreementDocumentId and acceptance state.
- name: PricingOption
  domain: interchange-storefront
  id_field: pricing_option_id
  notes: Second most referenced id in the storefront spec (61 occurrences).
- name: WebhookSubscription
  domain: interchange-buyer
  path_root: /webhook-subscriptions
  notes: url + secret + eventTypes; see asyncapi/scope3-webhooks.yml.
- name: Model
  domain: ai-impact
  id_field: modelId
  notes: An AI model tracked for impact; has aliases and belongs to a Family.
- name: Node
  domain: ai-impact
  id_field: nodeId
  notes: Compute node hosting inference.
- name: GPU
  domain: ai-impact
  id_field: gpuId
  notes: GPU hardware profile used in energy/impact modeling.
- name: Impact
  domain: ai-impact
  notes: Computed environmental impact (energy Wh, gCO2e, mLH2O) for an inference row.
- name: Segment
  domain: measurement
  id_field: segmentId
  notes: Organization data segment.
- name: SavedList
  domain: measurement
  id_field: saved_list_id
  notes: Property list with domain-level media-quality signals.
